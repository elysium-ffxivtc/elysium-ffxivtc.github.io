<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <title>Staff ✦ Elysium</title>
  <link rel="icon" type="image/png" href="image/Elysium_LOGO_mini.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .staff-section {
      max-width: 680px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 4rem;
    }
    .staff-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.05rem;
      letter-spacing: .22em;
      color: var(--gold, #8a5c1e);
      text-align: center;
      margin-bottom: 2.4rem;
    }
    .staff-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    @media (max-width: 560px) {
      .staff-grid { grid-template-columns: 1fr; }
    }
    .staff-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      padding: 1.6rem 1rem;
      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      text-decoration: none;
      color: inherit;
      transition: border-color .18s, box-shadow .18s;
    }
    .staff-card:hover {
      border-color: var(--gold, #8a5c1e);
      box-shadow: 0 2px 12px rgba(138,92,30,.1);
    }
    .staff-card-icon {
      width: 38px;
      height: 38px;
      opacity: .55;
    }
    .staff-card-name {
      font-family: 'Noto Serif TC', serif;
      font-size: .88rem;
      letter-spacing: .1em;
      color: #1a1208;
    }
    .staff-card-sub {
      font-size: .72rem;
      color: #9a8a72;
      letter-spacing: .06em;
    }
  </style>
</head>

      <a href="pos-system/index.html" class="staff-card">
        <svg class="staff-card-icon" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="8" width="28" height="18" rx="2" stroke="#8a5c1e" stroke-width="1.5" fill="none"/>
          <path d="M13 30h12M19 26v4" stroke="#8a5c1e" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M10 14h5M10 18h10" stroke="#8a5c1e" stroke-width="1.5" stroke-linecap="round"/>
