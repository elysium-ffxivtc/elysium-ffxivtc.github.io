<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elysium</title>
  <link rel="icon" type="image/png" href="image/Elysium_LOGO_mini_dark.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', 'Helvetica Neue', sans-serif;
      background: #111010;
      color: #d4c8b8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      width: 44px;
      opacity: .7;
      margin-bottom: 1.6rem;
    }
    .title {
      font-size: .75rem;
      letter-spacing: .28em;
      color: #6b5a3e;
      text-transform: uppercase;
      margin-bottom: 2.4rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .75rem;
      width: 100%;
      max-width: 480px;
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; max-width: 260px; }
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
      padding: 1.4rem .8rem 1.2rem;
      background: #1a1814;
      border: 1px solid #2a2520;
      text-decoration: none;
      color: #c8baa8;
      transition: border-color .18s, background .18s;
      cursor: pointer;
    }
    .card:hover {
      background: #201e1a;
      border-color: #885B22;
      color: #e0cfa8;
    }
    .card svg { opacity: .6; }
    .card:hover svg { opacity: .9; }
    .card-name {
      font-size: .8rem;
      letter-spacing: .1em;
    }
  </style>
</head>
<body>

  <img class="logo" src="image/Elysium_LOGO_mini_dark.png" alt="Elysium">
  <div class="title">Staff Portal</div>

  <div class="grid">

    <a href="index.html" class="card">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M14 3L4 10v15h7v-6h6v6h7V10L14 3z" stroke="#c8a87a" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="card-name">官方網站</div>
    </a>

    <a href="pos-system/index.html" class="card">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect x="3" y="6" width="22" height="14" rx="1.5" stroke="#c8a87a" stroke-width="1.3" fill="none"/>
        <path d="M9 22h10M14 20v2" stroke="#c8a87a" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M7 11h4M7 14.5h7" stroke="#c8a87a" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <div class="card-name">POS 系統</div>
    </a>

    <a href="pos-system/schedule.html" class="card">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect x="4" y="6" width="20" height="17" rx="1.5" stroke="#c8a87a" stroke-width="1.3" fill="none"/>
        <path d="M9 4v4M19 4v4M4 13h20" stroke="#c8a87a" stroke-width="1.3" stroke-linecap="round"/>
        <rect x="8" y="16" width="3" height="3" rx=".4" fill="#c8a87a" opacity=".5"/>
        <rect x="12.5" y="16" width="3" height="3" rx=".4" fill="#c8a87a" opacity=".5"/>
        <rect x="17" y="16" width="3" height="3" rx=".4" fill="#c8a87a" opacity=".5"/>
      </svg>
      <div class="card-name">排班系統</div>
    </a>

  </div>

</body>
</html>
