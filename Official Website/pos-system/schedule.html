<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安息地 · 排班系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --gold:     #c8984a;
      --gold-dim: rgba(200,152,74,.15);
      --bg:       #141414;
      --panel:    #1c1c1c;
      --card:     #242424;
      --border:   rgba(255,255,255,.11);
      --text:     #f0ece8;
      --dim:      #9a9a9a;
      --green:    #5aaa7a;
      --green-dim:rgba(90,170,122,.14);
      --red:      #d06060;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    .hdr { display: flex; align-items: center; justify-content: space-between; padding: .65rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; position: sticky; top: 0; z-index: 100; }
    .hdr-title { font-family: 'Noto Serif TC', serif; font-size: .95rem; color: var(--gold); letter-spacing: .15em; }
    .hdr-clock { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: .5rem; }
    .hdr-clock-time { font-family: 'Noto Serif TC', serif; font-size: .95rem; color: var(--gold); letter-spacing: .05em; }
    .hdr-clock-date { font-size: 12px; color: var(--dim); }
    .user-badge { display: flex; align-items: center; gap: .5rem; font-size: 12px; min-width: 0; }
    .user-badge-name { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80px; }

    /* ── Main ── */
    .main { flex: 1; padding: 1rem 1.5rem; max-width: 1400px; width: 100%; margin: 0 auto; }

    /* ── Tabs ── */
    .tab-row { display: flex; gap: .5rem; margin-bottom: .85rem; border-bottom: 1px solid var(--border); padding-bottom: .7rem; }
    .tab-btn { padding: .35rem .85rem; font-size: 13px; background: none; border: 1px solid transparent; color: var(--dim); cursor: pointer; font-family: inherit; transition: all .15s; }
    .tab-btn.on { border-color: var(--gold); color: var(--gold); }
    .tab-btn:hover { color: var(--text); }
    .sub-tab-row { display: flex; gap: 2px; margin-bottom: 0; }
    .sub-tab-btn { padding: .35rem 1.1rem .42rem; font-size: 12px; background: var(--panel); border: 1px solid var(--border); border-bottom: none; color: var(--dim); cursor: pointer; font-family: inherit; transition: all .15s; position: relative; top: 1px; z-index: 0; }
    .sub-tab-btn.on { background: var(--card); border-color: var(--gold); border-bottom: 1px solid var(--card); color: var(--gold); z-index: 2; }
    .sub-tab-btn:hover:not(.on) { color: var(--text); border-color: rgba(255,255,255,.3); z-index: 1; }
    .cal-tab-content { background: var(--card); border: 1px solid var(--border); padding: 1.1rem; position: relative; z-index: 1; }

    /* ── Announcement ── */
    .anno-card { background: var(--card); border: 1px solid var(--border); border-left: 2px solid var(--gold); padding: .7rem 1rem; margin-bottom: .75rem; }
    .anno-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .45rem; }
    .anno-label { font-family: 'Noto Serif TC', serif; font-size: 12px; color: var(--gold); letter-spacing: .12em; }
    .anno-text { font-size: 13px; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
    .anno-empty { font-size: 12px; color: var(--dim); cursor: pointer; padding: .4rem 0; }
    .anno-empty:hover { color: var(--gold); }

    /* ── Biz summary ── */
    .biz-sum-card { background: rgba(200,152,74,.14); border-left: 4px solid var(--gold); padding: .9rem 1.15rem; margin-bottom: .75rem; display: flex; align-items: center; gap: 1rem; }
    .biz-sum-num { font-family: 'Noto Serif TC', serif; font-size: 3rem; font-weight: 700; color: #e8b060; line-height: 1; min-width: 3rem; text-align: center; }
    .biz-sum-title { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: .03em; }
    .biz-sum-dates { font-size: 12px; color: #e8b060; margin-top: .3rem; line-height: 1.6; }

    /* ── Two-column layout ── */
    .schedule-layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 1.25rem; align-items: start; }
    @media (max-width: 640px) {
      /* ── Header ── */
      .hdr { padding: .5rem .7rem; gap: .5rem; }
      .hdr-title { font-size: .82rem; letter-spacing: .08em; white-space: nowrap; }
      .hdr-clock-date { display: none; }
      .hdr-clock-time { font-size: .82rem; }

      /* ── Main ── */
      .main { padding: .55rem .45rem; }
      .cal-tab-content { padding: .6rem .4rem; }

      /* ── Calendar ── */
      .cal-weekrow, .cal-grid { gap: 1px; }
      .cal-day { padding: 3px 2px 2px; }
      .cal-day-num { font-size: 9px; padding: 1px 2px; margin-bottom: 1px; }
      .slot-row { min-height: 18px; padding: 1px 2px; }
      .slot-hr { font-size: 9px; }
      .slot-hr::before { content: attr(data-hour); }
      .slot-cnt { font-size: 9px; padding: 0 2px; min-width: 12px; }

      /* ── Sub-tab bar ── */
      .sub-tab-btn { padding: .32rem .8rem .38rem; font-size: 11px; }

      /* ── Personal panel ── */
      .schedule-layout { grid-template-columns: 1fr; }
      .personal-panel { position: static; }
      .panel-card { max-height: none; }

      /* ── Cards ── */
      .card { padding: .75rem .8rem; }

      /* ── Modal ── */
      .modal-overlay { padding-top: 2vh; align-items: flex-start; }
      .modal-box { padding: 1rem .9rem; width: 100%; max-width: 100vw; max-height: 92vh; border-left: none; border-right: none; border-radius: 0; }

      /* ── Accounts rows ── */
      .acct-row { font-size: 12px; }

      /* ── Auth box ── */
      .auth-box { width: 100%; padding: 2rem 1.5rem; }

      /* ── Announcement / Biz summary ── */
      .anno-text { font-size: 12px; }
      .biz-sum-card { padding: .65rem .85rem; }
      .biz-sum-num { font-size: 2.4rem; min-width: 2.4rem; }
    }

    /* ── Month nav ── */
    .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; }
    .month-title { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--gold); letter-spacing: .08em; }
    .nav-btn { background: none; border: 1px solid var(--border); color: var(--dim); padding: .25rem .6rem; cursor: pointer; font-size: 14px; font-family: inherit; transition: all .15s; line-height: 1; }
    .nav-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Legend ── */
    .legend { display: flex; align-items: center; gap: .75rem; margin-bottom: .55rem; flex-wrap: wrap; }
    .legend-swatch { display: inline-flex; align-items: center; gap: .3rem; font-size: 11px; color: var(--dim); }
    .swatch-box { width: 10px; height: 10px; border: 1px solid; flex-shrink: 0; }
    .swatch-box.mine { background: var(--green-dim); border-color: var(--green); }
    .swatch-box.avail { background: none; border-color: rgba(255,255,255,.18); }
    .biz-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
    .biz-dot.open { background: var(--green); }
    .biz-dot.closed { background: var(--red); }

    /* ── Calendar ── */
    .cal-weekrow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-weekrow { margin-bottom: 1px; }
    .cal-weekday { text-align: center; font-size: 10px; color: var(--dim); padding: .2rem 0; }
    .cal-weekday.weekend { color: var(--red); opacity: .75; }
    .cal-day.weekend { background: rgba(208,96,96,.04); }
    .cal-day.weekend .cal-day-num { color: rgba(208,96,96,.6); background: rgba(208,96,96,.06); border-bottom-color: rgba(208,96,96,.15); }
    .cal-day.today.weekend .cal-day-num { color: var(--gold); background: rgba(200,152,74,.08); }
    .cal-day { background: var(--card); border: 1px solid var(--border); padding: 5px 5px 4px; }
    .cal-day.today      { border-color: rgba(200,152,74,.5); }
    .cal-day.other-month { opacity: .2; pointer-events: none; }
    .cal-day.past        { opacity: .38; }
    .cal-day.biz-day    { border: 1px solid rgba(90,170,122,.45); border-top: 3px solid rgba(90,170,122,.65); }
    .cal-day.today.biz-day { border-color: rgba(200,152,74,.6); border-top-color: rgba(200,152,74,.8); }
    .cal-day-num { font-size: 11px; color: var(--dim); padding: 2px 4px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.04); display: flex; align-items: center; gap: 2px; line-height: 1.3; margin-bottom: 2px; }
    .cal-day.today .cal-day-num { color: var(--gold); font-weight: 700; background: rgba(200,152,74,.08); }
    .cal-day-num.clickable { cursor: pointer; }
    .cal-day-num.clickable:hover { background: rgba(255,255,255,.05); color: var(--gold); }

    /* ── Slot rows ── */
    .slot-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1px 2px; cursor: pointer; transition: background .1s;
      min-height: 22px; border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .slot-row:last-child { border-bottom: none; }
    .slot-row:hover { background: rgba(255,255,255,.05); }
    .slot-row.mine { background: var(--gold-dim); }
    .slot-row.mine:hover { background: rgba(200,152,74,.22); }
    .slot-hr { font-size: 11px; color: rgba(255,255,255,.28); }
    @media (min-width: 641px) { .slot-hr::before { content: attr(data-time); } }
    .slot-row.mine .slot-hr { color: var(--gold); }
    .slot-row.has-staff .slot-hr { color: rgba(255,255,255,.6); }
    .slot-cnt { font-size: 11px; color: rgba(255,255,255,.3); background: rgba(255,255,255,.07); padding: 0 3px; min-width: 14px; text-align: center; }
    .slot-row.mine .slot-cnt { color: var(--gold); background: rgba(200,152,74,.2); }
    .slot-row.has-staff .slot-cnt { color: var(--dim); }
    .slot-row.locked { opacity: .35; cursor: not-allowed; }
    .slot-row.locked .slot-hr { color: rgba(255,255,255,.2); }
    .slot-row.mine.on-leave { background: rgba(208,96,96,.13); }
    .slot-row.mine.on-leave:hover { background: rgba(208,96,96,.2); }
    .slot-row.mine.on-leave .slot-hr { color: var(--red); opacity: .8; }
    .slot-row.mine.on-leave .slot-cnt { color: var(--red); background: rgba(208,96,96,.2); }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: .5rem 1.2rem; font-size: 13px; z-index: 9999; pointer-events: none; transition: opacity .35s; white-space: nowrap; }

    /* ── Personal panel ── */
    .personal-panel { position: sticky; top: 56px; }
    .panel-card { background: var(--card); border: 1px solid var(--border); padding: .85rem; max-height: calc(100vh - 80px); overflow-y: auto; }
    .panel-actions { display: flex; flex-direction: column; gap: .38rem; margin-bottom: .75rem; }
    .panel-name { font-weight: 500; font-size: 14px; }
    .panel-role { font-size: 11px; color: var(--dim); margin-top: .15rem; margin-bottom: .75rem; }
    .panel-section-title { font-size: 11px; color: var(--dim); letter-spacing: .07em; padding-bottom: .35rem; border-bottom: 1px solid var(--border); margin-bottom: .55rem; }
    .panel-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; margin-bottom: .75rem; }
    .panel-stat { background: var(--bg); border: 1px solid var(--border); padding: .5rem .5rem .4rem; text-align: center; }
    .panel-stat-num { font-family: 'Noto Serif TC', serif; font-size: 1.5rem; font-weight: 700; color: var(--gold); line-height: 1; }
    .panel-stat-label { font-size: 10px; color: var(--dim); margin-top: .2rem; }
    .panel-date-row { margin-bottom: .45rem; }
    .panel-date-label { font-size: 11px; color: var(--gold); margin-bottom: .15rem; }
    .panel-time-row { display: flex; align-items: center; justify-content: space-between; padding-left: .5rem; margin: .1rem 0; }
    .panel-time-lbl { font-size: 11px; color: var(--text); }
    .panel-time-leave-tag { font-size: 10px; color: var(--red); margin-left: .3rem; opacity: .85; }
    .panel-empty { font-size: 12px; color: var(--dim); }

    /* ── Export table ── */
    .export-wrap { overflow: auto; max-height: calc(80vh - 160px); }
    .export-tbl { border-collapse: collapse; font-size: 12px; width: 100%; }
    .export-tbl th { background: var(--panel); border: 1px solid var(--border); padding: .42rem .75rem; color: var(--gold); font-weight: 500; white-space: nowrap; text-align: center; }
    .export-tbl td { background: var(--bg); border: 1px solid var(--border); padding: .38rem .65rem; vertical-align: top; }
    .export-tbl .date-col { text-align: center; white-space: nowrap; color: var(--gold); font-family: 'Noto Serif TC', serif; font-size: 12px; }
    .export-tbl .biz-row td { border-top: 2px solid rgba(90,170,122,.35); }
    .export-person { display: block; font-size: 11px; line-height: 1.75; color: var(--text); }
    .export-person.leave { color: var(--red); text-decoration: line-through; opacity: .65; }

    /* ── Segmented toggle (modals) ── */
    .seg-row { display: flex; }
    .seg-btn { flex: 1; padding: .33rem .5rem; font-size: 12px; background: none; border: 1px solid var(--border); color: var(--dim); cursor: pointer; font-family: inherit; transition: all .15s; margin-right: -1px; position: relative; text-align: center; }
    .seg-btn.on { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); z-index: 1; }
    .seg-btn:hover:not(.on) { color: var(--text); border-color: rgba(255,255,255,.25); z-index: 1; }
    .seg-btn:disabled { opacity: .25; cursor: not-allowed; }

    /* ── Buttons ── */
    .btn { padding: .48rem 1rem; font-size: 13px; cursor: pointer; border: none; font-family: inherit; transition: all .15s; }
    .btn-gold { background: var(--gold); color: #1c1208; font-weight: 600; }
    .btn-gold:hover { background: #d4a456; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-danger { background: none; border: 1px solid var(--red); color: var(--red); }
    .btn-danger:hover { background: rgba(208,96,96,.1); }
    .btn-sm { padding: .28rem .65rem; font-size: 12px; }
    .btn-xs { padding: .18rem .5rem; font-size: 11px; }

    /* ── Forms ── */
    .form-label { font-size: 12px; color: var(--dim); margin-bottom: .28rem; }
    .form-input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: .45rem .65rem; font-size: 13px; font-family: inherit; }
    .form-input:focus { outline: none; border-color: var(--gold); }
    .form-grid { display: grid; gap: .65rem; }
    textarea.form-input { resize: vertical; min-height: 90px; }

    /* ── Cards ── */
    .card { background: var(--card); border: 1px solid var(--border); padding: .9rem 1rem; margin-bottom: .75rem; }
    .card-title { font-size: 11px; color: var(--dim); letter-spacing: .08em; margin-bottom: .65rem; }
    .acct-row { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; padding: .45rem 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
    .acct-row:last-child { border-bottom: none; }

    /* ── Auth overlay ── */
    .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .auth-box { text-align: center; width: 340px; padding: 2rem; }
    .auth-logo { font-family: 'Noto Serif TC', serif; font-size: 2.2rem; color: var(--gold); letter-spacing: .25em; margin-bottom: .4rem; }
    .auth-tagline { font-size: 13px; color: var(--dim); margin-bottom: 2.5rem; letter-spacing: .08em; }
    .auth-google-btn { display: flex; align-items: center; justify-content: center; gap: .75rem; background: #fff; color: #3c4043; border: none; padding: .85rem 1.5rem; font-size: 14px; cursor: pointer; width: 100%; font-family: inherit; font-weight: 500; transition: box-shadow .15s; }
    .auth-google-btn:hover { box-shadow: 0 2px 12px rgba(0,0,0,.35); }
    .auth-err { color: var(--red); font-size: 13px; margin-top: .75rem; min-height: 1.2em; }
    .auth-info-box { background: var(--card); border: 1px solid var(--border); padding: .7rem 1rem; margin-top: 1rem; font-size: 13px; }

    /* ── Modals ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 500; display: none; align-items: flex-start; justify-content: center; padding-top: 5vh; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--panel); border: 1px solid var(--border); padding: 1.4rem; width: 360px; max-width: 96vw; max-height: 85vh; overflow-y: auto; }
    .modal-title { font-family: 'Noto Serif TC', serif; font-size: .95rem; color: var(--gold); margin-bottom: 1rem; letter-spacing: .1em; }
    .modal-actions { display: flex; gap: .6rem; justify-content: flex-end; margin-top: 1rem; }
    .day-slot-block { margin-bottom: 1rem; }
    .day-slot-hdr { font-size: 12px; color: var(--gold); padding-bottom: .3rem; border-bottom: 1px solid var(--border); margin-bottom: .5rem; display: flex; align-items: center; justify-content: space-between; }
    .person-row { display: flex; align-items: center; justify-content: space-between; padding: .3rem 0; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 13px; }
    .person-row:last-of-type { border-bottom: none; }
    .biz-toggle-row { display: flex; align-items: center; justify-content: space-between; padding-bottom: .85rem; margin-bottom: .85rem; border-bottom: 1px solid var(--border); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-title">✦ 安息地 · 排班系統</div>
  <div style="display:flex;align-items:center;gap:.85rem">
    <div id="hdr-clock" class="hdr-clock"></div>
    <div id="user-badge" class="user-badge" style="display:none"></div>
  </div>
</header>

<div class="main" id="main" style="display:none"></div>

<!-- ── Auth overlay ── -->
<div id="auth-overlay" class="auth-overlay">
  <div id="auth-loading" class="auth-box">
    <div style="color:var(--dim);font-size:15px;letter-spacing:.1em">驗證中…</div>
  </div>
  <div id="auth-login" class="auth-box" style="display:none">
    <div class="auth-logo">安息地</div>
    <div class="auth-tagline">排班系統</div>
    <button class="auth-google-btn" onclick="signInGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink:0">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      使用 Google 帳號登入
    </button>
    <div class="auth-err" id="auth-err"></div>
  </div>
  <div id="auth-pending" class="auth-box" style="display:none">
    <div class="auth-logo" style="font-size:1.5rem;margin-bottom:1rem">等待授權</div>
    <div style="color:var(--dim);font-size:13px;line-height:1.8;margin-bottom:1rem">你的帳號尚未取得授權。<br>請將以下 Email 提供給管理員：</div>
    <div class="auth-info-box" style="color:var(--gold)" id="auth-pending-email"></div>
    <button class="btn btn-outline" style="width:100%;margin-top:1rem" onclick="doSignOut()">登出</button>
  </div>
  <div id="auth-bootstrap" class="auth-box" style="display:none">
    <div class="auth-logo" style="font-size:1.5rem;margin-bottom:.5rem">初始設定</div>
    <div style="color:var(--dim);font-size:13px;line-height:1.8;margin-bottom:1rem">系統尚無任何帳號。<br>請設定你的管理員遊戲ID：</div>
    <div class="form-label" style="text-align:left">遊戲ID（角色名）</div>
    <input id="bs-name" class="form-input" style="margin-bottom:.75rem">
    <div style="font-size:12px;color:var(--dim);margin-bottom:1rem" id="bs-email"></div>
    <button class="btn btn-gold" style="width:100%" onclick="doBootstrap()">設定為管理員帳號</button>

<script type="module">
import { initializeApp }    from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getDatabase, ref as dbRef, onValue, get, set, update, remove } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import { initializeAuth, indexedDBLocalPersistence, browserPopupRedirectResolver, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

  (function tickClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    const el = document.getElementById('hdr-clock');
    if (el) el.innerHTML =
      `<span class="hdr-clock-time">${h}:${m}:${s}</span>` +
      `<span class="hdr-clock-date">${now.getMonth()+1}月${now.getDate()}日（${'日一二三四五六'[now.getDay()]}）</span>`;
    setTimeout(tickClock, 1000 - now.getMilliseconds());
  })();

  const app = initializeApp({
    apiKey:            "AIzaSyCZkdAeMKUWXQPXFptw3t4dYVOBAo7lF5Q",
    authDomain:        "elysiumpos.firebaseapp.com",
    databaseURL:       "https://elysiumpos-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "elysiumpos",
    storageBucket:     "elysiumpos.firebasestorage.app",
    messagingSenderId: "430177597593",
    appId:             "1:430177597593:web:7598eaf6e5e6264dc82008"
  });
  const db   = getDatabase(app);
  const auth = initializeAuth(app, {
    persistence:           [indexedDBLocalPersistence],
    popupRedirectResolver: browserPopupRedirectResolver,
  });

  // ── State ──────────────────────────────────────────────────────
  let currentUser  = null;
  let staff        = [];
  let schedData    = {}; // { 'YYYY-MM-DD_HHMM': { uid: {...} } }
  let bizStatus    = {};
  let announcement = null; // { text, updatedBy, updatedAt }
  let myMemo       = '';
  let discordWebhook = '';
  let adminTab       = 'schedule';
  let scheduleSubTab = 'personal'; // 'personal' | 'full'

  const _now = new Date();
  let viewYear  = _now.getFullYear();
  let viewMonth = _now.getMonth();

  const TIME_SLOTS = ['22:00', '23:00', '00:00', '01:00'];
  const ROLE_LABEL = { admin: '管理員', guide: '引路人', apostle: '使徒' };
  const WEEK_DAYS  = ['日', '一', '二', '三', '四', '五', '六'];
  const WD_FULL    = ['日', '一', '二', '三', '四', '五', '六'];

  function sKey(t)   { return t.replace(':', ''); }
  function esc(s)    { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function isAdmin() { return currentUser && currentUser.role === 'admin'; }
  function todayStr(){ return new Date().toISOString().slice(0, 10); }
  function pad(n)    { return String(n).padStart(2, '0'); }

  let _dayDate = null;
  let _addDate = null;
  let _addTime = null;
  let bulkMode = 'week';
  let bulkSelectedDay = null;
  let _bulkWeeks = [];

  onAuthStateChanged(auth, async user => {
    if (!user) { showScreen('login'); return; }
    try {
      const staffSnap = await get(dbRef(db, 'staff/' + user.uid));
      if (staffSnap.exists()) {
        currentUser = { uid: user.uid, email: user.email, ...staffSnap.val() };
        renderBadge(); hideAuth(); startListeners();
        return;
      }
      const allSnap = await get(dbRef(db, 'staff'));
      if (!allSnap.exists()) {
        showScreen('bootstrap', user);
        return;
      }
      const pendingSnap = await get(dbRef(db, 'pendingStaff/' + user.uid));
      if (pendingSnap.exists()) {
        showScreen('pending', user);
      } else {
        showScreen('register', user);
      }
    } catch(e) {
      document.getElementById('auth-err').textContent = '系統錯誤：' + e.message;
      showScreen('login');
    }
  });

  function showScreen(s, user) {
    document.getElementById('auth-overlay').style.display = 'flex';
    ['login','loading','pending','bootstrap','register'].forEach(id =>
      document.getElementById('auth-' + id).style.display = id === s ? '' : 'none'
    );
    if (s === 'pending'   && user) document.getElementById('auth-pending-email').textContent = user.email;
    if (s === 'bootstrap' && user) { document.getElementById('bs-email').textContent = user.email; window._bsUser = user; }
    if (s === 'register'  && user) { document.getElementById('reg-email').textContent = user.email; window._regUser = user; }
  }

  function hideAuth() {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('main').style.display = '';
  }

  function renderBadge() {
    const el = document.getElementById('user-badge');
    el.style.display = 'flex';
    el.innerHTML = `
      <span class="user-badge-name">${esc(currentUser.displayName)}</span>
      <span style="font-size:11px;color:var(--dim);padding:.1rem .4rem;border:1px solid var(--border);white-space:nowrap;flex-shrink:0">${ROLE_LABEL[currentUser.role]||''}</span>
      <button class="btn btn-outline btn-sm" onclick="doSignOut()" style="font-size:11px;padding:.2rem .55rem;white-space:nowrap;flex-shrink:0">登出</button>`;
  }

  function signInGoogle() {
    document.getElementById('auth-err').textContent = '';
    signInWithPopup(auth, new GoogleAuthProvider())
      .catch(e => { document.getElementById('auth-err').textContent = '登入失敗：' + e.message; });
  }
  function doSignOut() { signOut(auth).then(() => location.reload()); }

  async function doRegister() {
    const user = window._regUser; if (!user) return;
    const gameId = document.getElementById('reg-gameid').value.trim();
    if (!gameId) { document.getElementById('reg-err').textContent = '請輸入遊戲ID'; return; }
    document.getElementById('reg-err').textContent = '';
    await set(dbRef(db, 'pendingStaff/' + user.uid), {
      uid: user.uid, email: user.email,
      displayName: gameId,
      requestedAt: new Date().toISOString()
    });
    showScreen('pending', user);
  }

  async function doBootstrap() {
    const user = window._bsUser; if (!user) return;
    const name = document.getElementById('bs-name').value.trim() || user.displayName || '管理員';
    await set(dbRef(db, 'staff/' + user.uid), {
      uid: user.uid, email: user.email, displayName: name, role: 'admin',
      createdAt: new Date().toISOString()
    });
    await remove(dbRef(db, 'pendingStaff/' + user.uid));
    location.reload();
  }

  // ── Firebase listeners ────────────────────────────────────────
  function startListeners() {
    onValue(dbRef(db, 'schedules'), snap => {
      schedData = snap.val() || {};
      render();
      if (_dayDate && document.getElementById('modal-day').classList.contains('open')) refreshDayModal();
      syncBizStatus();
    });
    onValue(dbRef(db, 'staff'), snap => {
      staff = snap.val() ? Object.values(snap.val()) : [];
      if (adminTab === 'accounts') renderAccounts();
    });
    onValue(dbRef(db, 'bizStatus'), snap => {
      bizStatus = snap.val() || {};
      render();
      if (_dayDate && document.getElementById('modal-day').classList.contains('open')) refreshDayModal();
    });
    onValue(dbRef(db, 'announcement'), snap => {
      announcement = snap.val() || null;
      render();
    });
    onValue(dbRef(db, `memos/${currentUser.uid}`), snap => {
      myMemo = snap.val()?.text || '';
      const el = document.getElementById('memo-input');
      if (el && document.activeElement !== el) el.value = myMemo;
    });
    onValue(dbRef(db, 'settings/discordWebhook'), snap => {
      discordWebhook = snap.val() || '';
    });
  }

  // ── Routing ───────────────────────────────────────────────────
  function render() {
    if (!currentUser) return;
    if (!isAdmin()) { renderScheduleView(); return; }
    if (adminTab === 'schedule')  renderScheduleView();
    else if (adminTab === 'accounts') renderAccounts();
  }

  function setTab(t) { adminTab = t; render(); }

  function tabBar() {
    return `<div class="tab-row">
      <button class="tab-btn${adminTab==='schedule'?' on':''}" onclick="setTab('schedule')">排班月曆</button>
      <button class="tab-btn${adminTab==='accounts'?' on':''}" onclick="setTab('accounts')">帳號管理</button>
    </div>`;
  }

  // ── Schedule view ─────────────────────────────────────────────
  function schedSubTabBar() {
    return `<div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div class="sub-tab-row">
        <button class="sub-tab-btn${scheduleSubTab==='personal'?' on':''}" onclick="setScheduleSubTab('personal')">個人班表</button>
        <button class="sub-tab-btn${scheduleSubTab==='full'?' on':''}" onclick="setScheduleSubTab('full')">完整班表</button>
      </div>
      <button class="btn btn-outline btn-xs" onclick="openExportModal()" style="margin-bottom:1px;font-size:11px;position:relative;top:0">排班總表 ↗</button>
    </div>`;
  }

  function setScheduleSubTab(t) { scheduleSubTab = t; render(); }

  function renderScheduleView() {
    const calBlock = `
      <div class="month-nav">
        <button class="nav-btn" onclick="prevMonth()">‹</button>
        <div class="month-title">${viewYear} 年 ${viewMonth + 1} 月</div>
        <button class="nav-btn" onclick="nextMonth()">›</button>
      </div>
      ${buildLegendHtml(scheduleSubTab === 'full')}
      <div class="cal-weekrow">${WEEK_DAYS.map((d,i)=>`<div class="cal-weekday${i===0||i===6?' weekend':''}">${d}</div>`).join('')}</div>
      <div class="cal-grid">${buildCalGrid(scheduleSubTab === 'full')}</div>`;

    const content = scheduleSubTab === 'personal'
      ? `<div class="schedule-layout">
           <div>${calBlock}</div>
           <div class="personal-panel">${buildPersonalPanel()}</div>
         </div>`
      : calBlock;

    document.getElementById('main').innerHTML = `
      ${isAdmin() ? tabBar() : ''}
      ${buildAnnoHtml()}
      ${buildBizSumHtml()}
      ${schedSubTabBar()}
      <div class="cal-tab-content">${content}</div>`;
  }

  // ── Announcement card ─────────────────────────────────────────
  function buildAnnoHtml() {
    if (!announcement?.text && !isAdmin()) return '';
    if (!announcement?.text) {
      return `<div class="anno-card">
        <div class="anno-header"><span class="anno-label">✦ 公告</span></div>
        <div class="anno-empty" onclick="openAnnoModal()">＋ 點此新增公告</div>
      </div>`;
    }
    return `<div class="anno-card">
      <div class="anno-header">
        <span class="anno-label">✦ 公告</span>
        ${isAdmin() ? `<button class="btn btn-xs btn-outline" onclick="openAnnoModal()" style="font-size:11px">編輯</button>` : ''}
      </div>
      <div class="anno-text">${esc(announcement.text)}</div>
    </div>`;
  }

  // ── Biz summary card ──────────────────────────────────────────
  function buildBizSumHtml() {
    const monthPrefix = `${viewYear}-${pad(viewMonth + 1)}`;
    const bizDates = Object.entries(bizStatus)
      .filter(([d, b]) => d.startsWith(monthPrefix) && b.isOpen)
      .map(([d]) => d).sort();
    if (!bizDates.length) return '';
    const labels = bizDates.map(d => `${pad(parseInt(d.slice(5)))}/${pad(parseInt(d.slice(8)))}`).join('・');
    return `<div class="biz-sum-card">
      <div class="biz-sum-num">${bizDates.length}</div>
      <div>
        <div class="biz-sum-title">${viewMonth + 1}月預計營業天數</div>
        <div class="biz-sum-dates">${labels}</div>
      </div>
    </div>`;
  }

  // ── Legend ────────────────────────────────────────────────────
  function buildLegendHtml(fullView = false) {
    return `<div class="legend">
      <span class="legend-swatch"><span class="biz-dot open"></span>預計營業</span>
      <span style="margin-left:auto;font-size:10px;color:var(--dim)">數字 = 該時段人數</span>
    </div>`;
  }

  // ── Biz day logic ─────────────────────────────────────────────
  function isBizDay(date) {
    const uids = new Set();
    let hasAdmin = false;
    for (const t of TIME_SLOTS) {
      const entry = schedData[`${date}_${sKey(t)}`] || {};
      for (const [uid, person] of Object.entries(entry)) {
        if (person.isLeave) continue;
        uids.add(uid);
        if (person.role === 'admin') hasAdmin = true;
      }
    }
    return hasAdmin && uids.size >= 4;
  }

  // ── Calendar grid ─────────────────────────────────────────────
  function buildCalGrid(readOnly = false) {
    const today  = todayStr();
    const first  = new Date(viewYear, viewMonth, 1);
    const last   = new Date(viewYear, viewMonth + 1, 0);
    const mo     = viewMonth + 1;

    const offset = first.getDay(); // 0=Sun, week starts Sunday

    const cells = [];
    for (let i = offset - 1; i >= 0; i--) {
      const d = new Date(viewYear, viewMonth, -i);
      cells.push({ date: d.toISOString().slice(0, 10), other: true });
    }
    for (let d = 1; d <= last.getDate(); d++) {
      cells.push({ date: `${viewYear}-${pad(mo)}-${pad(d)}`, other: false });
    }
    const rem = (7 - (cells.length % 7)) % 7;
    for (let i = 1; i <= rem; i++) {
      const d = new Date(viewYear, viewMonth + 1, i);
      cells.push({ date: d.toISOString().slice(0, 10), other: true });
    }

    return cells.map(({ date, other }) => {
      const dayNum  = parseInt(date.slice(8));
      const isPast  = !other && date < today;
      const isToday = date === today;
      const isBiz   = !other && bizStatus[date]?.isOpen;
      const dow     = new Date(date + 'T00:00:00').getDay();
      const isWeekend = !other && (dow === 0 || dow === 6);

      let cls = 'cal-day';
      if (other)      cls += ' other-month';
      else if (isPast) cls += ' past';
      if (isToday)    cls += ' today';
      if (!other && isBiz) cls += ' biz-day';
      if (isWeekend)  cls += ' weekend';

      const numEl = (!other && isAdmin() && !readOnly)
        ? `<div class="cal-day-num clickable" onclick="openDayModal('${date}')">${dayNum}</div>`
        : `<div class="cal-day-num">${dayNum}</div>`;

      const slotsHtml = other ? '' : TIME_SLOTS.map(t => {
        const k       = `${date}_${sKey(t)}`;
        const entry   = schedData[k] || {};
        const count   = Object.values(entry).filter(p => !p.isLeave).length;
        const myEntry = currentUser ? entry[currentUser.uid] : null;
        const mine    = !readOnly && !!myEntry;
        const onLeave = mine && !!myEntry?.isLeave;
        const adminInSlot = Object.values(entry).some(p => p.role === 'admin' && !p.isLeave);
        const locked  = !readOnly && !isAdmin() && t === '22:00' && !adminInSlot && !mine;
        let sc = 'slot-row';
        if (mine && !onLeave) sc += ' mine';
        else if (onLeave)     sc += ' mine on-leave';
        else if (count > 0)   sc += ' has-staff';
        if (locked) sc += ' locked';
        const badge = count > 0 ? `<span class="slot-cnt">${count}</span>` : '';
        const action = readOnly
          ? `onclick="openSlotView('${date}','${t}')"`
          : `onclick="tapSlot('${date}','${t}')"`;
        return `<div class="${sc}" ${action}>
          <span class="slot-hr" data-time="${t}" data-hour="${t.slice(0,2)}"></span>${badge}
        </div>`;
      }).join('');

      return `<div class="${cls}">${numEl}${slotsHtml}</div>`;
    }).join('');
  }

  function prevMonth() {
    if (--viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  }
  function nextMonth() {
    if (++viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  }

  // ── Personal panel ────────────────────────────────────────────
  function buildPersonalPanel() {
    const monthPrefix = `${viewYear}-${pad(viewMonth + 1)}`;
    const byDate = {};
    for (const key of Object.keys(schedData)) {
      if (!key.startsWith(monthPrefix)) continue;
      const entry = schedData[key];
      if (!entry[currentUser.uid]) continue;
      const date  = key.slice(0, 10);
      const slotK = key.slice(11);
      const time  = TIME_SLOTS.find(t => sKey(t) === slotK);
      if (!time) continue;
      if (!byDate[date]) byDate[date] = [];
      byDate[date].push({ time, isLeave: !!entry[currentUser.uid].isLeave });
    }

    const dates    = Object.keys(byDate).sort();
    const today    = todayStr();
    const allSlots = dates.flatMap(d => byDate[d]);
    const totalDays  = dates.filter(d => byDate[d].some(s => !s.isLeave)).length;
    const totalSlots = allSlots.filter(s => !s.isLeave).length;

    const shiftsHtml = dates.length
      ? dates.map(date => {
          const dt    = new Date(date + 'T00:00:00');
          const label = `${pad(parseInt(date.slice(5)))}/${pad(parseInt(date.slice(8)))} (${WD_FULL[dt.getDay()]})`;
          const sorted = byDate[date].sort((a, b) => TIME_SLOTS.indexOf(a.time) - TIME_SLOTS.indexOf(b.time));

  // ── Week helper ───────────────────────────────────────────────
  function getUpcomingWeeks(count = 8) {
    const weeks = [];
    const start = new Date();
    start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() - start.getDay()); // back to Sunday
    for (let i = 0; i < count; i++) {
      const dates = [];
      for (let j = 0; j < 7; j++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + j);
        dates.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
      }
      const f = new Date(start), l = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
      weeks.push({
        label: `${f.getMonth()+1}/${f.getDate()}（${WD_FULL[f.getDay()]}）～ ${l.getMonth()+1}/${l.getDate()}（${WD_FULL[l.getDay()]}）`,
        dates
      });
      start.setDate(start.getDate() + 7);
    }
    return weeks;
  }

  // ── Bulk schedule modal ───────────────────────────────────────
  function openBulkModal() {
    bulkMode = 'week';
    bulkSelectedDay = null;
    const today = todayStr();

    _bulkWeeks = getUpcomingWeeks(8);
    document.getElementById('bulk-week-list').innerHTML = _bulkWeeks
      .map((w, i) => `<label style="display:flex;align-items:center;gap:.55rem;font-size:12px;cursor:pointer;padding:.2rem 0;border-bottom:1px solid rgba(255,255,255,.05)">
        <input type="checkbox" value="${i}" style="accent-color:var(--gold);width:13px;height:13px;flex-shrink:0" onchange="onWeekCheck(this)"> ${w.label}
      </label>`).join('');

    const WD_ORDER = [0,1,2,3,4,5,6]; // Sun→Sat
    document.getElementById('bulk-weekday-btns').innerHTML =
      WD_ORDER.map(d => {
        const hasFuture = getDatesForWeekday(viewYear, viewMonth, d).some(date => date >= today);
        return `<button class="seg-btn" data-day="${d}" ${hasFuture ? `onclick="selectBulkDay(${d})"` : 'disabled'}>${WD_FULL[d]}</button>`;
      }).join('');

    document.getElementById('bulk-slots').innerHTML =
      TIME_SLOTS.map(t => `<label style="display:flex;align-items:center;gap:.55rem;font-size:13px;cursor:pointer;padding:.1rem 0">
        <input type="checkbox" value="${t}" style="accent-color:var(--gold);width:13px;height:13px"> ${t}
      </label>`).join('');

    document.getElementById('bulk-mode-week').classList.add('on');
    document.getElementById('bulk-mode-day').classList.remove('on');
    document.getElementById('bulk-week-wrap').style.display = '';
    document.getElementById('bulk-day-wrap').style.display = 'none';
    document.getElementById('modal-bulk').classList.add('open');
  }

  function onWeekCheck(el) {
    const checked = document.querySelectorAll('#bulk-week-list input:checked');
    if (checked.length > 4) { el.checked = false; showToast('最多選擇 4 週'); }
    const hint = document.getElementById('bulk-week-hint');
    if (hint) hint.textContent = checked.length ? `（已選 ${checked.length} / 4 週）` : '（最多 4 週）';
  }

  function setBulkMode(mode) {
    bulkMode = mode;
    bulkSelectedDay = null;
    document.getElementById('bulk-mode-week').classList.toggle('on', mode === 'week');
    document.getElementById('bulk-mode-day').classList.toggle('on', mode === 'day');
    document.getElementById('bulk-week-wrap').style.display = mode === 'week' ? '' : 'none';
    document.getElementById('bulk-day-wrap').style.display = mode === 'day' ? '' : 'none';
  }

  function selectBulkDay(dayJs) {
    bulkSelectedDay = dayJs;
    document.querySelectorAll('#bulk-weekday-btns .seg-btn').forEach(btn => {
      btn.classList.toggle('on', parseInt(btn.dataset.day) === dayJs);
    });
  }

  function getDatesForWeekday(year, month, weekday) {
    const dates = [];
    const lastDay = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= lastDay; d++) {
      if (new Date(year, month, d).getDay() === weekday)
        dates.push(`${year}-${pad(month + 1)}-${pad(d)}`);
    }
    return dates;
  }

  function closeBulkModal() {
    document.getElementById('modal-bulk').classList.remove('open');
  }

  async function confirmBulk() {
    const selectedSlots = [...document.querySelectorAll('#bulk-slots input:checked')].map(el => el.value);
    if (!selectedSlots.length) { showToast('請選擇至少一個時段'); return; }

    let dates;
    if (bulkMode === 'week') {
      const selectedIdx = [...document.querySelectorAll('#bulk-week-list input:checked')].map(el => parseInt(el.value));
      if (!selectedIdx.length) { showToast('請選擇至少一週'); return; }
      dates = [...new Set(selectedIdx.flatMap(i => _bulkWeeks[i].dates))];
    } else {
      if (bulkSelectedDay === null) { showToast('請選擇星期幾'); return; }
      dates = getDatesForWeekday(viewYear, viewMonth, bulkSelectedDay);
    }

    const today = todayStr();
    const writes = [];
    for (const date of dates) {
      if (date < today) continue;
      for (const t of selectedSlots) {
        if (t === '22:00' && !isAdmin()) {
          const entry = schedData[`${date}_${sKey(t)}`] || {};
          if (!Object.values(entry).some(p => p.role === 'admin')) continue;
        }
        writes.push(set(dbRef(db, `schedules/${date}_${sKey(t)}/${currentUser.uid}`), {
          uid: currentUser.uid, displayName: currentUser.displayName,
          role: currentUser.role, apostleTag: currentUser.apostleTag || '',
          signedAt: new Date().toISOString()
        }));
      }
    }
    await Promise.all(writes);
    closeBulkModal();
    showToast(`已完成排班（${writes.length} 個時段）`);
  }

  // ── Clear month schedule ──────────────────────────────────────
  async function clearMonthSchedule() {
    if (!confirm(`確定清除 ${viewMonth + 1} 月所有排班？`)) return;
    const monthPrefix = `${viewYear}-${pad(viewMonth + 1)}`;
    const removes = [];
    for (const key of Object.keys(schedData)) {
      if (!key.startsWith(monthPrefix)) continue;
      if (!schedData[key][currentUser.uid]) continue;
      removes.push(remove(dbRef(db, `schedules/${key}/${currentUser.uid}`)));
    }
    await Promise.all(removes);
    showToast('已清除本月所有排班');
  }

  // ── Memo ─────────────────────────────────────────────────────
  async function saveMemo() {
    const el = document.getElementById('memo-input');
    if (!el) return;
    const text = el.value;
    if (text === myMemo) return;
    myMemo = text;
    await set(dbRef(db, `memos/${currentUser.uid}`), { text, updatedAt: new Date().toISOString() });

  function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 350); }, 2200);
  }

  // ── Tap slot ──────────────────────────────────────────────────
  async function tapSlot(date, time) {
    if (!currentUser) return;
    if (date < todayStr()) return;
    if (time === '22:00' && !isAdmin()) {
      const entry = schedData[`${date}_${sKey(time)}`] || {};
      const alreadyIn = !!entry[currentUser.uid];
      if (!alreadyIn) {
        const adminInSlot = Object.values(entry).some(p => p.role === 'admin' && !p.isLeave);
        if (!adminInSlot) { showToast('22:00 時段需要店長先排班才可加入'); return; }
      }
    }
    const r    = dbRef(db, `schedules/${date}_${sKey(time)}/${currentUser.uid}`);
    const snap = await get(r);
    const existing = snap.val();
    if (existing) {
      if (existing.isLeave) { showToast('已請假，可從個人面板恢復排班'); return; }
      await remove(r);
      sendDiscord(`❌ **${currentUser.displayName}** 取消了 ${fmtDateDisc(date)} ${time} 的班`, date);
    } else {
      await set(r, {
        uid: currentUser.uid, displayName: currentUser.displayName,
        role: currentUser.role, apostleTag: currentUser.apostleTag || '',
        signedAt: new Date().toISOString()
      });
    }
  }

  async function removePerson(date, time, uid) {
    const entry  = schedData[`${date}_${sKey(time)}`] || {};
    const person = entry[uid];
    await remove(dbRef(db, `schedules/${date}_${sKey(time)}/${uid}`));
    if (person) sendDiscord(`🔧 管理員 **${currentUser.displayName}** 移除了 **${person.displayName}** 在 ${fmtDateDisc(date)} ${time} 的班`, date);
  }

  function toggleBiz(date) {
    const isOpen = bizStatus[date]?.isOpen || false;
    set(dbRef(db, 'bizStatus/' + date), {
      isOpen: !isOpen, autoSet: false,
      setBy: currentUser.displayName, setAt: new Date().toISOString()
    });
  }

  async function syncBizStatus() {
    const dates = new Set([
      ...Object.keys(schedData).map(k => k.slice(0, 10)),
      ...Object.keys(bizStatus),
    ]);
    const writes = [];
    for (const date of dates) {
      const shouldBeOpen = isBizDay(date);
      const cur = bizStatus[date];
      if (cur?.autoSet === false) continue; // 管理員手動設定，不覆蓋
      if (shouldBeOpen && !cur?.isOpen) {
        writes.push(set(dbRef(db, 'bizStatus/' + date), {
          isOpen: true, autoSet: true, setAt: new Date().toISOString()
        }));
      } else if (!shouldBeOpen && cur?.isOpen) {
        writes.push(remove(dbRef(db, 'bizStatus/' + date)));
      }
    }
    if (writes.length) await Promise.all(writes);
  }

  async function approveStaff(uid) {
    const snap = await get(dbRef(db, 'pendingStaff/' + uid));
    const p = snap.val(); if (!p) return;
    const name = document.getElementById('pn-' + uid)?.value.trim() || p.displayName || p.email;
    const role = document.getElementById('pr-' + uid)?.value || 'apostle';
    const tag  = document.getElementById('pt-' + uid)?.value.trim() || '';
    await set(dbRef(db, 'staff/' + uid), {
      uid, email: p.email, displayName: name, role, apostleTag: tag,
      createdAt: new Date().toISOString()
    });
    await remove(dbRef(db, 'pendingStaff/' + uid));
    renderAccounts();
  }

  async function rejectStaff(uid) {
    if (!confirm('確定拒絕此請求？')) return;
    await remove(dbRef(db, 'pendingStaff/' + uid));
    renderAccounts();
  }

    if (!confirm('確定移除此帳號？')) return;
    await remove(dbRef(db, 'staff/' + uid));
  }

  // ── Discord Webhook ───────────────────────────────────────────
  function fmtDateDisc(dateStr) {
    const dt = new Date(dateStr + 'T00:00:00');
    return `${dt.getMonth()+1}月${dt.getDate()}日（${'日一二三四五六'[dt.getDay()]}）`;
  }

  async function sendDiscord(content, date = null) {
    if (!discordWebhook) return;
    if (date) {
      const now = new Date();
      const prefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      if (!date.startsWith(prefix)) return;
    }
    try {
      await fetch(discordWebhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
    } catch(e) {}
  }

  async function saveWebhook() {
    const url = document.getElementById('webhook-url-input').value.trim();
    await set(dbRef(db, 'settings/discordWebhook'), url || null);
    showToast(url ? 'Webhook 已儲存' : 'Webhook 已清除');
  }
  async function testWebhook() {
    const url = document.getElementById('webhook-url-input').value.trim();
    if (!url) { showToast('請先輸入 Webhook URL'); return; }
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: '🔔 **安息地排班系統** — Webhook 測試成功！' })
      });
      if (res.ok || res.status === 204) showToast('測試訊息已送出');
      else showToast(`送出失敗 (${res.status})`);
    } catch(e) {
      showToast('送出失敗：' + e.message);
    }
  }

  // ── Leave ─────────────────────────────────────────────────────
  async function requestLeave(date, time) {
    if (!currentUser) return;
    const r    = dbRef(db, `schedules/${date}_${sKey(time)}/${currentUser.uid}`);
    const snap = await get(r);
    if (!snap.exists()) { showToast('尚未排班'); return; }
    await update(r, { isLeave: true, leaveAt: new Date().toISOString() });
    sendDiscord(`🏖️ **${currentUser.displayName}** 在 ${fmtDateDisc(date)} ${time} 申請請假`, date);
    showToast('已申請請假');
  }

  async function cancelLeave(date, time) {
    if (!currentUser) return;
    const r = dbRef(db, `schedules/${date}_${sKey(time)}/${currentUser.uid}`);
    await update(r, { isLeave: null, leaveAt: null });
    sendDiscord(`✅ **${currentUser.displayName}** 取消了在 ${fmtDateDisc(date)} ${time} 的請假`, date);
    showToast('已恢復排班');
  }

  // ── Export ────────────────────────────────────────────────────
  function openExportModal() {
    document.getElementById('export-month-label').textContent = `${viewYear}年${viewMonth + 1}月`;
    document.getElementById('export-table-wrap').innerHTML = buildExportTable();
    document.getElementById('modal-export').classList.add('open');
  }

  function closeExportModal() {
    document.getElementById('modal-export').classList.remove('open');
  }

  function buildExportTable() {
    const monthPrefix = `${viewYear}-${pad(viewMonth + 1)}`;
    const datesSet = new Set();
    for (const key of Object.keys(schedData)) {
      if (!key.startsWith(monthPrefix)) continue;
      if (!Object.keys(schedData[key]).length) continue;
      datesSet.add(key.slice(0, 10));
    }
    if (!datesSet.size) return '<div style="color:var(--dim);font-size:13px;padding:.5rem 0">本月尚無排班資料</div>';
    const dates = [...datesSet].sort();
    const header = `<tr><th>日期</th>${TIME_SLOTS.map(t => `<th>${t}</th>`).join('')}</tr>`;
    const rows = dates.map(date => {
      const dt     = new Date(date + 'T00:00:00');
      const isBiz  = !!bizStatus[date]?.isOpen;
      const mo     = dt.getMonth() + 1;
      const d      = dt.getDate();
      const wd     = WD_FULL[dt.getDay()];
      const dLabel = `${mo}/${d}（${wd}）${isBiz ? ' ★' : ''}`;
      const cells  = TIME_SLOTS.map(t => {
        const people = Object.values(schedData[`${date}_${sKey(t)}`] || {});
        if (!people.length) return '<td></td>';
        return `<td>${people.map(p =>
          `<span class="export-person${p.isLeave?' leave':''}">${esc(p.displayName)}${p.isLeave?' (請假)':''}</span>`
        ).join('')}</td>`;
      }).join('');
      return `<tr${isBiz?' class="biz-row"':''}><td class="date-col">${dLabel}</td>${cells}</tr>`;
    }).join('');
    return `<table class="export-tbl">${header}${rows}</table>`;
  }

  async function downloadScheduleImg() {
    const el = document.getElementById('export-table-wrap');
    try {
      const canvas = await window.html2canvas(el, { backgroundColor: '#1a1510', scale: 2, useCORS: true });
      const a = document.createElement('a');
      a.download = `安息地排班_${viewYear}${pad(viewMonth + 1)}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    } catch(e) {
      showToast('匯出失敗，請稍後再試');
    }
  }

  // ── Export globals for onclick handlers ──────────────────────
  Object.assign(window, {
    signInGoogle, doSignOut, doBootstrap, doRegister,
    setTab, setScheduleSubTab, prevMonth, nextMonth,
    openSlotView, closeSlotView, tapSlot,
    openDayModal, closeDayModal, removePerson, toggleBiz,
    openAddModal, closeAddModal, confirmAdd,
    openAnnoModal, closeAnnoModal, saveAnnouncement, clearAnnouncement,
    openBulkModal, closeBulkModal, confirmBulk, setBulkMode, selectBulkDay, onWeekCheck,
    clearMonthSchedule, saveMemo,
    openExportModal, closeExportModal, downloadScheduleImg,
    requestLeave, cancelLeave,
    approveStaff, rejectStaff, removeStaff,
    saveWebhook, testWebhook,
  });
</script>
</body>
</html>
