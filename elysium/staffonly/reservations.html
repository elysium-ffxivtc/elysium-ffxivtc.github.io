<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安息地 · 預約管理</title>
  <link rel="icon" type="image/png" href="../image/icon/Elysium_LOGO_mini_dark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #9c7a35; --gold-dim: rgba(156,122,53,.12);
      --bg: #f3f1ee; --panel: #e9e6e1; --card: #ffffff;
      --border: rgba(0,0,0,.1); --text: #211f1c; --dim: #6e6a63;
      --green: #2d7a50; --green-dim: rgba(45,122,80,.1); --red: #a8433a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; cursor: inherit; }
    * { scrollbar-width: thin; scrollbar-color: rgba(156,122,53,.3) transparent; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(156,122,53,.3); border-radius: 5px; border: 2px solid var(--bg); background-clip: padding-box; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(156,122,53,.55); background-clip: padding-box; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; cursor: url('../image/arr-cursors/arr-small-pointer.cur'), default; }
    a, button, [role="button"], select, [onclick] { cursor: url('../image/arr-cursors/arr-small-link.cur'), pointer; }

    .hdr { display: flex; align-items: center; justify-content: space-between; padding: .72rem 1.5rem; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .hdr-title { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--gold); letter-spacing: .2em; }
    .main { flex: 1; padding: 1.25rem 1.5rem; max-width: 1100px; width: 100%; margin: 0 auto; display: none; }

    .filter-row { display: flex; gap: .5rem; margin-bottom: .85rem; flex-wrap: wrap; align-items: center; }
    .seg-row { display: flex; }
    .seg-btn { padding: .33rem .85rem; font-size: 12px; background: none; border: 1px solid var(--border); color: var(--dim); font-family: inherit; transition: all .15s; margin-right: -1px; }
    .seg-btn.on { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); z-index: 1; position: relative; }

    .res-card { background: var(--card); border: 1px solid var(--border); padding: 1.3rem 1.5rem 1.5rem; margin-bottom: .9rem; }

    .res-hdr { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
    .res-hdr-main { display: flex; align-items: baseline; gap: 1rem; flex-shrink: 0; }
    .res-date { font-family: 'Noto Serif TC', serif; font-size: 1.3rem; letter-spacing: .05em; color: var(--text); }
    .res-date-time { margin-left: .7em; }
    .res-hdr-divider { width: 1px; height: 1.1rem; background: var(--border); }
    .res-total { font-family: 'Noto Serif TC', serif; font-size: 1rem; letter-spacing: .08em; color: var(--gold); }
    .res-hdr-line { flex: 1; height: 1px; background: var(--border); min-width: 2rem; }
    .res-status-pill { font-size: 12.5px; padding: .35rem 1rem; border: 1px solid var(--border); border-radius: 999px; color: var(--dim); white-space: nowrap; letter-spacing: .05em; }
    .res-status-pill.new { color: var(--gold); border-color: var(--gold); }
    .res-status-pill.completed { color: var(--green); border-color: var(--green); }
    .res-status-pill.cancelled { color: var(--red); border-color: var(--red); }

    .res-strip { display: flex; flex-wrap: wrap; row-gap: 1.6rem; }
    .res-col { flex: 1 1 140px; padding: 0 1.6rem; text-align: center; min-width: 0; }
    .res-col:first-child { padding-left: 0; }
    .res-col:last-child { padding-right: 0; }
    .res-col + .res-col { border-left: 1px solid var(--border); }
    .res-col-cat { font-family: 'Noto Serif TC', serif; font-size: 12px; color: var(--dim); margin-bottom: .15rem; }
    .res-col-field { margin-top: .4rem; }
    .res-col-field + .res-col-field { margin-top: 1.8rem; }
    .res-field-value { font-family: 'Noto Sans TC', sans-serif; font-size: .95rem; color: var(--text); }
    .res-field-value-sm { font-size: .8rem; }

    .res-divider-sparkle { display: flex; align-items: center; gap: .7rem; margin: 1.2rem 0 1rem; }
    .res-divider-sparkle::before, .res-divider-sparkle::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .res-divider-sparkle-icon { color: var(--gold); font-size: 12px; }

    .res-note { border-left: 2px solid var(--gold); background: rgba(156,122,53,.05); padding: .8rem 1.1rem; }
    .res-note + .res-note { margin-top: .5rem; }
    .res-note-label { font-family: 'Noto Serif TC', serif; font-size: 12px; color: var(--dim); margin-bottom: .35rem; }
    .res-note-body { font-family: 'Noto Sans TC', sans-serif; font-size: .8rem; color: var(--text); white-space: pre-wrap; }

    .res-actions { display: flex; gap: .5rem; margin-top: .9rem; }

    .btn { padding: .38rem .85rem; font-size: 12px; border: none; font-family: inherit; transition: all .15s; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-green { background: none; border: 1px solid var(--green); color: var(--green); }
    .btn-green:hover { background: var(--green-dim); }
    .btn-danger { background: none; border: 1px solid var(--red); color: var(--red); }
    .btn-danger:hover { background: rgba(208,96,96,.1); }
    .btn-sm { padding: .3rem .7rem; font-size: 12px; }

    .registry-switch-wrap { display: flex; align-items: center; gap: .5rem; font-size: 12px; color: var(--dim); }
    .switch { position: relative; width: 40px; height: 22px; border-radius: 11px; border: none; background: var(--border); padding: 0; flex-shrink: 0; transition: background .2s; }
    .switch .switch-knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s; }
    .switch.on { background: var(--green); }
    .switch.on .switch-knob { transform: translateX(18px); }

    .empty-hint { font-size: 13px; color: var(--dim); padding: 1.5rem 0; text-align: center; }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: .5rem 1.2rem; font-size: 13px; z-index: 9999; pointer-events: none; transition: opacity .35s; white-space: nowrap; }

    .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .auth-box { text-align: center; width: 340px; padding: 2rem; }
    .auth-logo { font-family: 'Noto Serif TC', serif; font-size: 2.2rem; color: var(--gold); letter-spacing: .25em; margin-bottom: .4rem; }
    .auth-tagline { font-size: 13px; color: var(--dim); margin-bottom: 2.5rem; letter-spacing: .08em; }
    .auth-google-btn { width: 100%; justify-content: center; display: flex; align-items: center; }
    .auth-err { color: var(--red); font-size: 13px; margin-top: .75rem; min-height: 1.2em; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-title">✦ 安息地 · 預約管理</div>
  <div style="display:flex;align-items:center;gap:.85rem">
    <div id="registry-toggle-wrap" class="registry-switch-wrap" style="display:none">
      <span id="registry-toggle-label">預約頁</span>
      <button id="registry-toggle-btn" class="switch" onclick="toggleRegistryOpen()"><span class="switch-knob"></span></button>
    </div>
    <button class="btn btn-outline btn-sm" id="backfill-btn" style="display:none" onclick="backfillVisits()">補齊舊預約的 POS 紀錄</button>
    <div id="user-badge" style="display:none;align-items:center;gap:.5rem;font-size:12px"></div>
  </div>
</header>

<div class="main" id="main">
  <div class="filter-row">
    <div class="seg-row" id="status-filter">
      <button class="seg-btn on" data-v="all" onclick="setFilter('all')">全部</button>
      <button class="seg-btn" data-v="new" onclick="setFilter('new')">待處理</button>
      <button class="seg-btn" data-v="completed" onclick="setFilter('completed')">已完成</button>
      <button class="seg-btn" data-v="cancelled" onclick="setFilter('cancelled')">已取消</button>
    </div>
  </div>
  <div id="res-list"></div>
</div>

<div id="auth-overlay" class="auth-overlay">
  <div id="auth-loading" class="auth-box">
    <div style="color:var(--dim);font-size:15px;letter-spacing:.1em">載入中…</div>
  </div>
  <div id="auth-login" class="auth-box" style="display:none">
    <div class="auth-logo">安息地</div>
    <div class="auth-tagline">預約管理</div>
    <button class="btn btn-outline auth-google-btn" style="background:var(--gold);color:#211f1c;font-weight:600" onclick="signInGoogle()">Google 登入</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
  <div id="auth-denied" class="auth-box" style="display:none">
    <div class="auth-logo" style="font-size:1.5rem;margin-bottom:1rem">無權限</div>
    <div style="color:var(--dim);font-size:13px;line-height:1.8;margin-bottom:1rem">此頁面僅限管理員與使徒帳號使用。</div>
    <button class="btn btn-outline" style="width:100%" onclick="doSignOut()">登出</button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getDatabase, ref as dbRef, onValue, get, update, runTransaction } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserPopupRedirectResolver, GoogleAuthProvider, signInWithPopup, getRedirectResult, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const app = initializeApp({
  apiKey:            "AIzaSyCZkdAeMKUWXQPXFptw3t4dYVOBAo7lF5Q",
  authDomain:        "elysiumpos.firebaseapp.com",
  databaseURL:       "https://elysiumpos-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "elysiumpos",
  storageBucket:     "elysiumpos.firebasestorage.app",
  messagingSenderId: "430177597593",
  appId:             "1:430177597593:web:7598eaf6e5e6264dc82008"
});
const db   = getDatabase(app);
const auth = initializeAuth(app, {
  persistence:           [indexedDBLocalPersistence, browserLocalPersistence],
  popupRedirectResolver: browserPopupRedirectResolver,
});
getRedirectResult(auth).catch(() => {});

function sKey(t) { return t.replace(':', ''); }
function esc(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function sanitizeKey(s) { return String(s||'').trim().replace(/[.#$/\[\]]/g, '_'); }

const ROLE_LABEL   = { admin: '管理員', manager: '經理', pilgrim: '引路人', apostle: '使徒' };
const STATUS_LABEL = { new: '待處理', completed: '已完成', cancelled: '已取消' };
const SERVICE_NAME = { nomen30: '顯名儀', photo: '交名留影' };
const RP_LABEL     = { heavy: '重 RP', medium: '中 RP', light: '輕 RP', none: '無 RP' };
const VISIT_LABEL  = { ritual: '儀式預約', seat: '席位預約', priest: '司祭留席' };
const SEAT_LABEL   = { sin: '食罪席', grudge: '妖異席' };

let currentUser = null;
let reservations = {};
let apostles = {};
let customers = {};
let filter = 'all';
let registryOpen = true;

onAuthStateChanged(auth, async user => {
  if (!user || user.isAnonymous) { showAuth('login'); return; }
  try {
    const staffSnap = await get(dbRef(db, 'staff/' + user.uid));
    if (staffSnap.exists()) {
      const data = staffSnap.val();
      if (data.role !== 'admin' && data.role !== 'pilgrim' && data.role !== 'manager') { window.location.replace('index.html'); return; }
      currentUser = { uid: user.uid, email: user.email, ...data };
    } else {
      const pilgrimSnap = await get(dbRef(db, 'pilgrims/' + user.uid));
      if (!pilgrimSnap.exists()) { window.location.replace('index.html'); return; }
      currentUser = { uid: user.uid, email: user.email, role: 'pilgrim', displayName: pilgrimSnap.val().name || user.displayName || '' };
    }
    hideAuth();
    startListeners();
  } catch(e) {
    document.getElementById('auth-err').textContent = '系統錯誤：' + e.message;
    showAuth('login');
  }
});

function showAuth(s) {
  document.getElementById('auth-overlay').style.display = 'flex';
  ['login','loading','denied'].forEach(id => document.getElementById('auth-' + id).style.display = id === s ? '' : 'none');
}
function hideAuth() {
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}
function signInGoogle() {
  document.getElementById('auth-err').textContent = '';
  signInWithPopup(auth, new GoogleAuthProvider())
    .catch(e => { document.getElementById('auth-err').textContent = '登入失敗：' + e.message; });
}
function doSignOut() { signOut(auth).then(() => location.reload()); }

function startListeners() {
  document.getElementById('backfill-btn').style.display = 'inline-block';
  document.getElementById('user-badge').style.display = 'flex';
  document.getElementById('user-badge').innerHTML = `
    <span>${esc(currentUser.displayName)}</span>
    <span style="font-size:11px;color:var(--dim);padding:.1rem .4rem;border:1px solid var(--border)">${ROLE_LABEL[currentUser.role]||''}</span>
    <button class="btn btn-outline btn-sm" onclick="window.location.href='index.html'" title="返回首頁" style="font-size:11px;padding:.2rem .45rem;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5 1 5.5V11h3.5V7.5h3V11H11V5.5L6 1.5Z" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/></svg></button>
    <button class="btn btn-outline btn-sm" onclick="doSignOut()">登出</button>`;

  onValue(dbRef(db, 'reservations'), snap => { reservations = snap.val() || {}; render(); });
  onValue(dbRef(db, 'apostles'), snap => { apostles = snap.val() || {}; render(); });
  onValue(dbRef(db, 'customers'), snap => { customers = snap.val() || {}; });
  onValue(dbRef(db, 'settings/registryOpen'), snap => { registryOpen = snap.val() !== false; renderRegistryToggle(); });
}

function renderRegistryToggle() {
  document.getElementById('registry-toggle-wrap').style.display = 'flex';
  document.getElementById('registry-toggle-btn').classList.toggle('on', registryOpen);
  document.getElementById('registry-toggle-label').textContent = registryOpen ? '預約頁：開放中' : '預約頁：已暫停';
}

async function toggleRegistryOpen() {
  const next = !registryOpen;
  if (!confirm(next ? '確定重新開放預約頁？' : '確定暫停預約頁？暫停後訪客會看到「目前暫停預約」提示，無法送出新預約。')) return;
  await update(dbRef(db), { 'settings/registryOpen': next });
  showToast(next ? '已重新開放預約頁' : '已暫停預約頁');
}

function setFilter(v) {
  filter = v;
  document.querySelectorAll('#status-filter .seg-btn').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render();
}

function apostleName(uid) {
  if (!uid || uid === 'none') return '不指定';
  return apostles[uid]?.name || uid;
}

function render() {
  const list = document.getElementById('res-list');
  const entries = Object.entries(reservations)
    .filter(([id, r]) => filter === 'all' || (r.status || 'new') === filter)
    .sort((a, b) => (b[1].createdAt || '').localeCompare(a[1].createdAt || ''));

  if (!entries.length) { list.innerHTML = '<div class="empty-hint">沒有符合條件的預約</div>'; return; }

  list.innerHTML = entries.map(([id, r]) => {
    const status = r.status || 'new';
    const visitType = r.visitType || 'ritual';
    const svcNames = (r.services || []).map(s => SERVICE_NAME[s] || s).join('、');
    const col4 = visitType === 'seat'
      ? `<div class="res-col-cat">座席</div><div class="res-col-field"><div class="res-field-value">${esc(SEAT_LABEL[r.seatType] || r.seatType || '')}</div></div>`
      : `<div class="res-col-cat">指定使徒</div><div class="res-col-field"><div class="res-field-value">${esc(apostleName(r.apostle))}</div></div>`;
    const col5 = visitType === 'seat'
      ? `<div class="res-col-cat">人數</div><div class="res-col-field"><div class="res-field-value">${r.seatCount || 0} 人</div></div>`
      : `<div class="res-col-cat">儀式</div><div class="res-col-field"><div class="res-field-value">${esc(svcNames)}</div></div>`;
    return `<div class="res-card">
      <div class="res-hdr">
        <div class="res-hdr-main">
          <span class="res-date">${esc(r.date)}<span class="res-date-time">${esc(r.time)}</span></span>
          <span class="res-hdr-divider"></span>
          <span class="res-total">${(r.total||0).toLocaleString()} Gil</span>
        </div>
        <span class="res-hdr-line"></span>
        <span class="res-status-pill ${status}">${STATUS_LABEL[status] || status}${r.noShow ? '・缺席' : ''}</span>
      </div>
      <div class="res-strip">
        <div class="res-col">
          <div class="res-col-cat">遊戲角色名稱</div>
          <div class="res-col-field"><div class="res-field-value">${esc(r.gameName)} <span class="res-field-value-sm">@${esc(r.server)}</span></div></div>
        </div>
        <div class="res-col">
          <div class="res-col-cat">Discord ID</div>
          <div class="res-col-field"><div class="res-field-value">${esc(r.contact)}</div></div>
        </div>
        <div class="res-col">
          <div class="res-col-cat">RP 程度</div>
          <div class="res-col-field"><div class="res-field-value">${esc(RP_LABEL[r.rp] || r.rp || '')}</div></div>
        </div>
        <div class="res-col">
          <div class="res-col-cat">來訪形式</div>
          <div class="res-col-field"><div class="res-field-value">${esc(VISIT_LABEL[visitType] || visitType)}</div></div>
        </div>
        <div class="res-col">${col4}</div>
        <div class="res-col">${col5}</div>
      </div>
      ${(r.rpNote || r.notes) ? `
        <div class="res-divider-sparkle"><span class="res-divider-sparkle-icon">✦</span></div>
        ${r.rpNote ? `<div class="res-note"><div class="res-note-label">備註</div><div class="res-note-body">${esc(r.rpNote)}</div></div>` : ''}
        ${r.notes  ? `<div class="res-note"><div class="res-note-label">其他備註</div><div class="res-note-body">${esc(r.notes)}</div></div>`  : ''}
      ` : ''}
      ${status === 'new' ? `<div class="res-actions">
        <button class="btn btn-green btn-sm" onclick="markCompleted('${id}')">標記完成</button>
        <button class="btn btn-danger btn-sm" onclick="cancelReservation('${id}')">取消</button>
      </div>` : ''}
      ${status === 'completed' ? `<div class="res-actions">
        <button class="btn btn-outline btn-sm" onclick="toggleNoShow('${id}')">${r.noShow ? '取消缺席標記' : '標記缺席'}</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

async function markCompleted(id) {
  await update(dbRef(db, 'reservations/' + id), {
    status: 'completed', updatedAt: new Date().toISOString(), updatedBy: currentUser.displayName,
  });
  await syncVisit(id);
  showToast('已標記完成');
}

async function syncVisit(id) {
  const r = reservations[id];
  if (!r) return;
  const visitId = 'v_res_' + id;
  const existingSnap = await get(dbRef(db, 'visits/' + visitId));
  if (existingSnap.exists()) return;

  const lookupKey = sanitizeKey(r.gameName) + '_' + sanitizeKey(r.server);
  let custId = Object.keys(customers).find(cid =>
    sanitizeKey(customers[cid].name) + '_' + sanitizeKey(customers[cid].server) === lookupKey
  );
  if (!custId) {
    custId = 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await update(dbRef(db), {
      [`customers/${custId}`]: {
        id: custId, name: r.gameName, discord: r.contact, server: r.server,
        contact: '', notes: '', pointsTotal: 0, hasRedeemedUltimate: false,
        createdAt: new Date().toISOString(),
      },
    });
  }

  const isSeat = r.visitType === 'seat';
  const hasNomen = !isSeat && (r.services||[]).includes('nomen30');
  const mode = hasNomen ? 'nomen' : 'pilgrim';
  const pointsEarned = hasNomen ? 1 : 0;

  const v = {
    id: visitId,
    customerId: custId,
    mode,
    date: r.date || '', time: r.time || '', type: 'booked',
    apostleType: r.designated ? 'specified' : 'unspecified',
    apostleName: isSeat ? '' : apostleName(r.apostle),
    apostleTag: isSeat ? '' : (apostles[r.apostle]?.tag || ''),
    services: isSeat ? [] : [...(r.services||[])],
    orders: [],
    servicesTotal: r.total || 0,
    ordersTotal: 0,
    total: r.total || 0,
    pointsEarned,
    pointMultiplier: 1,
    notes: [r.rpNote, r.notes].filter(Boolean).join('\n'),
    createdAt: r.createdAt || new Date().toISOString(),
  };
  await update(dbRef(db), { [`visits/${visitId}`]: v });

  if (pointsEarned > 0) {
    await runTransaction(dbRef(db, `customers/${custId}/pointsTotal`), cur => (cur || 0) + pointsEarned);
  }
}

async function backfillVisits() {
  const ids = Object.keys(reservations).filter(id => reservations[id].status === 'completed');
  if (!ids.length) { showToast('沒有已完成的預約'); return; }
  if (!confirm(`將檢查 ${ids.length} 筆已完成的預約，補上缺少的 POS 到訪紀錄，確定執行？`)) return;
  let synced = 0;
  for (const id of ids) {
    const before = await get(dbRef(db, 'visits/v_res_' + id));
    if (!before.exists()) synced++;
    await syncVisit(id);
  }
  showToast(`補齊完成，新增了 ${synced} 筆紀錄`);
}

async function toggleNoShow(id) {
  const r = reservations[id];
  if (!r) return;
  const next = !r.noShow;
  if (next) {
    if (!confirm('確定標記為缺席？這會移除已累計的到訪紀錄與點數。')) return;
    await revertVisit(id);
  } else {
    await syncVisit(id);
  }
  await update(dbRef(db, 'reservations/' + id), {
    noShow: next, updatedAt: new Date().toISOString(), updatedBy: currentUser.displayName,
  });
  showToast(next ? '已標記缺席' : '已取消缺席標記');
}

async function revertVisit(id) {
  const visitId = 'v_res_' + id;
  const snap = await get(dbRef(db, 'visits/' + visitId));
  if (!snap.exists()) return;
  const v = snap.val();
  if (v.pointsEarned > 0) {
    await runTransaction(dbRef(db, `customers/${v.customerId}/pointsTotal`), cur => (cur || 0) - v.pointsEarned);
  }
  await update(dbRef(db), { [`visits/${visitId}`]: null });
}

async function cancelReservation(id) {
  const r = reservations[id];
  if (!r) return;
  if (!confirm(`確定取消 ${r.date} ${r.time} 的預約？`)) return;
  const updates = {
    [`reservations/${id}/status`]:    'cancelled',
    [`reservations/${id}/updatedAt`]: new Date().toISOString(),
    [`reservations/${id}/updatedBy`]: currentUser.displayName,
  };
  if (r.apostle && r.apostle !== 'none') {
    updates[`bookedSlots/${r.date}/${sKey(r.time)}/${r.apostle}`] = null;
  }
  await update(dbRef(db), updates);
  showToast('已取消，時段已釋放');
}

function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 350); }, 2000);
}

Object.assign(window, { signInGoogle, doSignOut, setFilter, markCompleted, cancelReservation, toggleRegistryOpen, backfillVisits, toggleNoShow });
</script>
