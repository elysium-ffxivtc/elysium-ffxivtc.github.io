      // 記住上次選的類型
      if (window._evType) setEvType(window._evType);
      const drum = document.getElementById('ev-mult-drum');
      if (drum) drum.addEventListener('wheel', e => { e.preventDefault(); drumScroll(e.deltaY > 0 ? 1 : -1); }, { passive: false });
    }

    // ── Date range picker ──
    let _dr = { s: null, e: null, hov: null, yr: 0, mo: 0 };

    function drToggle() {
      const popup = document.getElementById('ev-dr-popup');
      const disp  = document.getElementById('ev-dr-display');
      if (!popup) return;
      const opening = popup.style.display === 'none';
      popup.style.display = opening ? '' : 'none';
      disp.classList.toggle('open', opening);
      if (opening) {
        if (!_dr.yr) { const n = new Date(); _dr.yr = n.getFullYear(); _dr.mo = n.getMonth(); }
        drRender();
        setTimeout(() => {
          const h = e => { if (!document.getElementById('ev-dr-wrap')?.contains(e.target)) { popup.style.display='none'; disp.classList.remove('open'); document.removeEventListener('mousedown',h); } };
          document.addEventListener('mousedown', h);
        }, 0);
      }
    }

    function drNav(d) {
      _dr.mo += d;
      if (_dr.mo > 11) { _dr.mo = 0; _dr.yr++; } else if (_dr.mo < 0) { _dr.mo = 11; _dr.yr--; }
      drRender();
    }

    function drClick(ds) {
      if (!_dr.s || (_dr.s && _dr.e)) {
        _dr.s = ds; _dr.e = null; _dr.hov = ds;
      } else {
        if (ds < _dr.s) { _dr.e = _dr.s; _dr.s = ds; } else { _dr.e = ds; }
        document.getElementById('ev-start').value = _dr.s;
        document.getElementById('ev-end').value   = _dr.e;
        drUpdateClasses();
        drUpdateLabel();
        setTimeout(() => {
          document.getElementById('ev-dr-popup').style.display = 'none';
          document.getElementById('ev-dr-display').classList.remove('open');
        }, 150);
        return;
      }
      drUpdateClasses();
      drUpdateLabel();
    }

    function drHov(ds) {
      if (_dr.s && !_dr.e && ds !== _dr.hov) { _dr.hov = ds; drUpdateClasses(); }
    }

    function drLeave() {
      if (_dr.s && !_dr.e) { _dr.hov = null; drUpdateClasses(); }
    }

    function drUpdateLabel() {
      const el = document.getElementById('ev-dr-txt'); if (!el) return;
      if (_dr.s && _dr.e) { el.textContent = `${_dr.s} ～ ${_dr.e}`; el.style.color = 'var(--text)'; }
      else if (_dr.s)     { el.textContent = `${_dr.s} ～ 選擇結束日期`; el.style.color = 'var(--dim)'; }
      else                { el.textContent = '選擇日期區間'; el.style.color = 'var(--dim)'; }
    }

    function drUpdateClasses() {
      const grid = document.getElementById('ev-dr-grid'); if (!grid) return;
      const { s, e, hov } = _dr;
      const re   = e || hov;
      const rMin = s && re ? (s <= re ? s : re) : s;
      const rMax = s && re ? (s <= re ? re : s) : null;
      grid.querySelectorAll('.dr-day[data-date]').forEach(el => {
        const ds = el.dataset.date;
        el.classList.remove('dr-s', 'dr-e', 'dr-in');
        if (ds === s && ds === e) el.classList.add('dr-s', 'dr-e');
        else if (ds === s) el.classList.add('dr-s');
        else if (ds === e) el.classList.add('dr-e');
        else if (rMin && rMax && ds > rMin && ds < rMax) el.classList.add('dr-in');
      });
    }

    function drReset() { _dr = { s:null, e:null, hov:null, yr:0, mo:0 }; drUpdateLabel(); }


    // ── Overtime time picker (drum roll) ──
    let _ot = { h: -1, m: -1 };
    let _otHIdx = 0, _otMDrum = 0;

    function renderOTDrums() {
      const wrap = document.getElementById('ot-time-wrap'); if (!wrap) return;
      const n = VT_HOURS.length;
      const _inpCur = `border:none;outline:none;width:100%;text-align:center;font-size:1rem;color:var(--gold);font-weight:700;font-family:inherit;background:rgba(180,150,80,.08);border-top:1px solid rgba(180,150,80,.2);border-bottom:1px solid rgba(180,150,80,.2);padding:.38rem 0;cursor: url('../image/arr-cursors/arr-small-text.cur'), text`;
      wrap.innerHTML = `
        <div style="display:inline-flex;align-items:center;gap:.5rem">
          <div id="ot-h-drum" style="${_drumStyle}">
            <div onclick="otHDrumScroll(-1)" style="${_drumPrev}">${String(VT_HOURS[(_otHIdx-1+n)%n]).padStart(2,'0')}</div>
            <input id="ot-h-inp" type="text" maxlength="2" value="${String(VT_HOURS[_otHIdx]).padStart(2,'0')}" style="${_inpCur}" oninput="otHInpChange(this.value)" onclick="this.select()">
            <div onclick="otHDrumScroll(1)"  style="${_drumNext}">${String(VT_HOURS[(_otHIdx+1)%n]).padStart(2,'0')}</div>
          </div>
          <span style="color:var(--dim);font-size:1.1rem;line-height:1">:</span>
          <div id="ot-m-drum" style="${_drumStyle}">
            <div onclick="otMDrumScroll(-1)" style="${_drumPrev}">${String((_otMDrum-1+60)%60).padStart(2,'0')}</div>
            <input id="ot-m-inp" type="text" maxlength="2" value="${String(_otMDrum).padStart(2,'0')}" style="${_inpCur}" oninput="otMInpChange(this.value)" onclick="this.select()">
            <div onclick="otMDrumScroll(1)"  style="${_drumNext}">${String((_otMDrum+1)%60).padStart(2,'0')}</div>
          </div>
        </div>`;
      const dh = document.getElementById('ot-h-drum');
      const dm = document.getElementById('ot-m-drum');
      if (dh) dh.addEventListener('wheel', e => { e.preventDefault(); otHDrumScroll(e.deltaY>0?1:-1); }, { passive:false });
      if (dm) dm.addEventListener('wheel', e => { e.preventDefault(); otMDrumScroll(e.deltaY>0?1:-1); }, { passive:false });
    }

    function otHDrumScroll(d) {
      const n = VT_HOURS.length;
      _otHIdx = (_otHIdx + d + n) % n;
      _ot.h = VT_HOURS[_otHIdx];
      const drum = document.getElementById('ot-h-drum'); if (!drum) return;
      drum.children[0].textContent = String(VT_HOURS[(_otHIdx-1+n)%n]).padStart(2,'0');
      drum.children[1].value       = String(VT_HOURS[_otHIdx]).padStart(2,'0');
      drum.children[2].textContent = String(VT_HOURS[(_otHIdx+1)%n]).padStart(2,'0');
    }

    function otMDrumScroll(d) {
      _otMDrum = (_otMDrum + d + 60) % 60;
      _ot.m = _otMDrum;
      const drum = document.getElementById('ot-m-drum'); if (!drum) return;
      drum.children[0].textContent = String((_otMDrum-1+60)%60).padStart(2,'0');
      drum.children[1].value       = String(_otMDrum).padStart(2,'0');
      drum.children[2].textContent = String((_otMDrum+1)%60).padStart(2,'0');
    }

    function otHInpChange(val) {
      const h = parseInt(val);
      if (isNaN(h) || h < 0 || h > 23) return;
      _ot.h = h;
      const hi = VT_HOURS.indexOf(h);
      if (hi >= 0) _otHIdx = hi;
      const n = VT_HOURS.length;
      const drum = document.getElementById('ot-h-drum');
      if (drum) {
        drum.children[0].textContent = String(VT_HOURS[(_otHIdx-1+n)%n]).padStart(2,'0');
        drum.children[2].textContent = String(VT_HOURS[(_otHIdx+1)%n]).padStart(2,'0');
      }
    }

    function otMInpChange(val) {
      const m = parseInt(val);
      if (isNaN(m) || m < 0 || m > 59) return;
      _otMDrum = m; _ot.m = m;
      const drum = document.getElementById('ot-m-drum');
      if (drum) {
        drum.children[0].textContent = String((_otMDrum-1+60)%60).padStart(2,'0');
        drum.children[2].textContent = String((_otMDrum+1)%60).padStart(2,'0');
      }
    }

    // ── Visit time picker (drum roll) ──
    let _vt = { h: -1, m: -1 };
    let _vtBookedIdx = 0, _vtHIdx = 0, _vtMDrum = 0;

    function vtBookedScroll(d) {
      const n = BOOKED_TIMES.length;
      _vtBookedIdx = (_vtBookedIdx + d + n) % n;
      const drum = document.getElementById('vt-booked-drum');
      if (!drum) return;
      drum.children[0].textContent = BOOKED_TIMES[(_vtBookedIdx-1+n)%n];
      drum.children[1].textContent = BOOKED_TIMES[_vtBookedIdx];
      drum.children[2].textContent = BOOKED_TIMES[(_vtBookedIdx+1)%n];
      const h = document.getElementById('v-time'); if (h) h.value = BOOKED_TIMES[_vtBookedIdx];
    }
    function vtHDrumScroll(d) {
      const n = VT_HOURS.length;
      _vtHIdx = (_vtHIdx + d + n) % n;
      _vt.h = VT_HOURS[_vtHIdx];
      const drum = document.getElementById('vt-h-drum'); if (!drum) return;
      drum.children[0].textContent = String(VT_HOURS[(_vtHIdx-1+n)%n]).padStart(2,'0');
      drum.children[1].value       = String(VT_HOURS[_vtHIdx]).padStart(2,'0');
      drum.children[2].textContent = String(VT_HOURS[(_vtHIdx+1)%n]).padStart(2,'0');
      _vtSync();
    }
    function vtMDrumScroll(d) {
      _vtMDrum = (_vtMDrum + d + 60) % 60;
      _vt.m = _vtMDrum;
      const drum = document.getElementById('vt-m-drum'); if (!drum) return;
      drum.children[0].textContent = String((_vtMDrum-1+60)%60).padStart(2,'0');
      drum.children[1].value       = String(_vtMDrum).padStart(2,'0');
      drum.children[2].textContent = String((_vtMDrum+1)%60).padStart(2,'0');
      _vtSync();
    }
    function vtHInpChange(val) {
      const h = parseInt(val);
      if (isNaN(h) || h < 0 || h > 23) return;
      _vt.h = h;
      const hi = VT_HOURS.indexOf(h);
      if (hi >= 0) _vtHIdx = hi;
      const n = VT_HOURS.length;
      const drum = document.getElementById('vt-h-drum');
      if (drum) {
        drum.children[0].textContent = String(VT_HOURS[(_vtHIdx-1+n)%n]).padStart(2,'0');
        drum.children[2].textContent = String(VT_HOURS[(_vtHIdx+1)%n]).padStart(2,'0');
      }
      _vtSync();
    }
    function vtMInpChange(val) {
      const m = parseInt(val);
      if (isNaN(m) || m < 0 || m > 59) return;
      _vtMDrum = m; _vt.m = m;
      const drum = document.getElementById('vt-m-drum');
      if (drum) {
        drum.children[0].textContent = String((_vtMDrum-1+60)%60).padStart(2,'0');
        drum.children[2].textContent = String((_vtMDrum+1)%60).padStart(2,'0');
      }
      _vtSync();
    }

    function _vtSync() {
      const h = _vt.h, m = _vt.m;
      const hidden = document.getElementById('v-time');
      if (hidden && h >= 0 && m >= 0)
        hidden.value = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }


    function drRender() {
      const cal = document.getElementById('ev-dr-cal'); if (!cal) return;
      const { yr, mo } = _dr;
      const today  = new Date().toISOString().slice(0, 10);
      const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
      const wds    = ['日','一','二','三','四','五','六'];
      const first  = new Date(yr, mo, 1).getDay();
      const days   = new Date(yr, mo + 1, 0).getDate();
      let h = `<div class="dr-nav">
        <button class="dr-nav-btn" onclick="drNav(-1)">‹</button>
        <span class="dr-month-lbl">${yr} 年 ${months[mo]}</span>
        <button class="dr-nav-btn" onclick="drNav(1)">›</button>
      </div>
      <div class="dr-grid" id="ev-dr-grid" onmouseleave="drLeave()">
        ${wds.map(w => `<div class="dr-wd">${w}</div>`).join('')}
        ${Array(first).fill('<div class="dr-day dr-empty"></div>').join('')}`;
      for (let d = 1; d <= days; d++) {
        const ds   = `${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const past = ds < today;
        h += past
          ? `<div class="dr-day dr-past">${d}</div>`
          : `<div class="dr-day" data-date="${ds}">${d}</div>`;
      }
      h += '</div>';
      cal.innerHTML = h;
      const grid = document.getElementById('ev-dr-grid');
      if (grid) {
        grid.addEventListener('click', ev => {
          const el = ev.target.closest('.dr-day[data-date]');
          if (el) drClick(el.dataset.date);
        });
        grid.addEventListener('mousemove', ev => {
          const el = ev.target.closest('.dr-day[data-date]');
          if (el) drHov(el.dataset.date);
        });
      }
      drUpdateClasses();
      drUpdateLabel();
    }

    let _evType = 'fixed';
    let _fixedType = 'monthly';
    let _drumMult = 2;

    function drumScroll(d) {
      _drumMult = Math.max(2, _drumMult + d);
      const drum = document.getElementById('ev-mult-drum');
      if (!drum) return;
      const [prevEl, curEl, nextEl] = drum.children;
      prevEl.textContent = _drumMult - 1;
      curEl.textContent  = '×' + _drumMult;
      nextEl.textContent = _drumMult + 1;
      const inp = document.getElementById('ev-mult');
      if (inp) inp.value = _drumMult;
    }

    function setFixedType(t) {
      _fixedType = t;
      document.getElementById('evfixed-monthly').className = 'toggle-btn' + (t==='monthly'?' on':'');
      document.getElementById('evfixed-yearly').className  = 'toggle-btn' + (t==='yearly'?' on':'');
      document.getElementById('ev-fixed-monthly').style.display = t==='monthly' ? '' : 'none';
      document.getElementById('ev-fixed-yearly').style.display  = t==='yearly'  ? '' : 'none';
    }

    function setEvType(t) {
      _evType = t;
      const fd = document.getElementById('ev-date-range');
      const ff = document.getElementById('ev-fixed-date');
      if (fd) { fd.style.display = t==='timed' ? 'block' : 'none'; if (t==='timed') drReset(); }
      if (ff) ff.style.display = t==='fixed' ? 'block' : 'none';
      const bf = document.getElementById('evtype-fixed');
      const bt = document.getElementById('evtype-timed');
      if (bf) bf.className = 'toggle-btn' + (t==='fixed'?' on':'');
      if (bt) bt.className = 'toggle-btn' + (t==='timed'?' on':'');
    }

    function renderEventGroup(list) {
      if (!list.length) return `<div style="font-size:14px;color:var(--dim);text-align:center;padding:.3rem 0">尚無活動</div>`;
      const today = getBusinessDate();
      return list.map(e => {
        const on = isEventActive(e);
        let statusLabel = '';
        if (e.type==='timed') {
          if (!e.active) statusLabel = '已停用';
          else if (e.startDate && today < e.startDate) statusLabel = '尚未開始';
          else if (e.endDate   && today > e.endDate)   statusLabel = '已結束';
          else statusLabel = '進行中';
        } else {
          if (!e.active) statusLabel = '已停用';
          else statusLabel = isEventActive(e) ? '進行中' : '未到日期';
        }
        const statusColor = statusLabel==='進行中' ? 'var(--green)' : 'var(--dim)';
        let scheduleLabel = '';
        if (e.type==='fixed' && e.active) {
          if (e.fixedType==='monthly' && e.monthDay)
            scheduleLabel = `<div style="font-size:13px;color:var(--dim);margin-top:3px">每月 ${e.monthDay} 日</div>`;
          else if (e.fixedType==='yearly' && e.yearMonth && e.yearDay)
            scheduleLabel = `<div style="font-size:13px;color:var(--dim);margin-top:3px">每年 ${e.yearMonth} 月 ${e.yearDay} 日</div>`;
        }
        return `
        <div class="event-item${on?' active-event':''}">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
              <span style="font-size:15px;font-weight:500">${esc(e.name)}</span>
              <span class="event-badge">×${e.multiplier}</span>
              <span style="font-size:12px;color:${statusColor}">${statusLabel}</span>
            </div>
            ${scheduleLabel}
            ${e.type==='timed' && (e.startDate||e.endDate) ? `<div style="font-size:15px;color:var(--dim);margin-top:3px">${e.startDate||'—'} ～ ${e.endDate||'—'}</div>` : ''}
            ${e.desc ? `<div style="font-size:15px;color:var(--dim);margin-top:2px">${esc(e.desc)}</div>` : ''}
          </div>
          <div style="display:flex;gap:.4rem;flex-shrink:0;margin-left:.75rem">
            <button class="btn btn-outline btn-sm" onclick="toggleEvent('${e.id}')">${e.active?'停用':'啟用'}</button>
            <button class="btn btn-sm" style="border:1px solid rgba(192,80,80,.3);color:var(--red);background:transparent" onclick="deleteEvent('${e.id}')">刪除</button>
          </div>
        </div>`;
      }).join('');
    }

    function addEvent() {
      const name = document.getElementById('ev-name')?.value.trim();
      const mult = parseInt(document.getElementById('ev-mult')?.value) || 2;
      const desc = document.getElementById('ev-desc')?.value.trim() || '';
      const type = _evType || 'fixed';
      if (!name) { alert('請填寫活動名稱'); return; }
      const ev = { id: 'ev_'+Date.now(), name, multiplier: mult, type, active: true, desc, createdAt: new Date().toISOString() };
      if (type==='timed') {
        ev.startDate = document.getElementById('ev-start')?.value || '';
        ev.endDate   = document.getElementById('ev-end')?.value   || '';
      }
      if (type==='fixed') {
        ev.fixedType = _fixedType;
        if (_fixedType==='monthly') {
          const d = parseInt(document.getElementById('ev-month-day')?.value) || 0;
          ev.monthDay = d || null;
        } else {
          ev.yearMonth = parseInt(document.getElementById('ev-year-month')?.value) || 1;
          ev.yearDay   = parseInt(document.getElementById('ev-year-day')?.value)   || 1;
        }
      }
      events.push(ev);
      save('pos_events', events);
      showActivityPage();
    }

    function toggleEvent(id) {
      const e = events.find(x => x.id===id);
      if (!e) return;
      e.active = !e.active;
      save('pos_events', events);
      showActivityPage();
    }

    function deleteEvent(id) {
      if (!confirm('確定刪除此活動？')) return;
      events = events.filter(x => x.id!==id);
      save('pos_events', events);
      showActivityPage();
    }

    function backToCustomers() {
      setNav('customer');
    }

    let currentNav = 'customer';

    function setNav(tab) {
      if (tab !== 'roster') rosterSearch = '';
      currentNav = tab;
      ['customer','roster','stats','activity','settlement','staff'].forEach(t => {
        const btn = document.getElementById('nav-btn-'+t);
        if (btn) {
          const isAdmin = btn.className.includes('admin-only');
          btn.className = 'pos-nav-btn' + (isAdmin ? ' admin-only' : '') + (t===tab?' on':'');
        }
      });
      const sc = document.getElementById('sidebar-customer');
      const so = document.getElementById('sidebar-other');
      if (tab === 'customer') {
        if (sc) sc.style.display = 'flex';
        if (so) so.style.display = 'none';
      } else {
        if (sc) sc.style.display = 'none';
        if (so) so.style.display = 'flex';
      }
      if (tab === 'customer') {
        activeId = null;
        renderSidebar();
        document.getElementById('pos-content').innerHTML = `
          <div class="pos-empty">
            <div class="pos-empty-icon">✦</div>
            <div class="pos-empty-text">搜尋或選擇客戶以查看資料</div>
          </div>`;
      } else if (tab === 'roster')     showRosterPage();
      else if (tab === 'stats')        showStatsPage();
      else if (tab === 'activity')     showActivityPage();
      else if (tab === 'settlement')   { showSettlementPage(); initSettlementPilgrims(); }
      else if (tab === 'staff')        showStaffPage();
    }

    function isAdmin() { return posUser?.role === 'admin'; }

    function applyUserMode() {
      if (isAdmin()) {
        document.body.classList.remove('pilgrim-mode');
      } else {
        document.body.classList.add('pilgrim-mode');
      }
      const adminOnly = ['stats','activity','settlement','staff'];
      if (!isAdmin() && adminOnly.includes(currentNav)) setNav('customer');

    function updateModeIndicator() {
      const el = document.getElementById('mode-indicator');
      if (!el || !posUser) return;
      el.innerHTML = `
        <span style="font-size:12px;color:var(--dim)">${posUser.displayName}</span>

    //  人員管理
    // ────────────────────────────────────────────────────────────
    function showStaffPage() {
      activeId = null;
      renderSidebar();
      document.getElementById('pos-content').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
          <span style="font-family:'Noto Serif TC',serif;font-size:1rem;letter-spacing:.2em;color:var(--gold)">人員管理</span>

          ${APOSTLES.length
            ? `<div style="display:flex;flex-wrap:wrap;gap:.4rem">
                ${APOSTLES.map(a => `<span style="background:rgba(180,150,80,.12);border:1px solid rgba(180,150,80,.25);border-radius:4px;padding:.2rem .55rem;font-size:13px">${esc(a.name)}${a.tag?'<span style="color:var(--dim);margin-left:.3rem;font-size:11px">'+esc(a.tag)+'</span>':''}</span>`).join('')}
               </div>`

          <button class="btn btn-outline btn-sm" style="margin-top:.75rem;font-size:12px" onclick="fetchApostles()">重新載入</button>
        </div>

        <div class="pos-card">
          <div class="pos-card-title">引路人（手動管理）</div>
          <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
            <input class="pos-input" id="new-pilgrim-name" type="text" placeholder="引路人名稱" style="flex:1" onkeydown="if(event.key==='Enter')addPilgrim()">
            <button class="btn btn-gold" style="white-space:nowrap" onclick="addPilgrim()">新增</button>
          </div>
          ${PILGRIMS.length
            ? `<div style="display:flex;flex-wrap:wrap;gap:.4rem" id="pilgrims-list">
                ${PILGRIMS.map(g => `<span style="display:inline-flex;align-items:center;gap:.35rem;background:rgba(180,150,80,.12);border:1px solid rgba(180,150,80,.25);border-radius:4px;padding:.2rem .55rem;font-size:13px">
                  ${esc(g.name)}<span style="color:var(--dim);font-size:11px">引路人</span>
                  <span style="cursor: url('../image/arr-cursors/arr-small-link.cur'), pointer;color:var(--red);font-size:11px;line-height:1;padding:.05rem .1rem" onclick="deletePilgrim('${g.id}')" title="移除">✕</span>
                </span>`).join('')}
               </div>`
            : `<div style="font-size:13px;color:var(--dim)" id="pilgrims-list">尚無引路人。</div>`}
        </div>

        `;
    }

    function addPilgrim() {
      const name = document.getElementById('new-pilgrim-name')?.value.trim();
      if (!name) { alert('請填入引路人名稱。'); return; }
      if (PILGRIMS.some(g => g.name === name)) { alert('此名稱已存在。'); return; }
      const pilgrim = { id: 'g_' + Date.now(), name };
      PILGRIMS.push(pilgrim);
      const obj = {};
      PILGRIMS.forEach(g => { obj[g.id] = g; });
      db.ref('pilgrims').set(obj);
      document.getElementById('new-pilgrim-name').value = '';
    }

    function deletePilgrim(id) {
      if (!confirm('確定要移除此引路人？')) return;
      PILGRIMS = PILGRIMS.filter(g => g.id !== id);
      const obj = {};
      PILGRIMS.forEach(g => { obj[g.id] = g; });
      db.ref('pilgrims').set(PILGRIMS.length === 0 ? null : obj);
      showStaffPage();
    }

    // ────────────────────────────────────────────────────────────
    //  客人名冊
    // ────────────────────────────────────────────────────────────
    let rosterSort = { key: 'name', asc: true };
    let rosterSearch = '';

    function onRosterSearch(q) {
      rosterSearch = q.trim().toLowerCase();
      showRosterPage();
    }

    function showRosterPage() {
      const enriched = customers.map(c => {
        const cv = visits.filter(v => v.customerId === c.id);
        const nomenCount   = cv.filter(v => (v.mode||'nomen') === 'nomen').length;
        const diningCount  = cv.filter(v => v.mode === 'dining').length;
        const pilgrimCount = cv.filter(v => v.mode === 'pilgrim').length;
        const totalSpend = cv.reduce((s,v) => s + (v.total||0) + (v.tips||[]).reduce((t,tip)=>t+tip.amount,0), 0);
        const lastVisit  = cv.length ? cv.sort((a,b) => b.createdAt.localeCompare(a.createdAt))[0].date : '';
        return { ...c, nomenCount, diningCount, pilgrimCount, visitCount: nomenCount, totalSpend, lastVisit };
      });

      const filtered = !rosterSearch ? enriched : enriched.filter(c =>
        (c.name||'').toLowerCase().includes(rosterSearch) ||
        (c.discord||'').toLowerCase().includes(rosterSearch)
      );

      const sorted = [...filtered].sort((a,b) => {
        const v1 = a[rosterSort.key] ?? 0;
        const v2 = b[rosterSort.key] ?? 0;
        const cmp = typeof v1==='string' ? v1.localeCompare(v2) : v1 - v2;
        return rosterSort.asc ? cmp : -cmp;
      });

      const arrow = (k) => rosterSort.key===k
        ? `<span style="color:var(--gold);font-size:9px;margin-left:4px">${rosterSort.asc?'▲':'▼'}</span>`
        : `<span style="color:var(--border);font-size:9px;margin-left:4px">▼</span>`;
      const th = (k, label) => `<th onclick="sortRoster('${k}')" style="cursor: url('../image/arr-cursors/arr-small-link.cur'), pointer;user-select:none">${label}${arrow(k)}</th>`;

      document.getElementById('pos-content').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
          <span style="font-family:'Noto Serif TC',serif;font-size:1rem;letter-spacing:.2em;color:var(--gold)">客人名冊</span>
          <span style="font-size:14px;color:var(--dim)">共 ${customers.length} 位</span>
        </div>
        <div style="margin-bottom:1rem">
          <input class="pos-search-input" style="width:100%;box-sizing:border-box"
            placeholder="搜尋角色名 / Discord…"
            value="${esc(rosterSearch)}"
            oninput="onRosterSearch(this.value)">
        </div>
        ${!enriched.length
          ? `<div class="pos-empty" style="height:auto;padding:3rem 0"><div class="pos-empty-icon">✦</div><div class="pos-empty-text">尚無客戶資料</div></div>`
          : `<div class="pos-card" style="padding:0;overflow:auto">
              <table class="roster-table">
                <thead><tr>
                  ${th('name','角色名稱')}
                  ${th('discord','Discord')}
                  ${th('server','伺服器')}
                  ${th('nomenCount','召引次數')}
                  ${th('diningCount','純用餐次數')}
                  ${th('pilgrimCount','朝聖次數')}
                  ${th('totalSpend','累計消費')}
                  ${th('pointsTotal','名痕')}
                  ${th('lastVisit','最後紀錄')}
                  <th>狀態</th>
                  <th></th>
                </tr></thead>
                <tbody>
                  ${sorted.map(c => `<tr onclick="goToCustomer('${c.id}')">
                    <td><span style="font-size:15px;font-weight:500;color:var(--text)">${esc(c.name)}</span></td>
                    <td style="color:var(--dim)">${esc(c.discord||'—')}</td>
                    <td style="color:var(--dim)">${esc(c.server||'—')}</td>
                    <td>${c.nomenCount}</td>
                    <td style="color:var(--dim)">${c.diningCount}</td>
                    <td style="color:var(--dim)">${c.pilgrimCount}</td>
                    <td>${c.totalSpend.toLocaleString()} Gil</td>
                    <td style="color:var(--gold)">${c.pointsTotal||0} pt</td>
                    <td style="color:var(--dim)">${c.lastVisit||'—'}</td>
                    <td>${c.hasRedeemedUltimate
                      ? `<span class="tag" style="background:rgba(192,80,80,.12);color:var(--red)">已授名</span>`
                      : ((c.pointsTotal||0)>=666 && c.totalSpend>=33333333) ? `<span class="tag tag-spec">可授名</span>` : ''}</td>
                    <td onclick="event.stopPropagation()">
                      <button class="btn btn-outline btn-sm" style="font-size:11px;padding:.2rem .55rem" onclick="gotoCustomerProfile('${c.id}')">查看/編輯</button>
                    </td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>`}`;
    }

    function sortRoster(key) {
      if (rosterSort.key === key) rosterSort.asc = !rosterSort.asc;
      else { rosterSort.key = key; rosterSort.asc = false; }
      showRosterPage();
    }

    function goToCustomer(id) {
      const c = customers.find(x => x.id === id);
      if (!c) return;
      const cv = visits.filter(v => v.customerId === id)
                       .sort((a,b) => b.createdAt.localeCompare(a.createdAt));
      const nomenCount   = cv.filter(v => (v.mode||'nomen') === 'nomen').length;
      const diningCount  = cv.filter(v => v.mode === 'dining').length;
      const pilgrimCount = cv.filter(v => v.mode === 'pilgrim').length;
      const totalSpend = cv.reduce((s,v) => s + (v.total||0) + (v.tips||[]).reduce((t,tip)=>t+tip.amount,0), 0);
      const canRedeem  = (c.pointsTotal||0) >= 666 && totalSpend >= 33333333 && !c.hasRedeemedUltimate;

      document.getElementById('modal-profile-name').textContent = c.name;
      document.getElementById('modal-profile-body').innerHTML = `
        ${canRedeem ? `<div class="pos-redeem-alert" style="margin-bottom:1rem">
          <span style="font-size:1.1rem">✦</span>

    function showStatsPage() {
      const totalRevenue  = visits.reduce((s,v) => s + (v.total||0), 0);
      const totalVisits   = visits.length;
      const bookedCount   = visits.filter(v => v.type==='booked').length;

      // 食罪／妖異 圓環圖

      const yiCount  = visits.filter(v => v.apostleTag === '妖異').length;
      const donutTot = sinCount + yiCount;
      const circ     = +(2 * Math.PI * 24).toFixed(2);
      const sinArc   = donutTot ? +((sinCount / donutTot) * circ).toFixed(2) : 0;
      const yiArc    = donutTot ? +((yiCount  / donutTot) * circ).toFixed(2) : 0;
      const donutSvg = `<svg width="68" height="68" style="flex-shrink:0">
        <circle cx="34" cy="34" r="24" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="9"/>

          stroke-dasharray="${sinArc} ${circ}" transform="rotate(-90 34 34)"/>
        <circle cx="34" cy="34" r="24" fill="none" stroke="var(--yi)" stroke-width="9"
          stroke-dasharray="${yiArc} ${circ}" stroke-dashoffset="${-sinArc}" transform="rotate(-90 34 34)"/>

      const apostleRank = Object.entries(apostleTally)
        .map(([name, d]) => ({ name, count: d.count, tag: d.tag || (APOSTLES.find(a=>a.name===name)?.tag||'') }))

      // 累計消費排行（所有客戶，含已兌換）

            <div class="stat-card-val">${totalRevenue.toLocaleString()}</div>
            <div class="stat-card-lbl">總營業額 Gil</div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">

          <!-- 召引類型 -->
          <div class="pos-card" style="margin:0">
            <div class="pos-card-title">召引類型</div>
            ${typeRow('預約',    bookedCount, 'var(--blue)')}
            ${typeRow('現場',    walkinCount, 'var(--orange)')}
            <div style="border-top:1px solid var(--border);margin:.4rem 0"></div>

          <!-- 使徒接待排行 -->

            <div class="pos-card-title">使徒接待排行</div>
            ${!apostleRank.length
              ? `<div style="font-size:14px;color:var(--dim);text-align:center;padding:.5rem 0">尚無資料</div>`
              : apostleRank.slice(0,6).map((a,i) => `
              <div class="rank-row">

                  ${a.tag?`<div style="font-size:12px;color:${tagColor(a.tag)}">${esc(a.tag)}</div>`:''}
                </div>
                <div class="rank-bar-wrap"><div class="rank-bar" style="width:${a.count/maxApostle*100}%"></div></div>
                <span style="font-size:14px;color:var(--gold);min-width:30px;text-align:right">${a.count}</span>
              </div>`).join('')}
          </div>
        </div>

        <!-- 餐點銷售排行 -->
        <div class="pos-card">
          <div class="pos-card-title">餐點銷售排行</div>
          ${!menuRank.length
            ? `<div style="font-size:14px;color:var(--dim);text-align:center;padding:.5rem 0">尚無點餐紀錄</div>`
            : `<table style="width:100%;border-collapse:collapse;font-size:14px">
              <thead><tr>
                <th style="text-align:left;padding:.4rem .65rem;color:var(--dim);font-weight:400;font-size:13px;border-bottom:1px solid var(--border)">餐點</th>
                <th style="text-align:left;padding:.4rem .65rem;color:var(--dim);font-weight:400;font-size:13px;border-bottom:1px solid var(--border)">銷售量</th>
                <th style="text-align:left;padding:.4rem .65rem;color:var(--dim);font-weight:400;font-size:13px;border-bottom:1px solid var(--border)">佔比</th>
                <th style="text-align:right;padding:.4rem .65rem;color:var(--dim);font-weight:400;font-size:13px;border-bottom:1px solid var(--border)">營業額</th>
              </tr></thead>
              <tbody>${menuRank.map((m,i) => `<tr>
                <td style="padding:.55rem .65rem;border-bottom:1px solid rgba(0,0,0,.04)">${esc(m.name)}${i===0?' <span class="event-badge" style="margin-left:.4rem">No.1</span>':''}</td>
                <td style="padding:.55rem .65rem;border-bottom:1px solid rgba(0,0,0,.04)">
                  <div style="display:flex;align-items:center;gap:.5rem">
                    <span>${m.qty}</span>
                    <div style="flex:1;background:rgba(0,0,0,.05);height:4px;border-radius:2px;max-width:80px"><div style="height:100%;background:var(--gold);border-radius:2px;width:${m.qty/maxMenu*100}%"></div></div>
                  </div>
                </td>
                <td style="padding:.55rem .65rem;border-bottom:1px solid rgba(0,0,0,.04);color:var(--dim)">
                  ${menuRank.reduce((s,x)=>s+x.qty,0)?Math.round(m.qty/menuRank.reduce((s,x)=>s+x.qty,0)*100)+'%':'—'}
                </td>
                <td style="padding:.55rem .65rem;border-bottom:1px solid rgba(0,0,0,.04);text-align:right;color:var(--gold)">${m.revenue.toLocaleString()} Gil</td>
              </tr>`).join('')}</tbody>
            </table>`}
        </div>

        <!-- 累計消費排行 -->
        <div class="pos-card">
          <div class="pos-card-title" style="display:flex;justify-content:space-between;align-items:center">

    // ────────────────────────────────────────────────────────────
    //  今日結帳
    // ────────────────────────────────────────────────────────────
    let _svPrice = 0, _svQty = 1, _numPilgrims = 1, _selectedPilgrims = [], _schedPilgrimsDate = '';

    function _onSettleInput(id, val) {
      if (id === 'settle-sv-price')   _svPrice   = parseInt(val) || 0;
      if (id === 'settle-sv-qty')     _svQty     = Math.max(1, parseInt(val) || 1);
      if (id === 'settle-num-pilgrims') _numPilgrims = Math.max(1, parseInt(val) || 1);
      const pos = document.getElementById(id)?.selectionStart;
      showSettlementPage();
      const el = document.getElementById(id);
      if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch(e) {} }
    }

    function togglePilgrimSelect(name) {
      const i = _selectedPilgrims.indexOf(name);
      if (i >= 0) _selectedPilgrims.splice(i, 1);
      else _selectedPilgrims.push(name);
      showSettlementPage();
    }

    function initSettlementPilgrims() {
      const today = getBusinessDate();
      if (_schedPilgrimsDate === today) return;
      _schedPilgrimsDate = today;
      db.ref('schedules').orderByKey()
        .startAt(today + '_').endAt(today + '_')
        .once('value', snap => {
          const names = new Set();
          snap.forEach(slotSnap => {
            slotSnap.forEach(entrySnap => {
              const e = entrySnap.val();
              if (e.role === 'pilgrim' && e.displayName) names.add(e.displayName);
            });
          });
          if (names.size > 0) {
            _selectedPilgrims = [...names];
            showSettlementPage();
          }
        });
    }

    function showSettlementPage() {
      // 保留輸入值
      const pEl = document.getElementById('settle-sv-price');
      const qEl = document.getElementById('settle-sv-qty');
      const gEl = document.getElementById('settle-num-pilgrims');
      if (pEl) _svPrice   = parseInt(pEl.value) || 0;
      if (qEl) _svQty     = Math.max(1, parseInt(qEl.value) || 1);
      if (gEl) _numPilgrims = Math.max(1, parseInt(gEl.value) || 1);

      const today = getBusinessDate();
      const tv = visits.filter(v => v.date === today);

      // 依使徒分組
      const aMap = {};
      const ensureA = n => { if (!aMap[n]) aMap[n] = { wreath:0, nomen:0, photos:0, photoExtras:0, photoSig:0, houseOther:0 }; };
      tv.forEach(v => {
        const name = v.apostleName || '（未指定）';
        ensureA(name);
        (v.services || []).forEach(sid => {
          const svc = SERVICES.find(s => s.id === sid);
          if (!svc) return;
          if (sid === 'wreath_booked' || sid === 'wreath_walkin') aMap[name].wreath += svc.price;
          else if (sid === 'nomen30')      aMap[name].nomen       += svc.price;
          else if (sid === 'photo')        aMap[name].photos++;
          else if (sid === 'photo_sig')    aMap[name].photoSig    += svc.price;
          else if (sid === 'photo_extra')  { /* handled via v.photoExtras below */ }
          else                             aMap[name].houseOther  += svc.price;
        });
        (v.photoExtras || []).forEach(extraName => {
          if (!extraName) return;
          ensureA(extraName);
          aMap[extraName].photoExtras++;
        });
      });

      const pilgrimNms   = new Set(PILGRIMS.map(g => g.name));
      const allNames   = Object.keys(aMap);
      const names      = allNames.filter(n => !pilgrimNms.has(n));  // apostles only for svPerA calc
      const pilgrimPhotoNames = allNames.filter(n => pilgrimNms.has(n));
      const numA   = names.length || 1;

      // 紀念品計算
      const svTotal  = _svPrice * _svQty;
      const svHouse  = Math.floor(svTotal * 0.7);
      const svPool   = Math.floor(svTotal * 0.2); // 使徒總池
      const svPilgrim  = svTotal - svHouse - svPool;
      const svPerA   = numA > 0 ? Math.floor(svPool / numA) : 0;

      // 匯總
      let totNomen = 0, totPhotos = 0, totPhotoExtras = 0, totPhotoSig = 0, totOrders = 0, totHouseOther = 0;
      // 花環從所有來訪加總（不依使徒歸屬）
      let totWreath = 0;
      tv.forEach(v => (v.services||[]).forEach(sid => {
        if (sid === 'wreath_booked' || sid === 'wreath_walkin') {
          const svc = SERVICES.find(s => s.id === sid); if (svc) totWreath += svc.price;
        }
      }));
      names.forEach(n => {
        totNomen       += aMap[n].nomen;
        totPhotos      += aMap[n].photos;
        totPhotoExtras += aMap[n].photoExtras;
        totPhotoSig    += aMap[n].photoSig;
        totHouseOther  += aMap[n].houseOther;
      });
      // Include pilgrim photos in house-side photo count (pilgrims still get 20,000 each; house gets 80,000)
      pilgrimPhotoNames.forEach(n => {
        totPhotos      += aMap[n].photos;
        totPhotoExtras += aMap[n].photoExtras;
      });
      tv.forEach(v => totOrders += (v.ordersTotal || 0));
      const totExtraSig = tv.reduce((s,v) => s + (v.photoExtraSigs||[]).filter(Boolean).length * 20000, 0);

      const photoHouseCut = totPhotos * 80000 + totPhotoSig + totExtraSig;

      const numPilgrimsEff  = PILGRIMS.length ? (_selectedPilgrims.length || PILGRIMS.length) : _numPilgrims;
      const numApostlesEff  = names.filter(n => n !== '（未指定）').length || 1;
      const houseTotal = Math.floor(totWreath * 0.7) + photoHouseCut + svHouse + totOrders + totHouseOther;

      // 使徒區塊
      const apostleBlocks = names.filter(n => n !== '（未指定）').map(name => {
        const a = aMap[name];
        const wCut  = totWreath > 0 ? Math.floor(Math.floor(totWreath * 0.1) / numApostlesEff) : 0;
        const nCut  = a.nomen;
        const pCut  = a.photos * 20000;
        const exCut = a.photoExtras * 20000;
        const sCut  = svPerA;
        const sub   = wCut + nCut + pCut + exCut + sCut;

        const rows = [
          totWreath ? `<div class="settle-row"><span class="settle-row-lbl">入場費分潤（÷ ${numApostlesEff}）</span><span class="settle-row-base">${Math.floor(totWreath*0.1).toLocaleString()}</span><span class="settle-row-rate">÷ ${numApostlesEff}</span><span class="settle-row-cut">${wCut.toLocaleString()}</span></div>` : '',
          a.nomen       ? `<div class="settle-row"><span class="settle-row-lbl">指名費（顯名儀）</span><span class="settle-row-base">${a.nomen.toLocaleString()}</span><span class="settle-row-rate">× 100%</span><span class="settle-row-cut">${nCut.toLocaleString()}</span></div>` : '',
          a.photos      ? `<div class="settle-row"><span class="settle-row-lbl">交名留影</span><span class="settle-row-base">${a.photos} 張</span><span class="settle-row-rate">固定 20,000</span><span class="settle-row-cut">${pCut.toLocaleString()}</span></div>` : '',
          a.photoExtras ? `<div class="settle-row"><span class="settle-row-lbl">多人合照</span><span class="settle-row-base">${a.photoExtras} 人</span><span class="settle-row-rate">固定 20,000</span><span class="settle-row-cut">${exCut.toLocaleString()}</span></div>` : '',
          svTotal       ? `<div class="settle-row"><span class="settle-row-lbl">紀念品分潤（÷ ${numA} 人）</span><span class="settle-row-base">${svPool.toLocaleString()}</span><span class="settle-row-rate">÷ ${numA}</span><span class="settle-row-cut">${sCut.toLocaleString()}</span></div>` : '',
        ].filter(Boolean).join('');

        return `<div class="settle-block">
          <div class="settle-block-hdr">
            <span class="settle-block-name">${esc(name)}</span>
            <span class="settle-block-total">${sub.toLocaleString()} Gil</span>
          </div>
          <div class="settle-rows">${rows || '<div style="font-size:13px;color:var(--dim);padding:.2rem 0">無紀錄</div>'}</div>
        </div>`;
      }).join('');

      const apostleTotal = names.reduce((s, n) => {
        const a = aMap[n];
        const wc = n !== '（未指定）' && totWreath > 0 ? Math.floor(Math.floor(totWreath*0.1) / numApostlesEff) : 0;
        return s + wc + a.nomen + a.photos*20000 + a.photoExtras*20000 + svPerA;
      }, 0);
      // Pilgrim photo cuts (separate from pilgrim pool)
      const pilgrimPhotoCuts = pilgrimPhotoNames.reduce((s,n) => {
        const a = aMap[n]; return s + a.photos*20000 + a.photoExtras*20000;
      }, 0);
      const pilgrimPhotoLines = pilgrimPhotoNames.map(n => {
        const a = aMap[n];
        const pCut  = a.photos * 20000;
        const exCut = a.photoExtras * 20000;
        const sub   = pCut + exCut;
        return sub > 0
          ? `<div style="margin-top:.35rem;font-size:13px;color:var(--text)">${esc(n)}：` +
            (pCut  ? `交名留影 ${a.photos} 張 = ${pCut.toLocaleString()}` : '') +
            (pCut && exCut ? '・' : '') +
            (exCut ? `多人合照 ${a.photoExtras} 人 = ${exCut.toLocaleString()}` : '') +
            `</div>`
          : '';
      }).filter(Boolean).join('');
      // 引路人個人薪酬明細
      const _pilgrimBlockList = PILGRIMS.length ? (_selectedPilgrims.length ? _selectedPilgrims : PILGRIMS.map(g => g.name)) : [];
      const pilgrimSettleBlocks = _pilgrimBlockList.length ? _pilgrimBlockList.map(name => {
        const a = aMap[name] || { photos: 0, photoExtras: 0 };
        const wreathShare = totWreath && numPilgrimsEff > 0 ? Math.floor(Math.floor(totWreath * 0.2) / numPilgrimsEff) : 0;
        const svShare     = svPilgrim   && numPilgrimsEff > 0 ? Math.floor(svPilgrim / numPilgrimsEff) : 0;
        const pCut  = (a.photos || 0) * 20000;
        const exCut = (a.photoExtras || 0) * 20000;
        const sub   = wreathShare + svShare + pCut + exCut;
        const rows = [
          totWreath ? `<div class="settle-row"><span class="settle-row-lbl">入場費分潤（÷ ${numPilgrimsEff}）</span><span class="settle-row-base">${Math.floor(totWreath*0.2).toLocaleString()}</span><span class="settle-row-rate">÷ ${numPilgrimsEff}</span><span class="settle-row-cut">${wreathShare.toLocaleString()}</span></div>` : '',
          svPilgrim   ? `<div class="settle-row"><span class="settle-row-lbl">紀念品分潤（÷ ${numPilgrimsEff}）</span><span class="settle-row-base">${svPilgrim.toLocaleString()}</span><span class="settle-row-rate">÷ ${numPilgrimsEff}</span><span class="settle-row-cut">${svShare.toLocaleString()}</span></div>` : '',
          pCut      ? `<div class="settle-row"><span class="settle-row-lbl">交名留影</span><span class="settle-row-base">${a.photos} 張</span><span class="settle-row-rate">固定 20,000</span><span class="settle-row-cut">${pCut.toLocaleString()}</span></div>` : '',
          exCut     ? `<div class="settle-row"><span class="settle-row-lbl">多人合照</span><span class="settle-row-base">${a.photoExtras} 人</span><span class="settle-row-rate">固定 20,000</span><span class="settle-row-cut">${exCut.toLocaleString()}</span></div>` : '',
        ].filter(Boolean).join('');
        return `<div class="settle-block">
          <div class="settle-block-hdr">
            <span class="settle-block-name">${esc(name)}</span>
            <span class="settle-block-total">${sub.toLocaleString()} Gil</span>
          </div>
          <div class="settle-rows">${rows || '<div style="font-size:13px;color:var(--dim);padding:.2rem 0">無紀錄</div>'}</div>
        </div>`;
      }).join('') : '';

      const pilgrimPool = Math.floor(totWreath * 0.2) + svPilgrim;

      const recorded  = tv.reduce((s,v) => s + (v.total||0), 0);
      const revenue   = recorded + svTotal;
      const wages     = apostleTotal + pilgrimPool + pilgrimPhotoCuts;
      const profit    = houseTotal;

      document.getElementById('pos-content').innerHTML = `
        <div style="font-family:'Noto Serif TC',serif;font-size:1rem;letter-spacing:.2em;color:var(--gold);margin-bottom:1.25rem">今日結帳</div>

        <div class="settle-souvenir">
          <div class="settle-sv-row" style="margin-top:0;margin-bottom:.55rem">
            <span style="font-size:12px;color:var(--dim);letter-spacing:.06em;min-width:48px">紀念品</span>
            <input id="settle-sv-price" type="number" class="settle-input" placeholder="扣稅後單價" value="${_svPrice||''}" min="0" style="width:140px" oninput="_onSettleInput('settle-sv-price',this.value)">
            <span style="color:var(--dim)">×</span>
            <input id="settle-sv-qty" type="number" class="settle-input" placeholder="數量" value="${_svQty}" min="1" style="width:64px" oninput="_onSettleInput('settle-sv-qty',this.value)">
            <span style="color:var(--dim)">=</span>
            <span style="color:var(--gold);font-weight:700;font-size:1rem">${svTotal.toLocaleString()} Gil</span>
            ${svTotal ? `<span style="font-size:12px;color:var(--dim)">（店家 ${svHouse.toLocaleString()} ／使徒 ${svPool.toLocaleString()} ／引路人 ${svPilgrim.toLocaleString()}）</span>` : ''}
          </div>
        </div>

        ${!names.length ? `<div class="pos-empty"><div class="pos-empty-icon">—</div><div class="pos-empty-text">今日尚無造訪紀錄</div></div>` : `

        <div class="settle-sub-lbl">店員薪酬</div>
        ${apostleBlocks}
        ${pilgrimSettleBlocks}

        <div class="settle-divider"></div>

        <div class="settle-block" style="margin-bottom:1.1rem">
          <div class="settle-block-hdr">
            <span class="settle-block-name">店家</span>
            <span class="settle-block-total">${houseTotal.toLocaleString()} Gil</span>
          </div>
          <div class="settle-rows">
            ${[
              totWreath     ? `<div class="settle-row"><span class="settle-row-lbl">入場費（花環）</span><span class="settle-row-base">${totWreath.toLocaleString()}</span><span class="settle-row-rate">× 70%</span><span class="settle-row-cut">${Math.floor(totWreath*0.7).toLocaleString()}</span></div>` : '',
              totPhotos     ? `<div class="settle-row"><span class="settle-row-lbl">交名留影（店家）</span><span class="settle-row-base">${totPhotos} 張</span><span class="settle-row-rate">固定 80,000</span><span class="settle-row-cut">${(totPhotos*80000).toLocaleString()}</span></div>` : '',
              totPhotoSig   ? `<div class="settle-row"><span class="settle-row-lbl">加簽名（交名留影）</span><span class="settle-row-base">${totPhotoSig.toLocaleString()}</span><span class="settle-row-rate">× 100%</span><span class="settle-row-cut">${totPhotoSig.toLocaleString()}</span></div>` : '',
              totExtraSig   ? `<div class="settle-row"><span class="settle-row-lbl">加簽名（多人合照）</span><span class="settle-row-base">${totExtraSig.toLocaleString()}</span><span class="settle-row-rate">× 100%</span><span class="settle-row-cut">${totExtraSig.toLocaleString()}</span></div>` : '',
              svTotal       ? `<div class="settle-row"><span class="settle-row-lbl">紀念品</span><span class="settle-row-base">${svTotal.toLocaleString()}</span><span class="settle-row-rate">× 70%</span><span class="settle-row-cut">${svHouse.toLocaleString()}</span></div>` : '',
              totOrders     ? `<div class="settle-row"><span class="settle-row-lbl">餐飲</span><span class="settle-row-base">${totOrders.toLocaleString()}</span><span class="settle-row-rate">× 100%</span><span class="settle-row-cut">${totOrders.toLocaleString()}</span></div>` : '',
              totHouseOther ? `<div class="settle-row"><span class="settle-row-lbl">其他</span><span class="settle-row-base">${totHouseOther.toLocaleString()}</span><span class="settle-row-rate">× 100%</span><span class="settle-row-cut">${totHouseOther.toLocaleString()}</span></div>` : '',
            ].filter(Boolean).join('') || '<div style="font-size:13px;color:var(--dim);padding:.2rem 0">無紀錄</div>'}
          </div>
        </div>

        <div class="settle-grand">
          <div>
            <div class="settle-grand-lbl">今日營業總額</div>
            <div style="font-size:12px;color:var(--dim);margin-top:.1rem">系統紀錄 ${recorded.toLocaleString()}${svTotal ? ` ＋ 紀念品 ${svTotal.toLocaleString()}` : ''} Gil</div>
          </div>
          <div class="settle-grand-val">${revenue.toLocaleString()} Gil</div>
        </div>
        <div class="settle-wages">
          <span>薪酬支出（使徒 ${apostleTotal.toLocaleString()} ＋ 引路人 ${(pilgrimPool + pilgrimPhotoCuts).toLocaleString()}）</span>
          <span style="color:var(--red)">－ ${wages.toLocaleString()} Gil</span>
        </div>
        <div class="settle-profit ${profit >= 0 ? 'pos' : 'neg'}">
          <div class="settle-profit-lbl">${profit >= 0 ? '店家盈餘' : '本日虧損'}</div>
          <div class="settle-profit-val">${profit < 0 ? '－' : ''}${Math.abs(profit).toLocaleString()} Gil</div>
        </div>
        `}
      `;
    }

    // ────────────────────────────────────────────────────────────
    //  舊客到訪快速搜尋
    // ────────────────────────────────────────────────────────────
    function openWalkinSearchModal() {
      const inp = document.getElementById('walkin-search-inp');
      if (inp) inp.value = '';
      renderWalkinSearch();
      document.getElementById('modal-walkin-search').classList.add('open');
      setTimeout(() => inp?.focus(), 80);
    }

    function renderWalkinSearch() {
      const q = (document.getElementById('walkin-search-inp')?.value || '').toLowerCase().trim();
      const list = document.getElementById('walkin-search-list');
      if (!list) return;
      const results = q
        ? customers.filter(c =>
            (c.name||'').toLowerCase().includes(q) ||
            (c.discord||'').toLowerCase().includes(q))
        : customers.slice().sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0, 20);
      if (!results.length) {
        list.innerHTML = `<div style="padding:1rem;font-size:14px;color:var(--dim);text-align:center">查無結果</div>`;
        return;
      }
      list.innerHTML = results.map(c => `
        <div class="pos-customer-item" style="cursor: url('../image/arr-cursors/arr-small-link.cur'), pointer" onclick="walkinSelectCustomer('${c.id}')">
          <div class="pos-ci-name">${esc(c.name)}</div>
          <div class="pos-ci-discord">${esc(c.discord||'—')} · ${esc(c.server||'—')}</div>
          <div class="pos-ci-pts">名痕 ${c.pointsTotal||0} pt</div>
        </div>`).join('');
    }

    function createWalkinCheckin(customerId) {
      const today = getBusinessDate();
      const alreadyHasVisit = visits.some(v => v.customerId === customerId && v.date === today);
      if (alreadyHasVisit) return;
      const now = new Date();
      const timeStr = pad(now.getHours()) + ':' + pad(now.getMinutes());
      const wreathSvc = SERVICES.find(s => s.id === 'wreath_walkin');
      const wp = wreathSvc?.price || 0;
      const v = {
        id: 'v_' + Date.now(),
        customerId,
        mode: 'checkin',
        date: today,
        time: timeStr,
        type: 'walkin',
        apostleType: 'unspecified',
        apostleName: '', apostleTag: '',
        services: ['wreath_walkin'],
        orders: [],
        servicesTotal: wp,
        ordersTotal: 0,
        total: wp,
        pointsEarned: 0,
        pointMultiplier: 1,
        eventId: '', eventName: '',
        notes: '',
        tips: [],
        createdAt: new Date().toISOString(),
      };
      visits.push(v);
      save('pos_visits', visits);
    }

    function walkinSelectCustomer(id) {
      closeModal('modal-walkin-search');
      createWalkinCheckin(id);
      renderSidebar();
      gotoCustomerProfile(id);
    }

    // ────────────────────────────────────────────────────────────
    //  客戶 Modal（新增 / 編輯）
    // ────────────────────────────────────────────────────────────
    function openNewCustomerModal() {
      ['nc-name','nc-discord','nc-contact','nc-notes'].forEach(k => document.getElementById(k).value='');
      document.getElementById('nc-server').value = '';
      document.getElementById('modal-customer-title').textContent = '新增客戶';
      document.getElementById('modal-customer-confirm').onclick = createCustomer;
      document.getElementById('modal-customer').classList.add('open');
    }

    function openEditCustomerModal(id) {
      const c = customers.find(x => x.id===id);
      if (!c) return;
      document.getElementById('nc-name').value    = c.name    || '';
      document.getElementById('nc-discord').value = c.discord || '';
      document.getElementById('nc-server').value  = c.server  || '';
      document.getElementById('nc-contact').value = c.contact || '';
      document.getElementById('nc-notes').value   = c.notes   || '';
      document.getElementById('modal-customer-title').textContent = '編輯客戶資料';
      document.getElementById('modal-customer-confirm').onclick = () => updateCustomer(id);
      document.getElementById('modal-customer').classList.add('open');
    }

    function createCustomer() {
      const name = document.getElementById('nc-name').value.trim();
      if (!name) { alert('請填寫角色名稱'); return; }
      const c = {
        id: 'c_' + Date.now(),
        name,
        discord: document.getElementById('nc-discord').value.trim(),
        server:  document.getElementById('nc-server').value,
        contact: document.getElementById('nc-contact').value.trim(),
        notes:   document.getElementById('nc-notes').value.trim(),
        pointsTotal: 0,
        hasRedeemedUltimate: false,
        createdAt: new Date().toISOString(),
      };
      customers.push(c);
      save('pos_customers', customers);
      createWalkinCheckin(c.id);
      closeModal('modal-customer');
      currentNav = 'customer';
      activeId = c.id;
      ['customer','roster','stats','activity','settlement'].forEach(t => {
        const btn = document.getElementById('nav-btn-'+t);
        if (btn) btn.className = 'pos-nav-btn' + (t==='customer' ? ' on' : '');
      });
      document.getElementById('sidebar-customer').style.display = 'flex';
      const _soC = document.getElementById('sidebar-other');
      if (_soC) _soC.style.display = 'none';
      renderSidebar();
      showProfile(c.id);
    }

    function updateCustomer(id) {
      const c = customers.find(x => x.id===id);
      if (!c) return;
      c.name    = document.getElementById('nc-name').value.trim();
      c.discord = document.getElementById('nc-discord').value.trim();
      c.server  = document.getElementById('nc-server').value;
      c.contact = document.getElementById('nc-contact').value.trim();
      c.notes   = document.getElementById('nc-notes').value.trim();
      save('pos_customers', customers);
      closeModal('modal-customer');
      renderSidebar();
      showProfile(id);
    }

    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    // ────────────────────────────────────────────────────────────
    //  工具
    // ────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ────────────────────────────────────────────────────────────
    //  測試資料
    // ────────────────────────────────────────────────────────────
    function loadDemoData() {

      const now = new Date().toISOString();
      const today = now.slice(0, 10);
      customers = [
        { id:'c_demo1', name:'星落·伊華', discord:'starhaven_iwa', server:'鳳凰', contact:'', notes:'偏好安靜的角落', pointsTotal:4, hasRedeemedUltimate:false, createdAt:now },
        { id:'c_demo2', name:'緋夜·碎鏡', discord:'scarletnight_', server:'巴哈姆特', contact:'', notes:'', pointsTotal:660, hasRedeemedUltimate:false, createdAt:now },
        { id:'c_demo3', name:'霧白·淵聲', discord:'mistwhisper99', server:'泰坦', contact:'', notes:'已使用高級服務一次', pointsTotal:2, hasRedeemedUltimate:true, createdAt:now },

        { id:'v_d7', customerId:'c_demo2', date:today, time:'22:30', type:'booked', apostleType:'specified', apostleName:'掠影', apostleTag:'食罪', services:['wreath_booked','nomen30'], orders:[], servicesTotal:120000, ordersTotal:0, total:120000, pointsEarned:1, pointMultiplier:1, notes:'', createdAt:now },
        { id:'v_d8', customerId:'c_demo3', date:today, time:'22:00', type:'walkin', apostleType:'specified', apostleName:'安怛', apostleTag:'妖異', services:['wreath_walkin','nomen30'], orders:[{name:'彌撒',price:7000,qty:1}], servicesTotal:130000, ordersTotal:7000, total:137000, pointsEarned:1, pointMultiplier:1, notes:'現場到訪', createdAt:now },

      save('pos_customers', customers);

        <div class="pos-empty">
          <div class="pos-empty-icon">✦</div>
          <div class="pos-empty-text">測試資料已載入，請從左側選擇客戶</div>
        </div>`;
    }

    // ────────────────────────────────────────────────────────────
    //  Init — Firebase listeners 負責觸發初始化
    // ────────────────────────────────────────────────────────────
    document.addEventListener('contextmenu', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
    document.addEventListener('dragstart',   e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
  </script>
</body>
