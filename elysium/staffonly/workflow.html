<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安息地 · 工作流程</title>
  <link rel="icon" type="image/png" href="../image/Elysium_LOGO_mini_dark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #8a5c1e; --gold-dim: rgba(138,92,30,.12);
      --bg: #f5f0e8; --panel: #ece6d8; --card: #fdfaf5;
      --border: rgba(0,0,0,.1); --text: #1a1208; --dim: #7a6a52;
      --red: #b03838;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; cursor: inherit; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; cursor: url('../image/arr-cursors/arr-small-pointer.cur'), default; }
    a, button, [role="button"], select, [onclick] { cursor: url('../image/arr-cursors/arr-small-link.cur'), pointer; }

    .hdr { display: flex; align-items: center; justify-content: space-between; padding: .72rem 1.5rem; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .hdr-title { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--gold); letter-spacing: .2em; }
    .main { flex: 1; padding: 1.25rem 1.5rem 3rem; width: 100%; margin: 0 auto; display: none; }

    .toolbar { display: flex; justify-content: flex-end; margin-bottom: 1rem; }

    .btn { padding: .38rem .85rem; font-size: 12px; border: none; font-family: inherit; transition: all .15s; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-gold { background: var(--gold); color: #fdfaf5; }
    .btn-gold:hover { background: #6f4a17; }
    .btn-danger { background: none; border: 1px solid var(--red); color: var(--red); }
    .btn-danger:hover { background: rgba(176,56,56,.1); }
    .btn-sm { padding: .3rem .7rem; font-size: 12px; }

    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; align-items: start; }
    @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px)  { .board { grid-template-columns: 1fr; } }

    .col { background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; }
    .col-hdr { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .75rem .85rem; border-bottom: 1px solid var(--border); }
    .col-title { font-family: 'Noto Serif TC', serif; font-size: .92rem; color: var(--gold); letter-spacing: .06em; word-break: break-word; }
    .col-del { background: none; border: none; color: var(--dim); font-size: 15px; line-height: 1; padding: .15rem; }
    .col-del:hover { color: var(--red); }
    .col-body { display: flex; flex-direction: column; gap: .6rem; padding: .75rem; flex: 1; }

    .block { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: .65rem .75rem; }
    .block-title { font-size: 13px; font-weight: 500; margin-bottom: .3rem; word-break: break-word; }
    .block-content { font-size: 12.5px; color: var(--dim); white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
    .block-actions { display: flex; gap: .5rem; margin-top: .5rem; }
    .block-actions button { background: none; border: none; font-size: 11px; color: var(--dim); padding: 0; }
    .block-actions button:hover { color: var(--gold); }
    .block-actions button.del:hover { color: var(--red); }

    .col-add { background: none; border: 1px dashed var(--border); color: var(--dim); font-size: 12px; padding: .5rem; font-family: inherit; }
    .col-add:hover { border-color: var(--gold); color: var(--gold); }

    .empty-hint { font-size: 13px; color: var(--dim); padding: 1.5rem 0; text-align: center; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(20,15,8,.45); z-index: 500; align-items: center; justify-content: center; padding: 1.2rem; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--border); width: 100%; max-width: 380px; padding: 1.4rem; }
    .modal-title { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--gold); letter-spacing: .1em; margin-bottom: 1rem; }
    .modal-input, .modal-textarea { width: 100%; padding: .55rem .7rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: 13px; font-family: inherit; outline: none; margin-bottom: .8rem; }
    .modal-input:focus, .modal-textarea:focus { border-color: var(--gold); }
    .modal-textarea { resize: vertical; min-height: 90px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; }

    .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .auth-box { text-align: center; width: 340px; padding: 2rem; }
    .auth-logo { font-family: 'Noto Serif TC', serif; font-size: 2.2rem; color: var(--gold); letter-spacing: .25em; margin-bottom: .4rem; }
    .auth-tagline { font-size: 13px; color: var(--dim); margin-bottom: 2.5rem; letter-spacing: .08em; }
    .auth-google-btn { width: 100%; justify-content: center; display: flex; align-items: center; }
    .auth-err { color: var(--red); font-size: 13px; margin-top: .75rem; min-height: 1.2em; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-title">✦ 安息地 · 工作流程</div>
  <div style="display:flex;align-items:center;gap:.85rem">
    <div id="user-badge" style="display:none;align-items:center;gap:.5rem;font-size:12px"></div>
  </div>
</header>

<div class="main" id="main">
  <div class="toolbar">
    <button class="btn btn-gold" onclick="openTopicModal()">＋ 新增主題</button>
  </div>
  <div id="board" class="board"></div>
</div>

<div id="auth-overlay" class="auth-overlay">
  <div id="auth-loading" class="auth-box">
    <div style="color:var(--dim);font-size:15px;letter-spacing:.1em">載入中…</div>
  </div>
  <div id="auth-login" class="auth-box" style="display:none">
    <div class="auth-logo">安息地</div>
    <div class="auth-tagline">工作流程</div>
    <button class="btn btn-outline auth-google-btn" style="background:var(--gold);color:#1c1208;font-weight:600" onclick="signInGoogle()">Google 登入</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
  <div id="auth-denied" class="auth-box" style="display:none">
    <div class="auth-logo" style="font-size:1.5rem;margin-bottom:1rem">無權限</div>
    <div style="color:var(--dim);font-size:13px;line-height:1.8;margin-bottom:1rem">此頁面僅限管理員使用。</div>
    <button class="btn btn-outline" style="width:100%" onclick="doSignOut()">登出</button>
  </div>
</div>

<div id="topic-modal" class="modal-overlay" onclick="if(event.target===this) closeTopicModal()">
  <div class="modal-box">
    <div class="modal-title">新增主題</div>
    <input id="topic-input" class="modal-input" type="text" placeholder="主題名稱" maxlength="40">
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="closeTopicModal()">取消</button>
      <button class="btn btn-gold btn-sm" onclick="saveTopic()">儲存</button>
    </div>
  </div>
</div>

<div id="block-modal" class="modal-overlay" onclick="if(event.target===this) closeBlockModal()">
  <div class="modal-box">
    <div class="modal-title" id="block-modal-title">新增方塊</div>
    <input id="block-title-input" class="modal-input" type="text" placeholder="標題" maxlength="60">
    <textarea id="block-content-input" class="modal-textarea" placeholder="內文"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="closeBlockModal()">取消</button>
      <button class="btn btn-gold btn-sm" onclick="saveBlock()">儲存</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getDatabase, ref as dbRef, onValue, get, set, remove } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserPopupRedirectResolver, GoogleAuthProvider, signInWithPopup, getRedirectResult, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const app = initializeApp({
  apiKey:            "AIzaSyCZkdAeMKUWXQPXFptw3t4dYVOBAo7lF5Q",
  authDomain:        "elysiumpos.firebaseapp.com",
  databaseURL:       "https://elysiumpos-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "elysiumpos",
  storageBucket:     "elysiumpos.firebasestorage.app",
  messagingSenderId: "430177597593",
  appId:             "1:430177597593:web:7598eaf6e5e6264dc82008"
});
const db   = getDatabase(app);
const auth = initializeAuth(app, {
  persistence:           [indexedDBLocalPersistence, browserLocalPersistence],
  popupRedirectResolver: browserPopupRedirectResolver,
});
getRedirectResult(auth).catch(() => {});

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function newId()  { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

const ROLE_LABEL = { admin: '管理員', pilgrim: '引路人', apostle: '使徒' };

let currentUser = null;
let workflows = {};
let editTopicId = null, editBlockTopicId = null, editBlockId = null;

onAuthStateChanged(auth, async user => {
  if (!user) { showAuth('login'); return; }
  try {
    const staffSnap = await get(dbRef(db, 'staff/' + user.uid));
    if (!staffSnap.exists()) { window.location.replace('index.html'); return; }
    const data = staffSnap.val();
    if (data.role !== 'admin') { window.location.replace('index.html'); return; }
    currentUser = { uid: user.uid, email: user.email, ...data };
    hideAuth();
    startListeners();
  } catch(e) {
    document.getElementById('auth-err').textContent = '系統錯誤：' + e.message;
    showAuth('login');
  }
});

function showAuth(s) {
  document.getElementById('auth-overlay').style.display = 'flex';
  ['login','loading','denied'].forEach(id => document.getElementById('auth-' + id).style.display = id === s ? '' : 'none');
}
function hideAuth() {
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}
window.signInGoogle = function() {
  document.getElementById('auth-err').textContent = '';
  signInWithPopup(auth, new GoogleAuthProvider())
    .catch(e => { document.getElementById('auth-err').textContent = '登入失敗：' + e.message; });
};
window.doSignOut = function() { signOut(auth).then(() => location.reload()); };

function startListeners() {
  document.getElementById('user-badge').style.display = 'flex';
  document.getElementById('user-badge').innerHTML = `
    <span>${esc(currentUser.displayName)}</span>
    <span style="font-size:11px;color:var(--dim);padding:.1rem .4rem;border:1px solid var(--border)">${ROLE_LABEL[currentUser.role]||''}</span>
    <button class="btn btn-outline btn-sm" onclick="window.location.href='index.html'" title="返回首頁" style="font-size:11px;padding:.2rem .45rem;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5 1 5.5V11h3.5V7.5h3V11H11V5.5L6 1.5Z" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/></svg></button>
    <button class="btn btn-outline btn-sm" onclick="doSignOut()">登出</button>`;

  onValue(dbRef(db, 'workflows'), snap => { workflows = snap.val() || {}; render(); });
}

function render() {
  const board = document.getElementById('board');
  const topics = Object.entries(workflows).sort((a, b) => (a[1].createdAt||'').localeCompare(b[1].createdAt||''));

  if (!topics.length) { board.innerHTML = '<div class="empty-hint" style="grid-column:1/-1">尚無主題，點右上角「＋ 新增主題」開始建立看板。</div>'; return; }

  board.innerHTML = topics.map(([topicId, topic]) => {
    const blocks = Object.entries(topic.blocks || {}).sort((a, b) => (a[1].createdAt||'').localeCompare(b[1].createdAt||''));
    const blocksHtml = blocks.length
      ? blocks.map(([blockId, b]) => `
        <div class="block">
          <div class="block-title">${esc(b.title)}</div>
          ${b.content ? `<div class="block-content">${esc(b.content)}</div>` : ''}
          <div class="block-actions">
            <button onclick="openBlockModal('${topicId}','${blockId}')">編輯</button>
            <button class="del" onclick="deleteBlock('${topicId}','${blockId}')">刪除</button>
          </div>
        </div>`).join('')
      : '';

    return `
      <div class="col">
        <div class="col-hdr">
          <div class="col-title">${esc(topic.title)}</div>
          <button class="col-del" onclick="deleteTopic('${topicId}')" title="刪除主題">&times;</button>
        </div>
        <div class="col-body">
          ${blocksHtml}
          <button class="col-add" onclick="openBlockModal('${topicId}')">＋ 新增方塊</button>
        </div>
      </div>`;
  }).join('');
}

window.openTopicModal = function() {
  document.getElementById('topic-input').value = '';
  document.getElementById('topic-modal').classList.add('show');
  document.getElementById('topic-input').focus();
};
window.closeTopicModal = function() { document.getElementById('topic-modal').classList.remove('show'); };
window.saveTopic = async function() {
  const title = document.getElementById('topic-input').value.trim();
  if (!title) return;
  const topicId = newId();
  await set(dbRef(db, `workflows/${topicId}`), {
    title, createdAt: new Date().toISOString(), createdBy: currentUser.displayName,
  });
  closeTopicModal();
};
window.deleteTopic = async function(topicId) {
  if (!confirm('確定刪除這個主題？底下的所有方塊也會一併刪除。')) return;
  await remove(dbRef(db, `workflows/${topicId}`));
};

window.openBlockModal = function(topicId, blockId) {
  editBlockTopicId = topicId; editBlockId = blockId || null;
  const existing = blockId ? (workflows[topicId]?.blocks?.[blockId]) : null;
  document.getElementById('block-modal-title').textContent = blockId ? '編輯方塊' : '新增方塊';
  document.getElementById('block-title-input').value = existing?.title || '';
  document.getElementById('block-content-input').value = existing?.content || '';
  document.getElementById('block-modal').classList.add('show');
  document.getElementById('block-title-input').focus();
};
window.closeBlockModal = function() { document.getElementById('block-modal').classList.remove('show'); };
window.saveBlock = async function() {
  const title = document.getElementById('block-title-input').value.trim();
  if (!title) return;
  const content = document.getElementById('block-content-input').value.trim();
  const blockId = editBlockId || newId();
  await set(dbRef(db, `workflows/${editBlockTopicId}/blocks/${blockId}`), {
    title, content, createdAt: workflows[editBlockTopicId]?.blocks?.[blockId]?.createdAt || new Date().toISOString(),
    createdBy: currentUser.displayName,
  });
  closeBlockModal();
};
window.deleteBlock = async function(topicId, blockId) {
  if (!confirm('確定刪除這個方塊？')) return;
  await remove(dbRef(db, `workflows/${topicId}/blocks/${blockId}`));
};
</script>
</body>
</html>
