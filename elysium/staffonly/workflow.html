<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安息地 · 工作流程</title>
  <link rel="icon" type="image/png" href="../image/Elysium_LOGO_mini_dark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --gold: #8a5c1e; --gold-dim: rgba(138,92,30,.12);

      --border: rgba(0,0,0,.1); --text: #1a1208; --dim: #7a6a52;
      --red: #b03838;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; cursor: inherit; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; cursor: url('../image/arr-cursors/arr-small-pointer.cur'), default; }
    a, button, [role="button"], select, [onclick] { cursor: url('../image/arr-cursors/arr-small-link.cur'), pointer; }

    .hdr { display: flex; align-items: center; justify-content: space-between; padding: .72rem 1.5rem; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .hdr-title { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--gold); letter-spacing: .2em; }
    .main { flex: 1; padding: 1.25rem 1.5rem 3rem; width: 100%; margin: 0 auto; display: none; }

    .toolbar { display: flex; justify-content: flex-end; margin-bottom: 1rem; }

    .btn { padding: .38rem .85rem; font-size: 12px; border: none; font-family: inherit; transition: all .15s; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-gold { background: var(--gold); color: #fdfaf5; }
    .btn-gold:hover { background: #6f4a17; }
    .btn-sm { padding: .3rem .7rem; font-size: 12px; }

    .board { display: grid; grid-template-columns: repeat(3, minmax(0,280px)); gap: 1rem; align-items: start; justify-content: center; max-width: 960px; margin: 0 auto; }
    @media (max-width: 900px) { .board { grid-template-columns: repeat(2, minmax(0,280px)); } }
    @media (max-width: 620px) { .board { grid-template-columns: minmax(0,280px); } }

    .col { background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; }
    .col-hdr { display: flex; align-items: center; gap: .3rem; padding: .75rem .85rem; border-bottom: 1px solid var(--border); }
    .col-title-input {
      flex: 1; min-width: 0; border: none; border-bottom: 1px solid transparent; background: none;
      font-family: 'Noto Serif TC', serif; font-size: .92rem; color: var(--gold); letter-spacing: .06em;
      padding: .1rem 0; outline: none;
    }
    .col-title-input:focus { border-bottom-color: var(--gold); }
    .col-del { background: none; border: none; color: var(--dim); font-size: 15px; line-height: 1; padding: .15rem; flex-shrink: 0; }
    .col-del:hover { color: var(--red); }
    .col-body { display: flex; flex-direction: column; gap: .5rem; padding: .75rem; flex: 1; min-height: 40px; }

    .block {
      background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: .55rem .65rem;
      cursor: grab; transition: background .15s, border-color .15s, box-shadow .12s;
    }
    .block:hover { background: var(--gold-dim); border-color: var(--gold); }
    .block:active { cursor: grabbing; }
    .block.drag-over-top    { box-shadow: inset 0 3px 0 var(--gold); }
    .block.drag-over-bottom { box-shadow: inset 0 -3px 0 var(--gold); }
    .block-hdr { display: flex; align-items: center; gap: .35rem; margin-bottom: .3rem; }
    .block-icon-btn {
      width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; background: var(--bg); border: 1px solid var(--border); color: var(--dim); border-radius: 4px; padding: 0;
    }
    .block-icon-btn:hover { border-color: var(--gold); }
    .block-title-input {
      flex: 1; min-width: 0; border: none; border-bottom: 1px solid transparent; background: none;
      font-size: 13px; font-weight: 500; font-family: inherit; color: var(--text); padding: .1rem 0; outline: none;
      cursor: url('../image/arr-cursors/arr-small-pointer.cur'), default;
    }
    .block-title-input:focus { border-bottom-color: var(--gold); }
    .block-del { background: none; border: none; color: var(--dim); font-size: 14px; line-height: 1; flex-shrink: 0; padding: 0 .1rem; }
    .block-del:hover { color: var(--red); }
    .block-content-input {
      display: block; width: 100%; border: none; background: none; outline: none; resize: none; overflow: hidden;
      font-family: inherit; font-size: 12.5px; color: var(--dim); line-height: 1.6; min-height: 1.4em; padding: 0;
      cursor: url('../image/arr-cursors/arr-small-pointer.cur'), default;
    }

    .col-add { background: none; border: 1px dashed var(--border); color: var(--dim); font-size: 12px; padding: .5rem; font-family: inherit; }
    .col-add:hover { border-color: var(--gold); color: var(--gold); }

    .empty-hint { font-size: 13px; color: var(--dim); padding: 1.5rem 0; text-align: center; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(20,15,8,.45); z-index: 500; align-items: center; justify-content: center; padding: 1.2rem; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--border); width: 100%; max-width: 380px; padding: 1.4rem; }
    .modal-title { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--gold); letter-spacing: .1em; margin-bottom: 1rem; }
    .modal-input { width: 100%; padding: .55rem .7rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: 13px; font-family: inherit; outline: none; margin-bottom: .8rem; }
    .modal-input:focus { border-color: var(--gold); }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; }

    .icon-popover { display: none; position: fixed; z-index: 600; background: var(--card); border: 1px solid var(--border); box-shadow: 0 4px 18px rgba(0,0,0,.18); padding: .8rem; width: 420px; }
    .icon-popover.show { display: block; }
    .icon-search-row { margin-bottom: .5rem; }
    .icon-search-row input { width: 100%; padding: .5rem .65rem; font-size: 14px; font-family: inherit; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
    .icon-search-row input:focus { border-color: var(--gold); }
    .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: .2rem; align-content: start; margin-bottom: .4rem; max-height: 340px; overflow-y: auto; }
    .icon-grid button { background: none; border: none; font-size: 24px; padding: .4rem; border-radius: 4px; line-height: 1.3; }
    .icon-grid button:hover { background: var(--gold-dim); }
    .icon-cat-label { grid-column: 1 / -1; font-size: 12px; color: var(--dim); letter-spacing: .08em; padding: .4rem .1rem .2rem; }
    .icon-jumpbar { display: flex; justify-content: space-between; padding: .4rem 0; border-top: 1px solid var(--border); margin-bottom: .4rem; }
    .icon-jumpbar button { background: none; border: none; font-size: 21px; padding: .2rem .4rem; border-radius: 4px; }
    .icon-jumpbar button:hover { background: var(--gold-dim); }
    .icon-popover-row { display: flex; gap: .35rem; padding-top: .5rem; border-top: 1px solid var(--border); }
    .icon-popover-row input { flex: 1; min-width: 0; padding: .35rem .5rem; font-size: 13px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }

    .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .auth-box { text-align: center; width: 340px; padding: 2rem; }
    .auth-logo { font-family: 'Noto Serif TC', serif; font-size: 2.2rem; color: var(--gold); letter-spacing: .25em; margin-bottom: .4rem; }
    .auth-tagline { font-size: 13px; color: var(--dim); margin-bottom: 2.5rem; letter-spacing: .08em; }
    .auth-google-btn { width: 100%; justify-content: center; display: flex; align-items: center; }
    .auth-err { color: var(--red); font-size: 13px; margin-top: .75rem; min-height: 1.2em; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-title">✦ 安息地 · 工作流程</div>
  <div style="display:flex;align-items:center;gap:.85rem">
    <div id="user-badge" style="display:none;align-items:center;gap:.5rem;font-size:12px"></div>
  </div>
</header>

<div class="main" id="main">
  <div class="toolbar">
    <button class="btn btn-gold" onclick="openTopicModal()">＋ 新增主題</button>
  </div>
  <div id="board" class="board"></div>
</div>

<div id="auth-overlay" class="auth-overlay">
  <div id="auth-loading" class="auth-box">
    <div style="color:var(--dim);font-size:15px;letter-spacing:.1em">載入中…</div>
  </div>
  <div id="auth-login" class="auth-box" style="display:none">
    <div class="auth-logo">安息地</div>
    <div class="auth-tagline">工作流程</div>
    <button class="btn btn-outline auth-google-btn" style="background:var(--gold);color:#1c1208;font-weight:600" onclick="signInGoogle()">Google 登入</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
  <div id="auth-denied" class="auth-box" style="display:none">
    <div class="auth-logo" style="font-size:1.5rem;margin-bottom:1rem">無權限</div>
    <div style="color:var(--dim);font-size:13px;line-height:1.8;margin-bottom:1rem">此頁面僅限管理員使用。</div>
    <button class="btn btn-outline" style="width:100%" onclick="doSignOut()">登出</button>
  </div>
</div>

<div id="topic-modal" class="modal-overlay" onclick="if(event.target===this) closeTopicModal()">
  <div class="modal-box">
    <div class="modal-title">新增主題</div>
    <input id="topic-input" class="modal-input" type="text" placeholder="主題名稱" maxlength="40">
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="closeTopicModal()">取消</button>
      <button class="btn btn-gold btn-sm" onclick="saveTopic()">儲存</button>
    </div>
  </div>
</div>

<div id="icon-popover" class="icon-popover">
  <div class="icon-search-row">
    <input id="icon-search-input" type="text" placeholder="搜尋（輸入英文關鍵字，如 heart, star, food）" oninput="filterEmoji(this.value)">
  </div>
  <div class="icon-grid" id="icon-grid"></div>
  <div class="icon-jumpbar" id="icon-jumpbar"></div>
  <div class="icon-popover-row">
    <input id="icon-custom-input" type="text" placeholder="貼上其他表情符號" maxlength="8">
    <button class="btn btn-gold btn-sm" onclick="applyCustomIcon()">套用</button>
  </div>
</div>

function renderEmojiGrid(filter) {
  const q = (filter||'').trim().toLowerCase();
  const grid = document.getElementById('icon-grid');
  let html = '';
  EMOJI_GROUPS.forEach((g, gi) => {
    const items = q ? g.items.filter(it => it.n.includes(q)) : g.items;
    if (!items.length) return;
    html += `<div class="icon-cat-label" id="icon-cat-${gi}">${g.label}</div>`;
    html += items.map(it => `<button title="${it.n}" onclick="pickIcon('${it.c}')">${it.c}</button>`).join('');
  });
  grid.innerHTML = html || '<div class="icon-cat-label">沒有符合的結果</div>';
}
window.filterEmoji = function(v) { renderEmojiGrid(v); };
document.getElementById('icon-jumpbar').innerHTML = EMOJI_GROUPS.map((g, gi) =>
  `<button onclick="jumpToCat(${gi})" title="${g.label}">${g.items[0]?.c || ''}</button>`).join('');
window.jumpToCat = function(gi) {
  document.getElementById('icon-search-input').value = '';
  renderEmojiGrid('');
  const el = document.getElementById('icon-cat-' + gi);
  if (el) el.scrollIntoView({ block: 'start' });
};

let currentUser = null;

onAuthStateChanged(auth, async user => {
  if (!user) { showAuth('login'); return; }
  try {
    const staffSnap = await get(dbRef(db, 'staff/' + user.uid));
    if (!staffSnap.exists()) { window.location.replace('index.html'); return; }
    const data = staffSnap.val();
    if (data.role !== 'admin') { window.location.replace('index.html'); return; }
    currentUser = { uid: user.uid, email: user.email, ...data };
    hideAuth();
    startListeners();
  } catch(e) {
    document.getElementById('auth-err').textContent = '系統錯誤：' + e.message;
    showAuth('login');
  }
});

function showAuth(s) {
  document.getElementById('auth-overlay').style.display = 'flex';
  ['login','loading','denied'].forEach(id => document.getElementById('auth-' + id).style.display = id === s ? '' : 'none');
}
function hideAuth() {
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}
window.signInGoogle = function() {
  document.getElementById('auth-err').textContent = '';
  signInWithPopup(auth, new GoogleAuthProvider())
    .catch(e => { document.getElementById('auth-err').textContent = '登入失敗：' + e.message; });
};
window.doSignOut = function() { signOut(auth).then(() => location.reload()); };

function startListeners() {
  document.getElementById('user-badge').style.display = 'flex';
  document.getElementById('user-badge').innerHTML = `
    <span>${esc(currentUser.displayName)}</span>
    <span style="font-size:11px;color:var(--dim);padding:.1rem .4rem;border:1px solid var(--border)">${ROLE_LABEL[currentUser.role]||''}</span>
    <button class="btn btn-outline btn-sm" onclick="window.location.href='index.html'" title="返回首頁" style="font-size:11px;padding:.2rem .45rem;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5 1 5.5V11h3.5V7.5h3V11H11V5.5L6 1.5Z" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/></svg></button>

// ── 排序輔助 ──
function getSortedBlockIds(topicId) {
  const blocks = workflows[topicId]?.blocks || {};
  return Object.entries(blocks)
    .sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0) || (a[1].createdAt||'').localeCompare(b[1].createdAt||''))
    .map(([id]) => id);
}

function isEditingFocused() {
  const el = document.activeElement;
  return !!el && (el.classList.contains('block-title-input') || el.classList.contains('block-content-input') || el.classList.contains('col-title-input'));
}

function render() {
  if (isEditingFocused()) { renderPending = true; return; }
  renderPending = false;

  const board = document.getElementById('board');

          </div>
          <textarea class="block-content-input" placeholder="內文" rows="1"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';"
            onblur="saveBlockField('${topicId}','${blockId}','content', this.value.trim())">${esc(b.content)}</textarea>
        </div>`;
    }).join('');

    return `
      <div class="col">
        <div class="col-hdr">
          <input class="col-title-input" value="${esc(topic.title)}" placeholder="主題名稱"
            onblur="saveTopicTitle('${topicId}', this.value.trim())"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">
          <button class="col-del" onclick="deleteTopic('${topicId}')" title="刪除主題">&times;</button>
        </div>
        <div class="col-body" ondragover="event.preventDefault();" ondrop="onColumnDrop(event,'${topicId}',null)">
          ${blocksHtml}
          <button class="col-add" onclick="addBlock('${topicId}')">＋ 新增方塊</button>
        </div>
      </div>`;
  }).join('');

  board.querySelectorAll('.block-content-input').forEach(el => { el.style.height = el.scrollHeight + 'px'; });

  if (pendingFocusBlockId) {
    const input = board.querySelector(`.block-title-input[data-block-id="${pendingFocusBlockId}"]`);
    if (input) input.focus();
    pendingFocusBlockId = null;
  }
}

function afterWrite() { if (renderPending) render(); }

// ── 主題 ──
window.openTopicModal = function() {
  document.getElementById('topic-input').value = '';
  document.getElementById('topic-modal').classList.add('show');
  document.getElementById('topic-input').focus();
};
window.closeTopicModal = function() { document.getElementById('topic-modal').classList.remove('show'); };
window.saveTopic = async function() {
  const title = document.getElementById('topic-input').value.trim();
  if (!title) return;
  const topicId = newId();
  await set(dbRef(db, `workflows/${topicId}`), {
    title, createdAt: new Date().toISOString(), createdBy: currentUser.displayName,
  });
  closeTopicModal();
};
window.deleteTopic = async function(topicId) {
  if (!confirm('確定刪除這個主題？底下的所有方塊也會一併刪除。')) return;
  await remove(dbRef(db, `workflows/${topicId}`));
};
window.saveTopicTitle = async function(topicId, title) {
  if (!workflows[topicId] || !title) return;
  await update(dbRef(db, `workflows/${topicId}`), { title });
  afterWrite();
};

// ── 方塊：就地編輯 ──
window.addBlock = async function(topicId) {
  const blockId = newId();
  const order = getSortedBlockIds(topicId).length;
  await set(dbRef(db, `workflows/${topicId}/blocks/${blockId}`), {
    title: '', content: '', icon: '', order,
    createdAt: new Date().toISOString(), createdBy: currentUser.displayName,
  });
  pendingFocusBlockId = blockId;
};
window.saveBlockField = async function(topicId, blockId, field, value) {
  if (!workflows[topicId]?.blocks?.[blockId]) return;
  await update(dbRef(db, `workflows/${topicId}/blocks/${blockId}`), { [field]: value });
  afterWrite();
};
window.deleteBlock = async function(topicId, blockId) {
  if (!confirm('確定刪除這個方塊？')) return;
  await remove(dbRef(db, `workflows/${topicId}/blocks/${blockId}`));
};

// ── 方塊：拖曳排序／搬移 ──
window.onBlockDragStart = function(e, topicId, blockId) {
  dragState = { topicId, blockId };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', blockId);
};
window.onBlockDragOver = function(e, el) {
  e.preventDefault(); e.stopPropagation();
  const rect = el.getBoundingClientRect();
  const isTop = (e.clientY - rect.top) < rect.height / 2;
  el.classList.toggle('drag-over-top', isTop);
  el.classList.toggle('drag-over-bottom', !isTop);
};
window.onBlockDragLeave = function(e, el) {
  el.classList.remove('drag-over-top', 'drag-over-bottom');
};
window.onBlockDrop = async function(e, el, toTopicId) {
  e.preventDefault(); e.stopPropagation();
  const isTop = el.classList.contains('drag-over-top');
  el.classList.remove('drag-over-top', 'drag-over-bottom');
  if (!dragState) return;
  const { topicId: fromTopicId, blockId } = dragState;
  dragState = null;
  if (blockId === el.dataset.blockId) return;
  let beforeBlockId;
  if (isTop) {
    beforeBlockId = el.dataset.blockId;
  } else {
    const next = el.nextElementSibling;
    beforeBlockId = (next && next.classList.contains('block')) ? next.dataset.blockId : null;
  }
  await moveBlock(fromTopicId, blockId, toTopicId, beforeBlockId);
};
window.onColumnDrop = async function(e, toTopicId, beforeBlockId) {
  e.preventDefault();
  if (!dragState) return;
  const { topicId: fromTopicId, blockId } = dragState;
  dragState = null;
  if (blockId === beforeBlockId) return;
  await moveBlock(fromTopicId, blockId, toTopicId, beforeBlockId);
};
async function moveBlock(fromTopicId, blockId, toTopicId, beforeBlockId) {
  const blockData = workflows[fromTopicId]?.blocks?.[blockId];
  if (!blockData) return;

  const fromList = getSortedBlockIds(fromTopicId).filter(id => id !== blockId);
  const toList   = fromTopicId === toTopicId ? fromList.slice() : getSortedBlockIds(toTopicId);
  let insertAt = beforeBlockId ? toList.indexOf(beforeBlockId) : -1;
  if (insertAt === -1) insertAt = toList.length;
  toList.splice(insertAt, 0, blockId);

  const updates = {};
  if (fromTopicId !== toTopicId) {
    updates[`workflows/${fromTopicId}/blocks/${blockId}`] = null;
    fromList.forEach((id, idx) => { updates[`workflows/${fromTopicId}/blocks/${id}/order`] = idx; });
    toList.forEach((id, idx) => {
      updates[id === blockId ? `workflows/${toTopicId}/blocks/${id}` : `workflows/${toTopicId}/blocks/${id}/order`]
        = id === blockId ? { ...blockData, order: idx } : idx;
    });
  } else {
    toList.forEach((id, idx) => { updates[`workflows/${toTopicId}/blocks/${id}/order`] = idx; });
  }
  await update(dbRef(db), updates);
}

// ── 方塊：表情符號圖示 ──
window.openIconPicker = function(e, topicId, blockId) {
  e.stopPropagation();
  iconTarget = { topicId, blockId };
  const pop = document.getElementById('icon-popover');
  const rect = e.currentTarget.getBoundingClientRect();
  const top  = Math.min(rect.bottom + 6, window.innerHeight - 540);
  const left = Math.min(rect.left, window.innerWidth - 436);
  pop.style.top = top + 'px'; pop.style.left = left + 'px';
  document.getElementById('icon-custom-input').value = '';
  document.getElementById('icon-search-input').value = '';
  renderEmojiGrid('');
  pop.classList.add('show');
};
window.pickIcon = async function(icon) {
  if (!iconTarget) return;
  const { topicId, blockId } = iconTarget;
  closeIconPicker();
  await update(dbRef(db, `workflows/${topicId}/blocks/${blockId}`), { icon });
  afterWrite();
};
window.applyCustomIcon = function() {
  const v = document.getElementById('icon-custom-input').value.trim();
  if (v) pickIcon(v);
};
window.closeIconPicker = function() {
  document.getElementById('icon-popover').classList.remove('show');
  iconTarget = null;
};
document.addEventListener('click', e => {
  const pop = document.getElementById('icon-popover');
  if (pop.classList.contains('show') && !pop.contains(e.target) && !e.target.classList.contains('block-icon-btn')) {
    closeIconPicker();
  }
});
</script>
