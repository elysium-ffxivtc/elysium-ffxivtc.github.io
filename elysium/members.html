<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="image/Elysium_LOGO_mini.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    .modal-subtitle      { font-size: .82rem; }
    .modal-bio           { font-size: .9rem; }
    .modal-section-label { font-size: 1.1rem; }
    .modal-section-val   { font-size: .86rem; }

    /* ── 司祭 speech bubble ── */
    .modal-img-wrap { position: relative; }
    #sj-head-trigger {
      position: absolute;
      top: 7%; left: 19%;
      width: 48%; height: 28%;
      z-index: 5;
      cursor: url('image/arr-cursors/arr-small-pointer.cur'), default;
    }
    .sj-bubble {
      position: absolute;
      top: 5.5%; left: 32%;
      background: #fff;
      border-radius: 20px;
      padding: 11px 17px;
      display: flex; align-items: flex-end; gap: 4px;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,.14));
      opacity: 0;
      transform: scale(.82) translateY(-5px);
      transform-origin: bottom left;
      transition: opacity .3s ease, transform .3s ease;
      pointer-events: none;
      z-index: 50;
    }
    .sj-bubble::before {
      content: '';
      position: absolute;
      bottom: -8px; left: 14px;
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 8px solid #fff;
    }
    .sj-bubble.active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .sj-dot {
      width: 5px; height: 5px;
      background: #1a1a1a;
      border-radius: 50%;
      opacity: 0;
    }
    .sj-bubble.active .sj-dot:nth-child(1) { animation: sj-dot-1 5s ease-in-out infinite; }
    .sj-bubble.active .sj-dot:nth-child(2) { animation: sj-dot-2 5s ease-in-out infinite; }
    .sj-bubble.active .sj-dot:nth-child(3) { animation: sj-dot-3 5s ease-in-out infinite; }
    /* dot 1: appears first */
    @keyframes sj-dot-1 {
      0%        { opacity: 0; }
      10%       { opacity: 1; }
      72%       { opacity: 1; }
      84%       { opacity: 0; }
      100%      { opacity: 0; }
    }
    /* dot 2: appears 0.8s later */
    @keyframes sj-dot-2 {
      0%, 16%   { opacity: 0; }
      26%       { opacity: 1; }
      72%       { opacity: 1; }
      84%       { opacity: 0; }
      100%      { opacity: 0; }
    }
    /* dot 3: appears 1.6s later */
    @keyframes sj-dot-3 {
      0%, 32%   { opacity: 0; }
      42%       { opacity: 1; }
      72%       { opacity: 1; }
      84%       { opacity: 0; }
      100%      { opacity: 0; }
    }
    @media (max-width: 768px) {
      #sj-head-trigger, .sj-bubble { display: none; }
    }

    /* ── 圖片 lightbox ── */
    #img-lightbox {
      display: none; position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.88);
      align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    #img-lightbox.is-open { display: flex; }
    #img-lightbox img {
      max-width: 96vw; max-height: 92vh;
      object-fit: contain;
      border-radius: 2px;
      pointer-events: none;
    }
    .modal-img-wrap img { cursor: zoom-in; }
    .modal-img-btn {
      position: absolute; bottom: .7rem; right: .7rem; z-index: 10;
      width: 34px; height: 34px;
      background: rgba(184,144,96,.28); backdrop-filter: blur(6px);
      border: 1px solid rgba(184,144,96,.55); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      transition: background .25s, border-color .25s;
    }
    .modal-img-btn:hover { background: rgba(184,144,96,.5); border-color: rgba(184,144,96,.85); }
    .modal-img-btn svg { width: 14px; height: 14px; stroke: rgba(184,144,96,1); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo"><img src="image/Elysium_LOGO.png" alt="Elysium" class="nav-logo-img"></a>
    <button class="nav-burger" id="nav-burger" aria-label="選單">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="members.html" class="active">Members</a></li>
      <li class="dropdown">
        <span>Services</span>
        <div class="dropdown-menu">
          <a href="nomen.html">Nomen</a>
          <a href="menu.html">Menu</a>
        </div>
      </li>
      <li><span class="hidden-link">Registry</span></li>
      <li><a href="rules.html">Rules</a></li>
      <li><span class="hidden-link">S⏹︎⏹︎RI⏹︎S</span></li>
    </ul>
  </nav>

  <!-- 使徒 -->
  <section class="members-section bg-muted pt-nav ms-apostles">
    <div class="members-section-inner">
      <div class="members-section-head">
        <h2>使徒</h2>
        <hr class="members-rule">
      </div>
      <div class="member-grid-5" id="apostle-grid"></div>
    </div>
  </section>

  <!-- 侍者 -->
  <section class="members-section ms-attendants">
    <div class="members-section-inner">
      <div class="members-section-head">
        <h2>侍者</h2>
        <hr class="members-rule">
      </div>
      <div class="member-grid-3" id="attendant-grid"></div>
    </div>
  </section>

  <!-- 特別銘謝 -->
  <section class="members-section bg-muted ms-thanks">
    <div class="members-section-inner">
      <div class="wide-divider"></div>
      <div class="thanks-section">
        <span class="section-tag">Special Thanks &nbsp;/&nbsp; 特別銘謝</span>
        <ul class="thanks-list">
          <li>更年期冬貝利@伊弗利特</li>
          <li>路易丁滿@伊弗利特</li>
          <li>夜遊魂@伊弗利特</li>
        </ul>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-social">
      <span class="footer-social-link"><img src="image/discord_.png" alt="Discord" class="footer-icon"></span>
      <a href="https://www.threads.com/@elysium.ffxivtc" target="_blank" rel="noopener" class="footer-social-link" aria-label="Threads">
        <img src="image/threads_.png" alt="Threads" class="footer-icon">
      </a>
    </div>
    <p class="footer-copy">&copy; 2026 Elysium. All rights reserved.</p>
  </footer>

  <div id="modals-root"></div>

  <div id="img-lightbox" onclick="closeLightbox()">
    <img id="img-lightbox-img" src="" alt="">
  </div>

  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyCZkdAeMKUWXQPXFptw3t4dYVOBAo7lF5Q",
      authDomain:        "elysiumpos.firebaseapp.com",
      databaseURL:       "https://elysiumpos-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:         "elysiumpos",
      storageBucket:     "elysiumpos.firebasestorage.app",
      messagingSenderId: "430177597593",
      appId:             "1:430177597593:web:7598eaf6e5e6264dc82008"
    });
    const db = firebase.database();

    var sjBubble = null;
    var sjModalId = null;

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escBr(s) { return esc(s).replace(/\n/g, '<br>'); }
    function thumbOf(photo) { return String(photo||'').replace(/(\.[a-zA-Z0-9]+)$/, '_頭像$1'); }

    function openModal(id) {
      document.getElementById(id).classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal(e, id) {
      if (e && e.target !== document.getElementById(id)) return;
      document.getElementById(id).classList.remove('is-open');
      document.body.style.overflow = '';
      if (id === sjModalId && sjBubble) sjBubble.classList.remove('active');
    }
    function openLightbox(src) {
      document.getElementById('img-lightbox-img').src = src;
      document.getElementById('img-lightbox').classList.add('is-open');
    }
    function closeLightbox() {
      document.getElementById('img-lightbox').classList.remove('is-open');
      document.getElementById('img-lightbox-img').src = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (document.getElementById('img-lightbox').classList.contains('is-open')) { closeLightbox(); return; }
        document.querySelectorAll('.modal-overlay.is-open').forEach(function(m) {
          m.classList.remove('is-open');
          document.body.style.overflow = '';
        });
        if (sjBubble) sjBubble.classList.remove('active');
      }
    });

    function cardHtml(modalId, photo, tag, thumbAlt, isFog, fogImg) {
      if (isFog) {
        return `<div class="member-card fog"><div class="member-img-wrap"><img src="${fogImg}" alt="${esc(thumbAlt)}"></div></div>`;
      }
      return `
        <div class="member-card" onclick="openModal('${modalId}')">
          <div class="member-img-wrap">
            <img src="${esc(thumbOf(photo))}" alt="${esc(thumbAlt)}">
            <div class="member-img-hover">${esc(thumbAlt)}</div>
          </div>
        </div>`;
    }

    function modalHtml(modalId, a, roleLabel, subtitle, extraBubble) {
      const business = a.business ? escBr(a.business) : '暫不提供';
      return `
        <div class="modal-overlay" id="${modalId}" onclick="closeModal(event, '${modalId}')">
          <div class="modal-box">
            <button class="modal-close" onclick="closeModal(null, '${modalId}')">&times;</button>
            <div class="modal-inner">
              <div class="modal-img-wrap">
                <img src="${esc(a.photo||'')}" alt="${esc(roleLabel)}" onclick="openLightbox(this.src)">
                ${extraBubble ? `<div id="sj-head-trigger"></div>` : ''}
                <button class="modal-img-btn" onclick="openLightbox(this.closest('.modal-img-wrap').querySelector('img').src)" aria-label="查看大圖"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2h4v4M6 14H2v-4M14 10v4h-4M2 6V2h4"/></svg></button>
              </div>
              <div class="modal-content">
                <span class="modal-role">${esc(roleLabel)}</span>
                <h2 class="modal-name">${esc(a.name||'')}</h2>
                <p class="modal-subtitle">${subtitle ? esc(subtitle) : '&nbsp;'}</p>
                <div class="modal-divider"></div>
                <p class="modal-bio">${escBr(a.bio)}</p>
                <div class="modal-section">
                  <div style="margin-bottom:.9rem;">
                    <p class="modal-section-label">聊天尺度</p>
                    <p class="modal-section-val">${escBr(a.chat)}</p>
                  </div>
                  <div style="margin-bottom:.9rem;">
                    <p class="modal-section-label">禁忌與偏好</p>
                    <p class="modal-section-val">${escBr(a.taboo)}</p>
                  </div>
                  <div style="margin-bottom:.9rem;">
                    <p class="modal-section-label">延伸資訊</p>
                    <p class="modal-section-val">${escBr(a.extra)}</p>
                  </div>
                  <div>
                    <p class="modal-section-label">個人業務</p>
                    <p class="modal-section-val">${business}</p>
                  </div>
                </div>
              </div>
            </div>
            ${extraBubble ? `
            <div id="sj-bubble" class="sj-bubble">
              <span class="sj-dot"></span>
              <span class="sj-dot"></span>
              <span class="sj-dot"></span>
            </div>` : ''}
          </div>
        </div>`;
    }

    db.ref('apostles').get().then(function(snap) {
      const all = Object.entries(snap.val() || {})
        .map(function(e) { return { uid: e[0], ...e[1] }; })
        .filter(function(a) { return a.active !== false; })
        .sort(function(x, y) { return (x.order||0) - (y.order||0); });

      const byTag = {};
      all.forEach(function(a) { (byTag[a.tag] = byTag[a.tag] || []).push(a); });

      const modals = [];

      // ── 使徒：食罪 / 妖異，各補到 5 格，subtitle 一律「尚未揭示」 ──
      const apostleGroups = [
        { tag: '食罪', fog: 'image/食罪.jpg' },
        { tag: '妖異', fog: 'image/妖異.jpg' },
      ];
      document.getElementById('apostle-grid').innerHTML = apostleGroups.map(function(g) {
        const list = byTag[g.tag] || [];
        const cards = list.map(function(a) {
          const modalId = 'modal-' + a.uid;
          modals.push(modalHtml(modalId, a, g.tag, '尚未揭示', false));
          return cardHtml(modalId, a.photo, g.tag, g.tag, false);
        });
        const pad = Math.max(0, 5 - cards.length);
        for (let i = 0; i < pad; i++) cards.push(cardHtml(null, null, g.tag, g.tag, true, g.fog));
        return `<div class="apostle-group">${cards.join('')}</div>`;
      }).join('');

      // ── 侍者：司祭・監禮者（依序命名）、銀紗使、引路人（補到 3 格） ──
      const clergy = (byTag['司祭・監禮者'] || []);
      const clergyLabels = ['司祭', '監禮者'];
      const clergyCards = clergy.map(function(a, i) {
        const roleLabel = clergyLabels[i] || '司祭・監禮者';
        const modalId = 'modal-' + a.uid;
        const isChief = a.name === '靜火';
        if (isChief) sjModalId = modalId;
        modals.push(modalHtml(modalId, a, roleLabel, a.subtitle, isChief));
        return cardHtml(modalId, a.photo, roleLabel, roleLabel, false);
      });

      const silk = (byTag['銀紗使'] || []);
      const silkCards = silk.map(function(a) {
        const modalId = 'modal-' + a.uid;
        modals.push(modalHtml(modalId, a, '銀紗使', a.subtitle, false));
        return cardHtml(modalId, a.photo, '銀紗使', '銀紗使', false);
      });

      const pilgrims = (byTag['引路人'] || []);
      const pilgrimCards = pilgrims.map(function(a) {
        const modalId = 'modal-' + a.uid;
        modals.push(modalHtml(modalId, a, '引路人', a.subtitle, false));
        return cardHtml(modalId, a.photo, '引路人', '引路人', false);
      });
      const pilgrimPad = Math.max(0, 3 - pilgrimCards.length);
      for (let i = 0; i < pilgrimPad; i++) pilgrimCards.push(cardHtml(null, null, '引路人', '引路人', true, 'image/引路人.jpg'));

      document.getElementById('attendant-grid').innerHTML =
        clergyCards.join('') + silkCards.join('') + pilgrimCards.join('');

      document.getElementById('modals-root').innerHTML = modals.join('');

      sjBubble = document.getElementById('sj-bubble');
      const sjTrigger = document.getElementById('sj-head-trigger');
      if (sjTrigger && sjBubble) {
        sjTrigger.addEventListener('mouseenter', function() { sjBubble.classList.add('active'); });
        sjTrigger.addEventListener('mouseleave', function() { sjBubble.classList.remove('active'); });
      }
    }).catch(function(e) { console.error('無法載入成員資料', e); });
  </script>

  <script src="nav.js"></script>
</body>
</html>
