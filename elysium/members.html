<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members ✦ Elysium</title>
  <link rel="icon" type="image/png" href="image/Elysium_LOGO_mini.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    .modal-subtitle      { font-size: .82rem; }
    .modal-bio           { font-size: .9rem; }
    .modal-section-label { font-size: 1.1rem; }
    .modal-section-val   { font-size: .86rem; }

    /* ── 司祭 speech bubble ── */
    .modal-img-wrap { position: relative; }
    #sj-head-trigger {
      position: absolute;
      top: 7%; left: 19%;
      width: 48%; height: 28%;
      z-index: 5;
      cursor: url('image/arr-cursors/arr-small-pointer.cur'), default;
    }
    .sj-bubble {
      position: absolute;
      top: 5.5%; left: 32%;
      background: #fff;
      border-radius: 20px;
      padding: 11px 17px;
      display: flex; align-items: flex-end; gap: 4px;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,.14));
      opacity: 0;
      transform: scale(.82) translateY(-5px);
      transform-origin: bottom left;
      transition: opacity .3s ease, transform .3s ease;
      pointer-events: none;
      z-index: 50;
    }
    .sj-bubble::before {
      content: '';
      position: absolute;
      bottom: -8px; left: 14px;
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 8px solid #fff;
    }
    .sj-bubble.active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .sj-dot {
      width: 5px; height: 5px;
      background: #1a1a1a;
      border-radius: 50%;
      opacity: 0;
    }
    .sj-bubble.active .sj-dot:nth-child(1) { animation: sj-dot-1 5s ease-in-out infinite; }
    .sj-bubble.active .sj-dot:nth-child(2) { animation: sj-dot-2 5s ease-in-out infinite; }
    .sj-bubble.active .sj-dot:nth-child(3) { animation: sj-dot-3 5s ease-in-out infinite; }
    /* dot 1: appears first */
    @keyframes sj-dot-1 {
      0%        { opacity: 0; }
      10%       { opacity: 1; }
      72%       { opacity: 1; }
      84%       { opacity: 0; }
      100%      { opacity: 0; }
    }
    /* dot 2: appears 0.8s later */
    @keyframes sj-dot-2 {
      0%, 16%   { opacity: 0; }
      26%       { opacity: 1; }
      72%       { opacity: 1; }
      84%       { opacity: 0; }
      100%      { opacity: 0; }
    }
    /* dot 3: appears 1.6s later */
    @keyframes sj-dot-3 {
      0%, 32%   { opacity: 0; }
      42%       { opacity: 1; }
      72%       { opacity: 1; }
      84%       { opacity: 0; }
      100%      { opacity: 0; }
    }
    @media (max-width: 768px) {
      #sj-head-trigger, .sj-bubble { display: none; }
    }

    /* ── 圖片 lightbox ── */
    #img-lightbox {
      display: none; position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.88);
      align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    #img-lightbox.is-open { display: flex; }
    #img-lightbox img {
      max-width: 96vw; max-height: 92vh;
      object-fit: contain;
      border-radius: 2px;
      pointer-events: none;
    }
    .modal-img-wrap img { cursor: zoom-in; }
    .modal-img-btn {
      position: absolute; bottom: .7rem; right: .7rem; z-index: 10;
      width: 34px; height: 34px;
      background: rgba(184,144,96,.28); backdrop-filter: blur(6px);
      border: 1px solid rgba(184,144,96,.55); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      transition: background .25s, border-color .25s;
    }
    .modal-img-btn:hover { background: rgba(184,144,96,.5); border-color: rgba(184,144,96,.85); }
    .modal-img-btn svg { width: 14px; height: 14px; stroke: rgba(184,144,96,1); }

    /* ── Members 分割排版：左名冊 / 右介紹頁，整頁呈現、不裝框 ── */
    .ms-page-section { padding-top: 90px; position: relative; background: var(--bg); }
    @media (max-width: 768px) { .ms-page-section { padding-top: 60px; } }
    .ms-split {
      display: grid; grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 90px);
    }
    @media (max-width: 768px) { .ms-split { min-height: 0; } }
    .ms-roster, .ms-detail { position: relative; }
    .ms-detail { scrollbar-width: none; -ms-overflow-style: none; }
    .ms-detail::-webkit-scrollbar { display: none; }
    .ms-roster {
      padding: 1.8rem 1.4rem 2rem max(4rem, calc((100vw - 1156px) / 2 + 4rem));
    }
    .ms-group { margin-bottom: 1.8rem; }
    .ms-group:last-child { margin-bottom: 0; }
    .ms-tiles { display: grid; grid-template-columns: repeat(6, 78px); gap: .5rem .4rem; }
    .ms-tile {
      position: relative; aspect-ratio: 1.4 / 3.4; cursor: pointer;
      clip-path: polygon(0% 15%, 100% 0%, 100% 85%, 0% 100%);
      background: #cfc7b3; perspective: 450px;
      animation: msTileDrop .6s cubic-bezier(.16,1,.3,1) both;
    }
    .ms-tile.no-drop { animation: none; }
    @keyframes msTileDrop {
      0%   { opacity: 0; transform: translateY(-36px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ms-tile { animation: none; }
    }
    .ms-tile img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .ms-tile.fog img { filter: brightness(.88) grayscale(.1); }
    .ms-tile::before {
      content: ''; position: absolute; inset: 0; z-index: 2;
      clip-path: polygon(0% 15%, 100% 0%, 100% 85%, 0% 100%);
      background: rgba(255,255,255,.55); opacity: 0; pointer-events: none;
    }
    .ms-tile.fog::before { opacity: 1; background: rgba(239,239,239,.82); }
    .ms-tile.show::before { animation: msVeilIn .4s ease forwards; }
    .ms-tile.leaving::before { animation: msVeilOut .9s ease forwards; }
    @keyframes msVeilIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes msVeilOut { 0%, 50% { opacity: 1; } 100% { opacity: 0; } }
    .ms-tile.sel::after {
      content: ''; position: absolute; inset: 0; z-index: 2;
      clip-path: polygon(0% 15%, 100% 0%, 100% 85%, 0% 100%);
      border: 2px solid var(--gold); pointer-events: none;
    }
    .ms-tile-tag {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      writing-mode: vertical-rl; text-orientation: upright;
      font-family: 'Noto Serif TC', serif; font-size: 1rem; letter-spacing: .15em; color: var(--text);
      opacity: 0; pointer-events: none;
    }
    .ms-tile.show .ms-tile-tag { animation: msTagIn .8s ease forwards; }
    .ms-tile.leaving .ms-tile-tag { animation: msTagOut .45s ease forwards; }
    @keyframes msTagIn {
      0%   { opacity: 0; transform: rotateY(-90deg) scale(.8); clip-path: inset(0 0 0 0); }
      100% { opacity: 1; transform: rotateY(0deg) scale(1);   clip-path: inset(0 0 0 0); }
    }
    @keyframes msTagOut {
      0%   { opacity: 1; transform: rotateY(0deg) scale(1); clip-path: inset(0 0 0 0); }
      100% { opacity: 0; transform: rotateY(0deg) scale(1); clip-path: inset(50% 0 50% 0); }
    }

    .ms-detail {
      position: sticky; top: 90px;
      overflow-y: auto; height: calc(100vh - 90px);
      padding: 2.4rem max(4rem, calc((100vw - 1156px) / 2 + 4rem)) 2.4rem 1.6rem;
    }
    .ms-detail::before {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 60%; z-index: 0;
      background-image: var(--ms-photo); background-size: cover; background-repeat: no-repeat; background-position: right top;
      -webkit-mask-image: radial-gradient(ellipse 80% 75% at 84% 24%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.25) 50%, rgba(0,0,0,.08) 80%, transparent 100%);
      mask-image: radial-gradient(ellipse 80% 75% at 84% 24%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.25) 50%, rgba(0,0,0,.08) 80%, transparent 100%);
      pointer-events: none;
      opacity: 0;
    }
    .ms-detail.photo-in::before { animation: msPhotoIn .7s ease forwards; }
    @keyframes msPhotoIn {
      0%   { opacity: 0; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ms-detail::before { opacity: 1; }
      .ms-detail.photo-in::before { animation: none; }
    }
    .ms-detail-inner {
      position: relative; z-index: 1; max-width: 560px;
      animation: msDetailIn .5s ease both;
    }
    @keyframes msDetailIn {
      0%   { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ms-detail-inner { animation: none; }
    }
    .ms-empty {
      position: relative; z-index: 1; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      user-select: none; -webkit-user-select: none; -moz-user-select: none;
    }
    .ms-empty-rule { color: var(--gold); opacity: .7; letter-spacing: 1em; margin-bottom: 1.2rem; }
    .ms-empty-text { font-family: 'Noto Serif TC', serif; font-size: .95rem; letter-spacing: .15em; color: var(--dim); }
    .ms-empty-text span { display: inline-block; opacity: 0; animation: msCharIn .6s ease forwards; }
    @keyframes msCharIn {
      0%   { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ms-empty-text span { animation: none; opacity: 1; }
    }
    .ms-detail-top { margin-bottom: .6rem; }
    .ms-view-tag {
      display: inline-flex; align-items: center; gap: .25rem;
      font-size: .58rem; letter-spacing: .04em; color: var(--gold);
      background: rgba(184,144,96,.12); border: 1px solid rgba(184,144,96,.4);
      border-radius: 3px; padding: .12rem .4rem; margin-top: 1.3rem;
      cursor: pointer; transition: background .2s, border-color .2s;
    }
    .ms-view-tag:hover { background: rgba(184,144,96,.22); border-color: rgba(184,144,96,.65); }
    .ms-view-tag svg { width: 8px; height: 8px; stroke: var(--gold); }
    .ms-role { font-family: 'Noto Serif TC', serif; font-size: .78rem; letter-spacing: .3em; color: var(--gold); }
    .ms-name { font-family: 'Noto Serif TC', serif; font-size: 1.7rem; font-weight: 700; color: var(--text); margin: 0 0 -.3rem; }
    .ms-subtitle { font-size: .88rem; color: var(--dim); }
    .ms-divider { width: 100%; height: 1px; background: rgba(0,0,0,.1); margin: .5rem 0 1.4rem; }
    .ms-bio { font-size: .96rem; color: var(--text); line-height: 1.9; margin-bottom: 1.6rem; }
    .ms-section2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 2rem; margin-top: 1.6rem; }
    .ms-sec-label {
      font-family: 'Noto Serif TC', serif; font-size: .95rem; letter-spacing: .15em; color: var(--gold);
      margin-bottom: .5rem; padding-bottom: .35rem; border-bottom: 1px solid rgba(184,144,96,.35);
    }
    .ms-sec-val { font-size: .88rem; color: #666; line-height: 1.7; }

    #ms-sj-head-trigger {
      position: absolute; z-index: 5;
      top: 6%; left: 58%; width: 26%; height: 20%;
      cursor: url('image/arr-cursors/arr-small-pointer.cur'), default;
    }

    @media (max-width: 768px) {
      .ms-split { grid-template-columns: 1fr; }
      .ms-detail { position: relative; height: auto; scroll-margin-top: 60px; }
      .ms-tiles { grid-template-columns: repeat(6, 1fr); }
      .ms-roster { padding-left: 1.4rem; }
      .ms-detail { padding-right: 1.4rem; }
      .ms-detail::before {
        background-position: center top;
        -webkit-mask-image: radial-gradient(ellipse 95% 90% at 60% 20%, rgba(0,0,0,.6) 0%, rgba(0,0,0,.3) 60%, rgba(0,0,0,.1) 85%, transparent 100%);
        mask-image: radial-gradient(ellipse 95% 90% at 60% 20%, rgba(0,0,0,.6) 0%, rgba(0,0,0,.3) 60%, rgba(0,0,0,.1) 85%, transparent 100%);
      }
    }
  </style>
</head>

  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyCZkdAeMKUWXQPXFptw3t4dYVOBAo7lF5Q",
      authDomain:        "elysiumpos.firebaseapp.com",
      databaseURL:       "https://elysiumpos-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:         "elysiumpos",
      storageBucket:     "elysiumpos.firebasestorage.app",
      messagingSenderId: "430177597593",
      appId:             "1:430177597593:web:7598eaf6e5e6264dc82008"
    });
    const db = firebase.database();

    var sjBubble = null;
    var PEOPLE = [];
    var selectedKey = null;

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escBr(s) { return esc(s).replace(/\n/g, '<br>'); }
    function thumbOf(photo) { return String(photo||'').replace(/(\.[a-zA-Z0-9]+)$/, '_二版頭像$1'); }

    function openLightbox(src) {
      document.getElementById('img-lightbox-img').src = src;
      document.getElementById('img-lightbox').classList.add('is-open');
    }
    function closeLightbox() {
      document.getElementById('img-lightbox').classList.remove('is-open');
      document.getElementById('img-lightbox-img').src = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.getElementById('img-lightbox').classList.contains('is-open')) closeLightbox();
    });

    const GROUPS = [['食罪', 5], ['妖異', 5], ['幹部', null], ['引路人', 3]];
    const FOG_SRC = { '食罪': 'image/食罪.jpg', '妖異': 'image/妖異.jpg', '引路人': 'image/引路人.jpg' };

    let rosterAnimated = false;

    function tileHtml(p, idx) {
      const sel = p.key === selectedKey ? ' sel' : '';
      const cls = rosterAnimated ? ' no-drop' : '';
      const style = rosterAnimated ? '' : ` style="animation-delay:${(idx * 0.045).toFixed(3)}s"`;
      return `<div class="ms-tile${sel}${cls}"${style} onclick="selectPerson('${p.key}')">
        <img src="${esc(thumbOf(p.photo))}" alt="${esc(p.name)}">
        <div class="ms-tile-tag">${esc(p.roleLabel)}</div>
      </div>`;
    }
    function fogTileHtml(group, idx) {
      const cls = rosterAnimated ? ' no-drop' : '';
      const style = rosterAnimated ? '' : ` style="animation-delay:${(idx * 0.045).toFixed(3)}s"`;
      return `<div class="ms-tile fog${cls}"${style}><img src="${FOG_SRC[group]}" alt="${esc(group)}"></div>`;
    }

    function renderRoster() {
      const byGroup = {};
      PEOPLE.forEach(function(p) { (byGroup[p.group] = byGroup[p.group] || []).push(p); });
      let idx = 0;
      document.getElementById('ms-roster').innerHTML = GROUPS.map(function(gr) {
        const label = gr[0], quota = gr[1];
        const list = byGroup[label] || [];
        let tiles = list.map(function(p) { return tileHtml(p, idx++); });
        if (quota) {
          const pad = Math.max(0, quota - list.length);
          for (let i = 0; i < pad; i++) tiles.push(fogTileHtml(label, idx++));
        }
        return `<div class="ms-group"><div class="ms-tiles">${tiles.join('')}</div></div>`;
      }).join('');
      rosterAnimated = true;
    }

    function renderEmptyDetail() {
      const detailEl = document.getElementById('ms-detail');
      detailEl.classList.remove('photo-in');
      const msg = '翻開名冊，窺見棲身於安息地的身影。';
      const baseDelay = 1.3;
      const chars = msg.split('').map(function(ch, i) {
        const disp = ch === ' ' ? '&nbsp;' : esc(ch);
        return `<span style="animation-delay:${(baseDelay + i * 0.07).toFixed(3)}s">${disp}</span>`;
      }).join('');
      detailEl.innerHTML = `
        <div class="ms-empty">
          <div class="ms-empty-rule">✦✦✦</div>
          <p class="ms-empty-text">${chars}</p>
        </div>
      `;
    }

    function renderDetail() {
      const p = PEOPLE.find(function(x) { return x.key === selectedKey; });
      if (!p) { renderEmptyDetail(); return; }
      const subtitle = p.fixedSubtitle ? '尚未揭示' : (p.subtitle ? esc(p.subtitle) : '&nbsp;');
      const biz = p.business ? escBr(p.business) : '暫不提供';
      const photo = esc(p.photo || '');
      const detailEl = document.getElementById('ms-detail');
      detailEl.style.setProperty('--ms-photo', `url(${photo})`);
      detailEl.classList.remove('photo-in');
      void detailEl.offsetWidth;
      detailEl.classList.add('photo-in');
      detailEl.innerHTML = `
        <div class="ms-detail-inner">
          <div class="ms-detail-top">
            <div class="ms-role">${esc(p.roleLabel)}</div>
            <h2 class="ms-name">${esc(p.name||'')}</h2>
            <div class="ms-subtitle">${subtitle}</div>
            <div class="ms-view-tag" onclick="openLightbox('${photo}')">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2h4v4M6 14H2v-4M14 10v4h-4M2 6V2h4"/></svg>
              查看大圖
            </div>
          </div>
          ${p.isChief ? `<div id="ms-sj-head-trigger"></div>` : ''}
          <div class="ms-divider"></div>
          <p class="ms-bio">${escBr(p.bio)}</p>
          <div class="ms-section2">
            <div><div class="ms-sec-label">禁忌與偏好</div><div class="ms-sec-val">${escBr(p.taboo)}</div></div>
            <div><div class="ms-sec-label">延伸資訊</div><div class="ms-sec-val">${escBr(p.extra)}</div></div>
            <div><div class="ms-sec-label">聊天尺度</div><div class="ms-sec-val">${escBr(p.chat)}</div></div>
            <div><div class="ms-sec-label">個人業務</div><div class="ms-sec-val">${biz}</div></div>
          </div>
          ${p.isChief ? `<div id="sj-bubble" class="sj-bubble"><span class="sj-dot"></span><span class="sj-dot"></span><span class="sj-dot"></span></div>` : ''}
        </div>
      `;
      if (p.isChief) {
        sjBubble = document.getElementById('sj-bubble');
        const trigger = document.getElementById('ms-sj-head-trigger');
        if (trigger && sjBubble) {
          trigger.addEventListener('mouseenter', function() { sjBubble.classList.add('active'); });
          trigger.addEventListener('mouseleave', function() { sjBubble.classList.remove('active'); });
        }
      } else {
        sjBubble = null;
      }
    }

    window.selectPerson = function(key) {
      selectedKey = key;
      renderRoster();
      renderDetail();
      if (window.matchMedia('(max-width: 768px)').matches) {
        requestAnimationFrame(function() {
          document.getElementById('ms-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }
    };

    const msRosterEl = document.getElementById('ms-roster');
    msRosterEl.addEventListener('mouseover', function(e) {
      const tile = e.target.closest('.ms-tile');
      if (!tile || tile.classList.contains('fog')) return;
      if (e.relatedTarget && tile.contains(e.relatedTarget)) return;
      tile.classList.remove('leaving');
      tile.classList.add('show');
    });
    msRosterEl.addEventListener('mouseout', function(e) {
      const tile = e.target.closest('.ms-tile');
      if (!tile || tile.classList.contains('fog')) return;
      if (e.relatedTarget && tile.contains(e.relatedTarget)) return;
      if (tile.classList.contains('show')) {
        tile.classList.remove('show');
        tile.classList.add('leaving');
      }
    });
    msRosterEl.addEventListener('animationend', function(e) {
      if (e.animationName === 'msVeilOut') {
        e.target.closest('.ms-tile').classList.remove('leaving');
      }
    });

    db.ref('apostles').get().then(function(snap) {
      const all = Object.entries(snap.val() || {})
        .map(function(e) { return { uid: e[0], key: e[0], ...e[1] }; })
        .filter(function(a) { return a.active !== false; })
        .sort(function(x, y) { return (x.order||0) - (y.order||0); });

      const byTag = {};
      all.forEach(function(a) { (byTag[a.tag] = byTag[a.tag] || []).push(a); });

      const clergyLabels = ['司祭', '監禮者'];
      const clergy = (byTag['司祭・監禮者'] || []).map(function(a, i) {
        return Object.assign({}, a, { group: '幹部', roleLabel: clergyLabels[i] || '司祭・監禮者', fixedSubtitle: false, isChief: a.name === '靜火' });
      });
      const silk = (byTag['銀紗使'] || []).map(function(a) {
        return Object.assign({}, a, { group: '幹部', roleLabel: '銀紗使', fixedSubtitle: false, isChief: false });
      });
      const pilgrims = (byTag['引路人'] || []).map(function(a) {
        return Object.assign({}, a, { group: '引路人', roleLabel: '引路人', fixedSubtitle: false, isChief: false });
      });
      const sins = (byTag['食罪'] || []).map(function(a) {
        return Object.assign({}, a, { group: '食罪', roleLabel: '食罪', fixedSubtitle: true, isChief: false });
      });
      const yaos = (byTag['妖異'] || []).map(function(a) {
        return Object.assign({}, a, { group: '妖異', roleLabel: '妖異', fixedSubtitle: true, isChief: false });
      });

      PEOPLE = [].concat(sins, yaos, clergy, silk, pilgrims);
      renderRoster();
      renderDetail();
    }).catch(function(e) { console.error('無法載入成員資料', e); });
  </script>

  <script src="nav.js"></script>
</body>
</html>
