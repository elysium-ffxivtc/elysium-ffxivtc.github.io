<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約召引 ✦ Elysium</title>
  <link rel="icon" type="image/png" href="image/Elysium_LOGO_mini.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .bk2-page {
      display: grid;
      grid-template-columns: 1fr calc(360px + 1.5rem);
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }

    /* ── Header（全寬置中）── */
    .bk2-hdr {
      grid-column: 1 / -1; grid-row: 1;
      text-align: center; padding: 3rem 2.5rem 1.8rem;
      border-bottom: 1px solid var(--border);
    }
    .bk2-hdr-orn {
      width: 40px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(0,0,0,.2), transparent);
      margin: .9rem auto;
    }

    /* ── 卡片區（欄 1）── */
    .bk2-grid-content { grid-column: 1; grid-row: 2; padding: 1.5rem 2.5rem 5rem; min-width: 0; }

    .bk2-grid-label {
      font-size: 15px; letter-spacing: .25em; color: var(--text);
      margin-top: 2rem; margin-bottom: .8rem;
    }
    .bk2-grid > .bk2-grid-label:first-child { margin-top: 0; }

    .bk2-grid { display: flex; flex-direction: column; gap: 1rem; }
    .bk2-grid-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
    }

    /* ── Apostle card ── */
    .bk2-card {
      position: relative; cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;
      border: 1px solid var(--border);
      background: #fff;
      transition: border-color .22s, box-shadow .22s;
      overflow: hidden;
    }
    .bk2-card:hover:not(.unavail) {
      border-color: rgba(184,144,96,.55);
      box-shadow: 0 4px 18px rgba(184,144,96,.12);
      z-index: 1;
    }
    @keyframes gold-pulse {
      0%   { box-shadow: 0 0 8px rgba(184,144,96,.35), 0 0 0px rgba(184,144,96,0); }
      50%  { box-shadow: 0 0 20px rgba(184,144,96,.55), 0 0 36px rgba(184,144,96,.18); }
      100% { box-shadow: 0 0 8px rgba(184,144,96,.35), 0 0 0px rgba(184,144,96,0); }
    }
    .bk2-card.sel {
      border-color: rgba(184,144,96,.7);
      animation: gold-pulse 2.2s ease-in-out infinite;
      z-index: 2;
    }
    .bk2-card.unavail {
      cursor: url('image/arr-cursors/arr-small-forbidden.cur'), not-allowed;
    }
    .bk2-card.unavail .bk2-card-photo::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(239,239,239,.65);
    }
    .bk2-card.unavail .bk2-card-body { opacity: .45; }
    .bk2-card.locked { opacity: .52; cursor: url('image/arr-cursors/arr-small-forbidden.cur'), not-allowed; }

    /* Photo area */
    .bk2-card-photo {
      position: relative; width: 100%; padding-top: 150%;
      overflow: hidden; background: #e8e6e3;
    }
    .bk2-card-photo img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: top;
      display: block;
    }
    .bk2-card-photo-init {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif TC', serif; font-size: 2.5rem;
      color: var(--gold); opacity: .3;
    }

    /* Selection overlay */
    .bk2-card-sel-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px; background: var(--gold);
      transform: scaleX(0); transform-origin: left;
      transition: transform .22s ease;
    }
    .bk2-card.sel .bk2-card-sel-bar { transform: scaleX(0); }

    /* Badge on photo */
    .bk2-card-badge {
      position: absolute; top: .55rem; right: .55rem;
      font-size: 11px; letter-spacing: .05em; padding: 3px 8px;
      border-radius: 2px; font-weight: 500; z-index: 1;
    }
    .bk2-card-badge.avail { background: rgba(184,144,96,.92); color: #fff; }
    .bk2-card-badge.full  { background: rgba(140,40,40,.82); color: #fff; }
    .bk2-card-badge.off   { background: rgba(20,20,20,.55); color: rgba(255,255,255,.75); }

    /* Card body */
    .bk2-card-body {
      padding: .75rem .9rem .85rem;
      border-top: 1px solid var(--border);
      transition: opacity .2s;
    }
    .bk2-card-name {
      display: flex; align-items: center; gap: .35rem;
      font-family: 'Noto Serif TC', serif; font-size: 1rem; font-weight: 700;
      color: var(--text); letter-spacing: .02em;
      transition: color .2s;
    }
    .bk2-card-name-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bk2-card.sel .bk2-card-name { color: var(--gold); }
    .bk2-card-rank-tag {
      flex-shrink: 0;
      font-family: 'Noto Sans TC', sans-serif; font-size: 11px; font-weight: 400;
      color: var(--dim); border: 1px solid var(--border); border-radius: 3px;
      padding: .05rem .35rem; line-height: 1.4;
    }
    .bk2-card-tag { font-size: 10px; color: var(--dim); margin-top: 2px; }

    /* "不指定" card */
    .bk2-card-nodesig {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 160px; gap: .5rem;
      cursor: url('image/arr-cursors/arr-small-link.cur'), pointer; border: 1px dashed var(--border);
      background: transparent; transition: all .22s;
    }
    .bk2-card-nodesig:hover { border-color: rgba(184,144,96,.45); background: rgba(184,144,96,.04); }
    .bk2-card-nodesig.sel  { border-color: var(--gold); border-style: solid; background: rgba(184,144,96,.07); }
    .bk2-card-nodesig-icon { font-size: 1.5rem; color: var(--dim); opacity: .35; line-height: 1; }
    .bk2-card-nodesig-name { font-family: 'Noto Serif TC', serif; font-size: .88rem; font-weight: 700; color: var(--text); letter-spacing: .06em; transition: color .2s; }
    .bk2-card-nodesig.sel .bk2-card-nodesig-name { color: var(--gold); }
    .bk2-card-nodesig-sub  { font-size: 10px; color: var(--dim); }

    /* Date/time hint below grid */
    .bk2-grid-hint {
      margin-top: 1.2rem; padding: .7rem 1rem;
      border: 1px solid var(--border); background: rgba(0,0,0,.02);
      font-size: 12px; color: var(--dim); line-height: 1.8;
    }

    /* ── Right: floating form panel ── */
    .bk2-form-col { grid-column: 2; grid-row: 1 / -1; }
    .bk2-form-panel {
      width: 360px; margin: 1.5rem 0.75rem 0 0;
      position: sticky; top: 1.5rem; align-self: start;
      max-height: calc(100vh - 3rem); overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      border: 1px solid rgba(184,144,96,.3); background: #fafafa;
      box-shadow: 0 0 24px rgba(184,144,96,.22), 0 0 56px rgba(184,144,96,.1), 0 6px 24px rgba(0,0,0,.06);
    }
    .bk2-form-panel::-webkit-scrollbar { display: none; }

    .bk2-form-inner { padding: 0; }
    .bk2-panel-copy { display: none; font-size: 11px; color: var(--dim); text-align: center; padding: .9rem 1rem 1.2rem; letter-spacing: .05em; flex-shrink: 0; }
    @media (max-width: 900px) { .bk2-panel-copy { display: block; } .footer-copy { display: none !important; } }

    /* Form section */
    .bk2-fsec { padding: 1.8rem 1.5rem; margin-bottom: 0; border-bottom: 2px solid rgba(184,144,96,.4); }
    .bk2-fsec-title {
      font-size: 13px; font-weight: 700; letter-spacing: .25em; color: var(--gold);
      text-transform: uppercase; margin-bottom: 1.1rem;
      padding-bottom: .5rem; padding-left: .7rem;
      border-bottom: 1px solid rgba(184,144,96,.3);
      border-left: 2px solid var(--gold);
    }

    /* Field label */
    .bk2-flbl {
      font-size: 12px; font-family: 'Noto Serif TC', serif;
      letter-spacing: .1em; color: var(--dim);
      text-transform: uppercase; margin-bottom: .65rem;
    }
    .bk2-flbl .req { color: var(--gold); margin-left: 2px; }

    /* Compact inputs */
    .bk2-input, .bk2-select, .bk2-textarea {
      width: 100%; background: #fff; border: 1px solid var(--border);
      color: var(--text); padding: .6rem .8rem; border-radius: 2px;
      font-size: 13px; font-family: 'Noto Serif TC', serif; letter-spacing: .05em;
      transition: border-color .2s; appearance: none; -webkit-appearance: none;
    }
    .bk2-input:focus, .bk2-select:focus, .bk2-textarea:focus { outline: none; border-color: var(--gold); }
    .bk2-textarea { resize: vertical; min-height: 60px; line-height: 1.65; }

    /* Time buttons */
    .bk2-tgrd { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 5px; margin-top: .45rem; }

    /* Seat type buttons */
    .bk2-seat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .bk2-seat-btn {
      height: auto; padding: 1rem .6rem; line-height: 1.6; white-space: normal;
      font-family: 'Noto Serif TC', serif;
    }
    .bk2-tbtn {
      padding: .55rem .3rem; border: 1px solid var(--border); background: #fff;
      color: var(--dim); border-radius: 2px; font-size: 13px;
      font-family: 'Noto Serif TC', serif; cursor: url('image/arr-cursors/arr-small-link.cur'), pointer; text-align: center; transition: all .2s;
    }
    .bk2-tbtn:hover { border-color: var(--gold); color: var(--text); }
    .bk2-tbtn.sel   { border-color: var(--gold); background: rgba(184,144,96,.13); color: var(--gold); }

    /* Compact service rows */
    .bk2-svc-row {
      display: flex; align-items: flex-start; gap: .75rem;
      padding: .8rem 0; border-bottom: 1px solid var(--border);
      cursor: url('image/arr-cursors/arr-small-link.cur'), pointer; transition: all .18s; position: relative; padding-left: .75rem;
    }
    .bk2-svc-row:first-of-type { border-top: 1px solid var(--border); }
    .bk2-svc-row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--gold); transform: scaleY(0); transform-origin: center; transition: transform .2s; }
    .bk2-svc-row.sel::before { transform: scaleY(1); }
    .bk2-svc-row.locked { opacity: .35; cursor: url('image/arr-cursors/arr-small-forbidden.cur'), not-allowed; }
    .bk2-svc-name { font-family: 'Noto Serif TC', serif; font-size: .92rem; font-weight: 700; color: var(--text); letter-spacing: .05em; transition: color .18s; }
    .bk2-svc-row.sel .bk2-svc-name { color: var(--gold); }
    .bk2-svc-desc-sm { font-size: 12px; color: var(--dim); line-height: 1.65; margin-top: 2px; }
    .bk2-svc-price  { font-size: 12px; color: var(--dim); white-space: nowrap; margin-left: auto; flex-shrink: 0; padding-top: 2px; }

    /* Compact RP options */
    .bk2-rp-row {
      display: flex; align-items: center; gap: .7rem;
      padding: .65rem 0; border-bottom: 1px solid var(--border);
      cursor: url('image/arr-cursors/arr-small-link.cur'), pointer; transition: all .18s; position: relative; padding-left: .75rem;
    }
    .bk2-rp-row:first-of-type { border-top: 1px solid var(--border); }
    .bk2-rp-row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--gold); transform: scaleY(0); transform-origin: center; transition: transform .2s; }
    .bk2-rp-row.sel::before { transform: scaleY(1); }
    .bk2-rp-label { font-family: 'Noto Serif TC', serif; font-size: .9rem; font-weight: 700; color: var(--text); letter-spacing: .05em; transition: color .18s; white-space: nowrap; flex-shrink: 0; }
    .bk2-rp-row.sel .bk2-rp-label { color: var(--gold); }
    .bk2-rp-desc  { font-size: 12px; color: var(--dim); line-height: 1.65; }

    /* Agree row */
    .bk2-agree-row {
      display: flex; align-items: flex-start; gap: .7rem;
      padding: .8rem 0; cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;
    }
    .bk2-chk {
      width: 15px; height: 15px; min-width: 15px; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: all .18s; margin-top: 3px;
    }
    .bk2-chk.on { background: var(--text); border-color: var(--text); }

    /* Cost row */
    .bk2-cost-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: .7rem 0; border-top: 1px solid var(--border); margin-top: .2rem;
    }
    .bk2-cost-lbl { font-size: 12px; color: var(--dim); letter-spacing: .06em; }
    .bk2-cost-val { font-family: 'Noto Serif TC', serif; font-size: 1.35rem; font-weight: 700; color: var(--text); }
    .bk2-cost-unit { font-size: 11px; color: var(--dim); margin-left: .2rem; }

    /* Photo sig add-on */
    .bk2-photosig {
      display: flex; align-items: center; justify-content: space-between;
      padding: .6rem .75rem .6rem 1.2rem;
      background: rgba(0,0,0,.02); cursor: url('image/arr-cursors/arr-small-link.cur'), pointer; position: relative;
      border-top: 1px solid var(--border); transition: background .18s;
    }
    .bk2-photosig-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .2s; }
    .bk2-photosig.on .bk2-photosig-bar { transform: scaleX(1); }

    /* Submit */
    .bk2-submit-btn {
      display: block; width: 100%; padding: .9rem;
      background: var(--text); border: none; color: #fff;
      font-family: 'Noto Serif TC', serif; font-size: 13.5px; letter-spacing: .18em;
      cursor: url('image/arr-cursors/arr-small-link.cur'), pointer; transition: opacity .2s; font-weight: 500;
    }
    .bk2-submit-btn:hover    { opacity: .78; }
    .bk2-submit-btn:disabled { opacity: .2; cursor: url('image/arr-cursors/arr-small-forbidden.cur'), not-allowed; }

    /* Modal tweaks */
    #agree-modal .welcome-divider { margin-bottom: .6rem; }

    /* Modal checkbox */
    .bk-cchk {
      width: 18px; height: 18px; min-width: 18px; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; transition: all .2s;
    }
    .bk-cchk.on { background: var(--text); border-color: var(--text); }

    /* Loading */
    #bk-loading {
      position: fixed; inset: 0; background: #efefef;
      display: none; align-items: center; justify-content: center; z-index: 9999;
    }

    /* Lightbox */
    #bk-lightbox { position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; cursor: url('image/arr-cursors/arr-zoom-out.cur'), zoom-out; }
    #bk-lightbox.open { display: flex; }
    #bk-lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; display: block; pointer-events: none; }
    #bk-lightbox-close { position: absolute; top: 1.2rem; right: 1.4rem; color: rgba(255,255,255,.7); font-size: 1.6rem; line-height: 1; cursor: url('image/arr-cursors/arr-small-link.cur'), pointer; user-select: none; }

    /* Mobile */
    /* ── Sheet handle ── */
    .bk2-sheet-handle {
      display: none;
      width: 100%; height: 36px;
      flex-shrink: 0;
      cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;
      position: relative;
    }
    .bk2-sheet-handle::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 36px; height: 4px;
      background: rgba(0,0,0,.13);
      border-radius: 2px;
    }

    @media (max-width: 900px) {
      .bk2-page { grid-template-columns: 1fr; grid-template-rows: auto auto; }
      .bk2-grid-content { padding-bottom: 28vh; }

      /* Bottom sheet */
      .bk2-form-col {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 25vh;
        z-index: 100;
        transition: height .38s cubic-bezier(.4,0,.2,1);
      }
      .bk2-form-col.sheet-open { height: 100dvh; height: 100vh; }
      .bk2-form-panel {
        width: 100%; height: 100%; overflow-y: auto;
        position: static; max-height: none; margin: 0;
        border-radius: 14px 14px 0 0;
        border: none; border-top: 1px solid rgba(184,144,96,.3);
        box-shadow: 0 -4px 24px rgba(0,0,0,.12);
        top: auto !important;
        display: flex; flex-direction: column;
      }
      .bk2-sheet-handle { display: block; }
      .bk2-grid-row { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>

  <div id="bk-loading">
    <div style="display:flex;flex-direction:column;align-items:center;gap:.9rem;">
      <div style="width:50px;height:50px;perspective:120px;">
        <img id="bk-load-img" src="image/eye_final.png" alt=""
          style="width:50px;height:50px;object-fit:contain;display:block;transition:transform .18s ease;">
      </div>
    </div>
  </div>

  <div id="bk-lightbox" onclick="closeLightbox()">
    <span id="bk-lightbox-close">&times;</span>
    <img id="bk-lightbox-img" src="" alt="">
  </div>


  <!-- 入堂須知 modal -->
  <div id="agree-modal" class="welcome-overlay">
    <div class="welcome-box">
      <p class="welcome-title">入堂須知</p>
      <div class="welcome-divider"></div>
      <p class="welcome-body">為了讓您有更好的與會體驗，請詳細閱讀禮堂規約。</p>
      <a href="rules.html" target="_blank"
        style="display:inline-block;font-family:'Noto Serif TC',serif;font-size:1.25rem;font-weight:700;color:var(--gold);text-decoration:none;letter-spacing:.18em;margin-bottom:1.4rem;">
        𓊆 禮堂規約 𓊇
      </a>
      <div onclick="toggleModalAgree()"
        style="cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;display:flex;align-items:flex-start;gap:.85rem;padding:1rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:1.4rem;text-align:left;">
        <div class="bk-cchk" id="modal-agree-chk" style="border-radius:0;margin-top:4px;flex-shrink:0;"></div>
        <div style="font-family:'Noto Serif TC',serif;font-size:.88rem;color:var(--text);letter-spacing:.04em;line-height:1.75;">
          本人已閱讀並同意 Elysium 規約及隱私權政策。<br>
          <span style="font-size:.75rem;color:var(--dim);">違反規約者將影響與會資格</span>
        </div>
      </div>
      <button class="welcome-confirm" id="modal-enter-btn" onclick="enterFromModal()" disabled
        style="opacity:.2;cursor:not-allowed;">前往預約</button>
    </div>
  </div>

  <div class="bk2-page">
    <div class="bk2-hdr">
      <div style="font-size:.62rem;letter-spacing:.5em;color:var(--gold);">E L Y S I U M</div>
      <div style="margin-top:.4rem;">
        <h1 style="font-family:'Noto Serif TC',serif;font-size:clamp(1.5rem,2.2vw,2rem);font-weight:700;letter-spacing:.08em;line-height:1.35;margin:0 0 .6rem;">召引預約</h1>
        <div class="bk2-hdr-orn"></div>
        <p style="font-family:'Noto Serif TC',serif;font-size:.85rem;letter-spacing:.1em;color:var(--dim);margin:0;text-align:center;">獻予徬徨靈魂的朝聖之途</p>
      </div>
    </div>
    <div class="bk2-grid-content">
      <div class="bk2-grid" id="bk2-grid"></div>
      <div id="bk2-grid-hint"></div>
    </div>
    <div class="bk2-form-col" id="bk2-form-col">
      <div class="bk2-form-panel">
        <div class="bk2-sheet-handle"></div>
        <div class="bk2-form-inner" id="bk2-form-inner"></div>
        <p class="bk2-panel-copy">&copy; 2026 Elysium. All rights reserved.</p>
      </div>
    </div>
    <p class="footer-copy" style="grid-column:1/-1;grid-row:3;text-align:center;padding:1.2rem 3rem 1.4rem;border-top:1px solid var(--border);">&copy; 2026 Elysium. All rights reserved.</p>
  </div>


  <script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getDatabase, ref as dbRef, get, update, runTransaction } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

  // ─────────────────────────────────────────────────────────────
  //  設定區
  // ─────────────────────────────────────────────────────────────
  const app = initializeApp({
    apiKey:            "AIzaSyCZkdAeMKUWXQPXFptw3t4dYVOBAo7lF5Q",
    authDomain:        "elysiumpos.firebaseapp.com",
    databaseURL:       "https://elysiumpos-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "elysiumpos",
    storageBucket:     "elysiumpos.firebasestorage.app",
    messagingSenderId: "430177597593",
    appId:             "1:430177597593:web:7598eaf6e5e6264dc82008"
  });
  const db = getDatabase(app);
  const TIME_SLOTS = ['22:00', '23:00', '00:00'];
  const DAILY_CAPACITY = 40; // 線上預約單日總人數上限，保留現場席次
  function sKey(t) { return t.replace(':', ''); }
  function sanitizeKey(s) { return String(s||'').trim().replace(/[.#$/\[\]]/g, '_'); }

  const PREVIEW = location.search.includes('preview');

  // ─────────────────────────────────────────────────────────────
  //  資料
  // ─────────────────────────────────────────────────────────────
  let APOSTLES = [];

  const SERVICES = [
    {
      id: 'nomen30', name: '顯名儀',
      desc: '回應召喚的基礎儀式，使徒留下最初的名痕。',
      price: 200000, dur: 30, canDesig: true,
    },
    {
      id: 'photo', name: '交名留影',
      desc: '拍立得一張，化作永恆的珍貴時刻。\n※ 多人合影（至多三人）另計',
      price: 100000, canDesig: true,
    },
  ];

  const RP_OPTS = [
    { id: 'heavy',  label: '重 RP',  desc: '完全以角色視角行動，嚴格遵守世界觀。' },
    { id: 'medium', label: '中 RP',  desc: '含角色設定，完全沉浸在艾奧傑亞之中。' },
    { id: 'light',  label: '輕 RP',  desc: '以自身角色進行，體驗 Elysium 的氛圍。' },
    { id: 'none',   label: '無 RP',  desc: '不進行角色扮演，作為一般玩家享受服務。' },
  ];
  const SERVERS = ['伊弗利特', '迦樓羅', '利維坦', '鳳凰', '奧汀', '巴哈姆特', '泰坦'];

  const VISIT_TYPES = [
    { id: 'ritual', label: '儀式預約', desc: '進行召引等儀式服務。' },
    { id: 'seat',   label: '席位預約', desc: '僅預留席位入場，感受禮堂氛圍。' },
  ];

  const SEAT_TYPES = [
    { id: 'sin',    name: '棲願之間', sub: '食罪席' },
    { id: 'grudge', name: '執念迴廊', sub: '妖異席' },
  ];

  // ─────────────────────────────────────────────────────────────
  //  狀態
  // ─────────────────────────────────────────────────────────────
  let bizStatus = {}, publicShifts = {}, bookedSlots = {}, previewBlock = false;
  let ALL_APOSTLES = {}; // uid -> 完整 apostles 記錄（含銀紗使／引路人），供每時段人力規則判斷用
  let st = {
    agreed: false, date: '', time: '',
    visitType: '',
    services: [], photoSig: false, photoExtra: 0,
    apostle: null, designated: false,
    seatType: '', seatCount: 1,
    rp: '', rpNote: '',
    gameName: '', server: '', contact: '', notes: '',
  };

  // ─────────────────────────────────────────────────────────────
  //  資料載入
  // ─────────────────────────────────────────────────────────────
  const LOAD_ICONS = ['image/Elysium_LOGO.png','image/eye_final.png','image/key_final.png','image/moon_final.png','image/scale_final.png'];

  function isCurrentWeek(dateStr) {
    const today = new Date(); today.setHours(0,0,0,0);
    const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay()+6)%7));
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const d = new Date(dateStr + 'T00:00:00');
    return d >= monday && d <= sunday;
  }

  async function loadData() {
    showLoading(true);
    try {
      const [apostlesSnap, bizSnap, shiftsSnap, bookedSnap] = await Promise.all([
        get(dbRef(db, 'apostles')), get(dbRef(db, 'bizStatus')),
        get(dbRef(db, 'publicShifts')), get(dbRef(db, 'bookedSlots')),
      ]);
      const apostlesVal = apostlesSnap.val() || {};
      ALL_APOSTLES = apostlesVal;
      APOSTLES = Object.entries(apostlesVal)
        .map(([uid, v]) => ({ uid, ...v }))
        .filter(a => a.active !== false && a.tag !== '銀紗使' && a.tag !== '引路人')
        .sort((a, b) => (a.order || 0) - (b.order || 0));
      bizStatus    = bizSnap.val()    || {};
      publicShifts = shiftsSnap.val() || {};
      bookedSlots  = bookedSnap.val() || {};
    } catch(e) { console.error(e); }
    showLoading(false);
  }

  function showLoading(on) {
    const el = document.getElementById('bk-loading');
    if (on) {
      if (el._interval) clearInterval(el._interval);
      const shuffled = LOAD_ICONS.slice().sort(() => Math.random() - .5);
      let idx = 0;
      const img = document.getElementById('bk-load-img');
      if (img) img.src = shuffled[0];
      el._interval = setInterval(function() {
        if (!img) return;
        img.style.transform = 'rotateY(90deg)';
        setTimeout(function() {
          idx = (idx + 1) % shuffled.length;
          img.src = shuffled[idx];
          img.style.transform = 'rotateY(-90deg)';
          requestAnimationFrame(function() {
            requestAnimationFrame(function() { img.style.transform = 'rotateY(0deg)'; });
          });
        }, 180);
      }, 900);
      el.style.display = 'flex';
    } else {
      if (el) {
        if (el._interval) { clearInterval(el._interval); el._interval = null; }
        el.style.display = 'none';
      }
    }
  }

  // ─────────────────────────────────────────────────────────────
  //  排班邏輯
  // ─────────────────────────────────────────────────────────────
  // 每個時段各自要有靜火在班、至少一位引路人、至少三位使徒（食罪／妖異）才算這個時段有開放，
  // 跟 bizStatus（當天整體是否營業）分開判斷，避免單一時段缺人拖累其他時段。
  function isSlotStaffed(dateStr, time) {
    const uids = Object.keys(publicShifts[dateStr]?.[sKey(time)] || {});
    const hasJinghuo   = uids.some(uid => ALL_APOSTLES[uid]?.name === '靜火');
    const pilgrimCount = uids.filter(uid => ALL_APOSTLES[uid]?.tag === '引路人').length;
    const apostleCount = uids.filter(uid => ALL_APOSTLES[uid]?.tag === '食罪' || ALL_APOSTLES[uid]?.tag === '妖異').length;
    return hasJinghuo && pilgrimCount >= 1 && apostleCount >= 3;
  }
  function getAvailTimes(dateStr) {
    if (!bizStatus[dateStr]?.isOpen) return [];
    return TIME_SLOTS.filter(t => isSlotStaffed(dateStr, t));
  }
  function getApostleBookableTimes(dateStr, uid) {
    if (APOSTLES.find(a => a.uid === uid)?.bookable === false) return [];
    const shiftsForDate = publicShifts[dateStr]; if (!shiftsForDate) return [];
    return TIME_SLOTS.filter(t => !!shiftsForDate[sKey(t)]?.[uid]);
  }
  function isApostleOnDuty(dateStr, uid, time) { return getApostleBookableTimes(dateStr, uid).includes(time); }
  function hasAvailableApostle(dateStr, time) {
    if (!APOSTLES.length) return true;
    const onDuty = APOSTLES.filter(a => isApostleOnDuty(dateStr, a.uid, time));
    if (!onDuty.length) return false;
    return onDuty.some(a => {
      const s = getApostleSlotStatus(dateStr, a.uid).find(ts => ts.time === time);
      return s ? !s.blocked : false;
    });
  }
  function getApostleSlotStatus(dateStr, uid) {
    const allTimes = getAvailTimes(dateStr);
    if (PREVIEW && previewBlock) return allTimes.map(t => ({ time:t, blocked:true }));
    return allTimes.map(t => ({ time:t, blocked: !!bookedSlots[dateStr]?.[sKey(t)]?.[uid] }));
  }
  function nomenPrice() {
    const a = APOSTLES.find(x => x.uid === st.apostle);
    return a && a.rank === 'intern' ? 150000 : 200000;
  }
  function svcPrice(sid) {
    return sid === 'nomen30' ? nomenPrice() : (SERVICES.find(s => s.id===sid)?.price||0);
  }
  function calcTotal() {
    if (st.visitType === 'seat') return st.seatCount * 20000;
    return st.services.reduce((t, sid) => t + svcPrice(sid), 0)
      + (st.photoSig && st.services.includes('photo') ? 20000 : 0)
      + (st.services.includes('photo') ? st.photoExtra * 20000 : 0);
  }

  // ─────────────────────────────────────────────────────────────
  //  工具
  // ─────────────────────────────────────────────────────────────
  function fmtDate(dateStr) {
    const w = ['日','一','二','三','四','五','六'];
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} (${w[d.getDay()]})`;
  }
  function escH(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function chkSvg() {
    return '<svg width="10" height="10" viewBox="0 0 11 11"><polyline points="1.5,5.5 4,8.5 9.5,2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="butt" stroke-linejoin="miter"/></svg>';
  }
  function openLightbox(src) {
    document.getElementById('bk-lightbox-img').src = src;
    document.getElementById('bk-lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('bk-lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

  // ─────────────────────────────────────────────────────────────
  //  Apostle grid
  // ─────────────────────────────────────────────────────────────
  function apostleOrder(a) {
    const tag = a.tag || '';
    if (tag.includes('食罪')) return 0;
    if (tag.includes('妖異')) return 1;
    if (tag.includes('司祭') || tag.includes('監禮者')) return 2;
    return 0;
  }

  function renderGrid() {
    const hasDateTime = st.date && st.time;
    const seatMode    = st.visitType === 'seat';
    let anyAvail      = false;

    const gridEl = document.getElementById('bk2-grid');
    const hintEl = document.getElementById('bk2-grid-hint');

    if (APOSTLES.length === 0) {
      gridEl.innerHTML = `<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--dim);font-size:13px;">使徒資料載入中…</div>`;
      hintEl.innerHTML = '';
      return;
    }

    const groups = [
      { label: '食罪',       list: [] },
      { label: '妖異',       list: [] },
      { label: '司祭・監禮者', list: [] },
    ];
    APOSTLES.forEach(a => groups[apostleOrder(a)].list.push(a));

    function cardHtml(a) {
      let cls = '', badge = '';
      const hasNomen = st.services.includes('nomen30');
      if (!hasDateTime) {
        cls = ' unavail';
        badge = `<span class="bk2-card-badge off">待確認場次</span>`;
      } else {
        const onDuty = isApostleOnDuty(st.date, a.uid, st.time);
        if (!onDuty) {
          cls = ' unavail'; badge = `<span class="bk2-card-badge off">無法回應</span>`;
        } else {
          const slot  = getApostleSlotStatus(st.date, a.uid).find(ts => ts.time===st.time);
          const avail = slot ? !slot.blocked : false;
          if (avail) { anyAvail = true; badge = `<span class="bk2-card-badge avail">開放召引</span>`; }
          else        { cls = ' unavail'; badge = `<span class="bk2-card-badge full">已額滿</span>`; }
        }
      }
      const isSel     = st.apostle === a.uid;
      const isLocked  = seatMode || (hasDateTime && !hasNomen && !cls);
      const photoHtml = a.photo
        ? `<img src="${escH(a.photo)}" alt="${escH(a.name)}">`
        : `<div class="bk2-card-photo-init">${escH(a.initial||a.name.slice(0,1))}</div>`;
      const clickEv = (cls || isLocked) ? '' : `onclick="selectApostle2('${a.uid}')"`;
      return `<div class="bk2-card${isSel?' sel':''}${cls}${isLocked?' locked':''}" ${clickEv}>
        <div class="bk2-card-photo">${photoHtml}${badge}<div class="bk2-card-sel-bar"></div></div>
        <div class="bk2-card-body">
          <div class="bk2-card-name"><span class="bk2-card-name-text">${escH(a.name)}</span>${a.rank==='intern' ? `<span class="bk2-card-rank-tag">見習</span>` : ''}</div>
        </div>
      </div>`;
    }

    let html = '';
    groups.forEach(g => {
      if (g.list.length === 0) return;
      if (g.label === '司祭・監禮者') {
        if (!hasDateTime) return;
        const onDuty = g.list.filter(a => isApostleOnDuty(st.date, a.uid, st.time));
        if (onDuty.length === 0) return;
        html += `<div class="bk2-grid-label">${g.label}</div><div class="bk2-grid-row">${onDuty.map(cardHtml).join('')}</div>`;
        return;
      }
      html += `<div class="bk2-grid-label">${g.label}</div><div class="bk2-grid-row">${g.list.map(cardHtml).join('')}</div>`;
    });

    if (!seatMode && hasDateTime && anyAvail && st.services.includes('nomen30')) {
      const noSel = st.apostle === 'none';
      html += `<div class="bk2-grid-row"><div class="bk2-card-nodesig${noSel?' sel':''}" onclick="selectApostle2('none')">
        <div class="bk2-card-nodesig-icon">—</div>
        <div class="bk2-card-nodesig-name">不指定使徒</div>
        <div class="bk2-card-nodesig-sub">觸發特殊條件的可能</div>
      </div></div>`;
    }

    gridEl.innerHTML = html;

    if (seatMode) {
      hintEl.innerHTML = `<div class="bk2-grid-hint">席位預約無法指定使徒，請於右側填寫座席與人數資訊。</div>`;
    } else if (!hasDateTime) {
      hintEl.innerHTML = `<div class="bk2-grid-hint">選擇日期與場次後，各位使徒的召引狀態將顯示於此。</div>`;
    } else if (!st.services.includes('nomen30')) {
      hintEl.innerHTML = `<div class="bk2-grid-hint">選擇顯名儀後，即可召引使徒。</div>`;
    } else if (!anyAvail && APOSTLES.length > 0) {
      hintEl.innerHTML = `<div class="bk2-grid-hint">此場次所有使徒召引已額滿，請返回選擇其他場次。</div>`;
    } else {
      hintEl.innerHTML = '';
    }
  }

  // ─────────────────────────────────────────────────────────────
  //  Form panel (rendered once, sections updated in place)
  // ─────────────────────────────────────────────────────────────

    const dateHtml = openDates.length === 0

      : `<div style="margin-bottom:1rem;">
           <div class="bk2-flbl">日期<span class="req">*</span></div>
           <select class="bk2-select" id="inp-date" onchange="selectDate2(this.value)">
             <option value="">請選擇</option>
             ${openDates.map(d => `<option value="${d}" ${st.date===d?'selected':''}>${fmtDate(d)}</option>`).join('')}
           </select>
         </div>
         <div id="bk2-times"></div>`;

    document.getElementById('bk2-form-inner').innerHTML = `

      <div class="bk2-fsec">
        <div class="bk2-fsec-title">日期場次</div>

      </div>

        <div class="bk2-fsec-title">來訪形式</div>

      </div>

      <div id="bk2-ritual-sec" style="display:none;">
        <div class="bk2-fsec">
          <div class="bk2-fsec-title">儀式選擇</div>
          <div style="font-size:12px;color:var(--dim);line-height:1.8;margin-bottom:.75rem;">以下費用不含入堂花環費（20,000 Gil，現場收取）</div>
          <div id="bk2-svc-cards"></div>
          <div id="bk2-cost"></div>
        </div>
      </div>

      <!-- ponytail: 座席保留目前只能二選一，之後如需即時空位／更多席別再串接 Firebase -->
      <div id="bk2-seat-sec" style="display:none;">
        <div class="bk2-fsec">
          <div class="bk2-fsec-title">座席保留</div>
          <div class="bk2-flbl" style="margin-bottom:.6rem;">座席<span class="req">*</span></div>
          <div id="bk2-seat-opts" class="bk2-seat-grid"></div>
          <div style="margin-top:1.2rem;">
            <div class="bk2-flbl">人數<span class="req">*</span></div>
            <div style="display:flex;align-items:center;gap:.6rem;">
              <button onclick="changeSeatCount2(-1)"
                style="width:28px;height:28px;border:1px solid var(--border);background:none;border-radius:4px;cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;font-size:15px;line-height:1;color:var(--dim);padding:0;">－</button>
              <span id="bk2-seatcount-val" style="font-size:14px;width:1.5rem;text-align:center;color:var(--text);">${st.seatCount}</span>
              <button onclick="changeSeatCount2(1)"
                style="width:28px;height:28px;border:1px solid var(--border);background:none;border-radius:4px;cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;font-size:15px;line-height:1;color:var(--dim);padding:0;">＋</button>
            </div>
          </div>
          <div style="font-size:12px;color:var(--dim);line-height:1.8;margin-top:.9rem;">入堂花環費 20,000 Gil／人</div>
          <div id="bk2-seat-cost"></div>
        </div>
      </div>

      <div class="bk2-fsec">
        <div class="bk2-fsec-title">會眾資訊</div>
        <div class="bk2-flbl" style="margin-bottom:.6rem;">RP 程度<span class="req">*</span></div>
        <div id="bk2-rp-opts"></div>
        <div style="margin-top:1rem;">
          <div class="bk2-flbl">備註（選填）</div>
          <textarea class="bk2-textarea" id="inp-rpnote"
            placeholder="稱呼、故事背景、特殊要求、禁止事項⋯"
            style="resize:none;overflow:hidden;min-height:60px;"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';"></textarea>

      <div class="bk2-fsec" style="border-bottom:none;">
        <div class="bk2-fsec-title">基本資料</div>
        <div style="margin-bottom:.9rem;">
          <div class="bk2-flbl">遊戲角色名稱<span class="req">*</span></div>
          <input class="bk2-input" type="text" id="inp-game" placeholder="輸入遊戲內角色名稱" value="${escH(st.gameName)}">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.9rem;">
          <div>
            <div class="bk2-flbl">所在World<span class="req">*</span></div>
            <select class="bk2-select" id="inp-server">
              <option value="">請選擇</option>
              ${SERVERS.map(s => `<option value="${s}" ${st.server===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>

            <div class="bk2-flbl">Discord Id<span class="req">*</span></div>

    updateRPOpts();

  // ─────────────────────────────────────────────────────────────
  //  Targeted updates
  // ─────────────────────────────────────────────────────────────
  function updateVisitOpts() {
    const el = document.getElementById('bk2-visit-opts');
    if (!el) return;
    const locked = !(st.date && st.time);
    el.innerHTML = locked
      ? `<p style="font-size:12px;color:var(--dim);line-height:1.9;">請先選擇日期與場次</p>`
      : VISIT_TYPES.map(o => {
          const sel = st.visitType === o.id;
          return `<div class="bk2-rp-row${sel?' sel':''}" onclick="selectVisitType2('${o.id}')">
            <div class="bk2-rp-label">${o.label}</div>
            <div class="bk2-rp-desc">${o.desc}</div>
          </div>`;
        }).join('');
  }

  function updateVisitSections() {
    const ritualEl = document.getElementById('bk2-ritual-sec');
    const seatEl   = document.getElementById('bk2-seat-sec');
    if (ritualEl) ritualEl.style.display = st.visitType === 'ritual' ? '' : 'none';
    if (seatEl)   seatEl.style.display   = st.visitType === 'seat'   ? '' : 'none';
  }

  function updateSeatOpts() {
    const el = document.getElementById('bk2-seat-opts');
    if (!el) return;
    el.innerHTML = SEAT_TYPES.map(o => {
      const sel = st.seatType === o.id;
      return `<button type="button" class="bk2-tbtn bk2-seat-btn${sel?' sel':''}" onclick="selectSeatType2('${o.id}')">
        <div style="font-weight:700;">${o.name}</div>
        <div style="font-size:10px;letter-spacing:.05em;color:${sel?'var(--gold)':'var(--dim)'};margin-top:2px;">${o.sub}</div>
      </button>`;
    }).join('');
  }

  function updateTimes() {
    const el = document.getElementById('bk2-times');
    if (!el) return;
    if (!st.date) { el.innerHTML = ''; return; }
    const times = getAvailTimes(st.date);
    if (times.length === 0) {
      el.innerHTML = `<p style="font-size:12px;color:var(--dim);margin-top:.3rem;">所選日期尚未開放場次。</p>`;
      return;
    }
    el.innerHTML = `
      <div class="bk2-flbl">場次<span class="req">*</span></div>
      <div class="bk2-tgrd">${times.map(t => {
        const avail = hasAvailableApostle(st.date, t);
        return `<button class="bk2-tbtn${st.time===t?' sel':''}"
          onclick="${avail ? `selectTime2('${t}')` : ''}"
          style="${!avail ? 'opacity:.3;cursor:not-allowed;' : ''}"
          ${!avail ? 'disabled' : ''}>${t}</button>`;
      }).join('')}</div>
    `;
  }

  function updateSvcCards() {
    const el = document.getElementById('bk2-svc-cards');
    if (!el) return;
    el.innerHTML = SERVICES.map(s => {
      const sel    = st.services.includes(s.id);
      const locked = (s.id === 'nomen30' && (!st.date || !st.time))
                  || (s.id === 'photo'   && !st.services.includes('nomen30'));
      return `<div class="bk2-svc-row${sel?' sel':''}${locked?' locked':''}"
        onclick="${locked ? '' : `toggleSvc2('${s.id}')`}">
        <div style="flex:1;min-width:0;">
          <div class="bk2-svc-name">${s.name}</div>
          <div class="bk2-svc-desc-sm">${s.desc.split('\n')[0]}</div>
        </div>
        <div class="bk2-svc-price">${svcPrice(s.id).toLocaleString()} Gil</div>
      </div>
      ${s.id==='photo' && sel
        ? `<div class="bk2-photosig${st.photoSig?' on':''}" onclick="togglePhotoSig2()">
            <div class="bk2-photosig-bar"></div>
            <span style="font-size:12.5px;color:${st.photoSig?'var(--gold)':'var(--dim)'};">加選：簽名拍立得</span>
            <span style="font-size:12px;color:${st.photoSig?'var(--text)':'var(--dim)'};">20,000 Gil</span>
          </div>
          <div class="bk2-photosig${st.photoExtra>0?' on':''}">
            <div class="bk2-photosig-bar"></div>
            <span style="font-size:12.5px;color:${st.photoExtra>0?'var(--gold)':'var(--dim)'};">加選：多人合影</span>
            <div style="display:flex;align-items:center;gap:.4rem">
              <button onclick="event.stopPropagation();changePhotoExtra2(-1)"
                style="width:22px;height:22px;border:1px solid var(--border);background:none;border-radius:4px;cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;font-size:14px;line-height:1;color:var(--dim);padding:0;flex-shrink:0">−</button>
              <span style="font-size:13px;width:1.2rem;text-align:center;color:${st.photoExtra>0?'var(--text)':'var(--dim)'};flex-shrink:0">${st.photoExtra}</span>
              <button onclick="event.stopPropagation();changePhotoExtra2(1)"
                style="width:22px;height:22px;border:1px solid var(--border);background:none;border-radius:4px;cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;font-size:14px;line-height:1;color:var(--dim);padding:0;flex-shrink:0${st.photoExtra>=2?';opacity:.35;pointer-events:none':''}">＋</button>
              <span style="font-size:12px;width:88px;text-align:right;color:${st.photoExtra>0?'var(--text)':'var(--dim)'};flex-shrink:0">${st.photoExtra>0?(st.photoExtra*20000).toLocaleString()+' Gil':'20,000 Gil / 人'}</span>
            </div>
          </div>`
        : ''
      }`;
    }).join('');
  }

  function costRowHtml() {
    const total = calcTotal();
    return `
      <div class="bk2-cost-row">
        <span class="bk2-cost-lbl">費用合計</span>
        <div>
          <span class="bk2-cost-val">${total.toLocaleString()}</span>
          <span class="bk2-cost-unit">Gil</span>
        </div>
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:.25rem;text-align:right;">※實際金額請依現場消費為主</div>`;
  }

  function updateCost() {
    const el = document.getElementById('bk2-cost');
    if (el) el.innerHTML = costRowHtml();
  }

  function updateSeatCost() {
    const el = document.getElementById('bk2-seat-cost');
    if (el) el.innerHTML = costRowHtml();
  }

  function updateRPOpts() {
    const el = document.getElementById('bk2-rp-opts');
    if (!el) return;
    el.innerHTML = RP_OPTS.map(o => {
      const sel = st.rp === o.id;
      return `<div class="bk2-rp-row${sel?' sel':''}" onclick="selectRP2('${o.id}')">
        <div class="bk2-rp-label">${o.label}</div>
        <div class="bk2-rp-desc">${o.desc}</div>
      </div>`;
    }).join('');
  }

  function updateSubmitBtn() {
    const btn = document.getElementById('bk2-submit-btn');
    if (!btn) return;
    let ok = !!(st.date && st.time && st.visitType && st.rp);
    if (st.visitType === 'ritual') {
      const canDesig  = st.services.some(sid => SERVICES.find(s => s.id===sid)?.canDesig);
      const apostleOk = canDesig ? !!st.apostle : true;
      ok = ok && st.services.length > 0 && apostleOk;
    } else if (st.visitType === 'seat') {
      ok = ok && st.seatCount > 0 && !!st.seatType;
    }
    btn.disabled = !ok;
  }

  function toggleModalAgree() {
    const chk = document.getElementById('modal-agree-chk');
    const btn = document.getElementById('modal-enter-btn');
    st.agreed = !st.agreed;
    chk.className = 'bk-cchk' + (st.agreed ? ' on' : '');
    chk.innerHTML  = st.agreed
      ? '<svg width="11" height="11" viewBox="0 0 11 11"><polyline points="1.5,5.5 4,8.5 9.5,2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="butt" stroke-linejoin="miter"/></svg>'
      : '';
    btn.disabled = !st.agreed;
    btn.style.opacity = st.agreed ? '1' : '.2';
    btn.style.cursor  = st.agreed ? 'pointer' : 'not-allowed';
  }

  function enterFromModal() {
    if (!st.agreed) return;
    document.getElementById('agree-modal').style.display = 'none';
  }

  // ─────────────────────────────────────────────────────────────
  //  Event handlers
  // ─────────────────────────────────────────────────────────────

  function selectDate2(v) {
    st.date = v; st.time = '';
    st.visitType = ''; st.services = []; st.photoSig = false; st.photoExtra = 0;
    st.apostle = null; st.designated = false; st.seatType = '';
    updateTimes();
    updateVisitOpts();
    updateVisitSections();
    updateSeatOpts();
    updateSvcCards();
    updateCost();
    updateSeatCost();
    renderGrid();
    updateSubmitBtn();
  }

  function selectTime2(t) {
    st.time = t;
    document.querySelectorAll('#bk2-times .bk2-tbtn').forEach(btn => {
      btn.classList.toggle('sel', btn.textContent.trim() === t);
    });
    updateVisitOpts();
    updateSvcCards();
    updateCost();
    renderGrid();
    updateSubmitBtn();
  }

  function toggleSvc2(id) {
    const i = st.services.indexOf(id);
    if (i === -1) {
      if (id === 'photo' && !st.services.includes('nomen30')) return;
      st.services.push(id);
    } else {
      st.services.splice(i, 1);
      if (id === 'photo') { st.photoSig = false; st.photoExtra = 0; }
      if (id === 'nomen30') {
        const pi = st.services.indexOf('photo');
        if (pi !== -1) { st.services.splice(pi, 1); st.photoSig = false; st.photoExtra = 0; }
        st.apostle = null;
        st.designated = false;
      }
    }
    updateSvcCards();
    updateCost();
    renderGrid();
    updateSubmitBtn();
  }

  function togglePhotoSig2() {
    st.photoSig = !st.photoSig;
    updateSvcCards();
    updateCost();
  }

  function changePhotoExtra2(d) {
    st.photoExtra = Math.max(0, Math.min(2, st.photoExtra + d));
    updateSvcCards();
    updateCost();
  }

  function selectApostle2(id) {
    st.apostle    = (st.apostle === id ? null : id);
    st.designated = (st.apostle !== null && st.apostle !== 'none');
    renderGrid();
    updateSvcCards();
    updateCost();
    updateSubmitBtn();
  }

  function selectRP2(id) {
    st.rp = (st.rp === id ? '' : id);
    updateRPOpts();
    updateSubmitBtn();
  }

  function selectVisitType2(id) {
    st.visitType = (st.visitType === id ? '' : id);
    if (st.visitType !== 'ritual') {
      st.services = []; st.photoSig = false; st.photoExtra = 0;
      st.apostle = null; st.designated = false;
    }
    if (st.visitType !== 'seat') { st.seatType = ''; }
    updateVisitOpts();
    updateVisitSections();
    updateSeatOpts();
    updateSeatCost();
    renderGrid();
    updateSubmitBtn();
  }

  function selectSeatType2(id) {
    st.seatType = (st.seatType === id ? '' : id);
    updateSeatOpts();
    updateSubmitBtn();
  }

  function changeSeatCount2(d) {
    st.seatCount = Math.max(1, Math.min(10, st.seatCount + d));
    const val = document.getElementById('bk2-seatcount-val');
    if (val) val.textContent = st.seatCount;
    updateSeatCost();
    updateSubmitBtn();
  }

  // ─────────────────────────────────────────────────────────────
  //  Submit
  // ─────────────────────────────────────────────────────────────
  async function submitRes2() {
    st.rpNote   = document.getElementById('inp-rpnote')?.value || '';
    st.gameName = document.getElementById('inp-game')?.value?.trim() || '';
    st.server   = document.getElementById('inp-server')?.value || '';
    st.contact  = document.getElementById('inp-contact')?.value?.trim() || '';
    st.notes    = document.getElementById('inp-notes')?.value || '';

    if (!st.gameName || !st.server || !st.contact) {
      alert('請填寫所有必填欄位（遊戲角色名稱、所在World、Discord Id）');
      return;
    }

    if (!bizStatus[st.date]?.isOpen || !isCurrentWeek(st.date)) { alert('此日期已關閉預約，請重新選擇。'); return; }
    const availTimes = getAvailTimes(st.date);
    if (!availTimes.includes(st.time)) { alert(`${st.time} 場次已不在開放範圍，請重新選擇。`); return; }

    showLoading(true);
    const newHeadcount = st.visitType === 'seat' ? st.seatCount : 1;
    try {
      // 送出前重新抓最新狀態，縮小競態視窗
      const [shiftsSnap, bookedSnap] = await Promise.all([
        get(dbRef(db, `publicShifts/${st.date}`)), get(dbRef(db, `bookedSlots/${st.date}`)),
      ]);
      publicShifts[st.date] = shiftsSnap.val() || {};
      bookedSlots[st.date]  = bookedSnap.val()  || {};

      if (st.apostle && st.apostle !== 'none') {
        if (!isApostleOnDuty(st.date, st.apostle, st.time)) {
          const name = APOSTLES.find(a => a.uid===st.apostle)?.name || '該使徒';
          alert(`${name} 在 ${st.time} 已無排班，請重新選擇使徒。`);
          st.apostle = null; st.designated = false; renderGrid(); updateSubmitBtn(); showLoading(false); return;
        }
        const slot = getApostleSlotStatus(st.date, st.apostle).find(ts => ts.time===st.time);
        if (slot?.blocked) {
          const name = APOSTLES.find(a => a.uid===st.apostle)?.name || '該使徒';
          alert(`${name} 在 ${st.time} 已被預約，請重新選擇。`);
          st.apostle = null; st.designated = false; renderGrid(); updateSubmitBtn(); showLoading(false); return;
        }
      }

      // 用交易安全地檢查並累加當日人數上限，避免競態超收
      const hcResult = await runTransaction(dbRef(db, `dailyHeadcount/${st.date}`), cur => {
        const now = cur || 0;
        if (now + newHeadcount > DAILY_CAPACITY) return; // 中止交易，資料不變
        return now + newHeadcount;
      });
      if (!hcResult.committed) {
        alert(`${fmtDate(st.date)} 線上預約人數已達上限（${DAILY_CAPACITY} 人），請選擇其他日期。`);
        showLoading(false);
        return;
      }

      const key = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const res = {
        id: key, date: st.date, time: st.time, visitType: st.visitType,
        services: [...st.services],
        photoSig: st.photoSig, photoExtra: st.photoExtra,
        designated: st.designated, apostle: st.apostle,
        seatType: st.visitType === 'seat' ? st.seatType : null,
        seatCount: st.visitType === 'seat' ? st.seatCount : null,
        rp: st.rp, rpNote: st.rpNote,
        gameName: st.gameName, server: st.server, contact: st.contact, notes: st.notes,
        total: calcTotal(), status: 'new', createdAt: new Date().toISOString(),
      };
      const updates = { [`reservations/${key}`]: res };
      if (st.apostle && st.apostle !== 'none') {
        updates[`bookedSlots/${st.date}/${sKey(st.time)}/${st.apostle}`] = true;
      }

      const lookupKey = sanitizeKey(st.gameName) + '_' + sanitizeKey(st.server);
      const lookupSnap = await get(dbRef(db, `customerLookup/${lookupKey}`));
      if (!lookupSnap.exists()) {
        const custId = 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        updates[`customers/${custId}`] = {
          id: custId, name: st.gameName, discord: st.contact, server: st.server,
          contact: '', notes: '', pointsTotal: 0, hasRedeemedUltimate: false,
          createdAt: new Date().toISOString(),
        };
        updates[`customerLookup/${lookupKey}`] = true;
      }

      await update(dbRef(db), updates);
      showLoading(false);
      renderSuccess2(st.gameName);
    } catch(e) {
      console.error(e);
      // dailyHeadcount 的規則只允許公開「累加」，不允許公開「扣減」（避免有人惡意重設人數繞過上限），
      // 所以這裡沒辦法在最後一步失敗時自動退回已預扣的人數——寧可少賣一個名額，也不要有機會被超收繞過。
      // 如果之後常常發生（人數上限計算跟實際 reservations 對不上），要手動去 Firebase 把 dailyHeadcount 校正回來。
      showLoading(false);
      alert('送出失敗，請稍後再試一次。');
    }
  }

  function renderSuccess2() {
    const formCol = document.querySelector('.bk2-form-col');
    if (formCol) formCol.style.display = 'none';
    const gridContent = document.querySelector('.bk2-grid-content');
    if (gridContent) gridContent.style.gridColumn = '1 / -1';
    document.querySelector('.bk2-grid-content').innerHTML = `
      <div style="flex:1;text-align:center;padding:3rem 1.5rem;background:linear-gradient(to bottom,rgba(184,144,96,.15),transparent);max-width:480px;margin:0 auto;">
        <h2 style="font-family:'Noto Serif TC',serif;font-size:1.8rem;font-weight:700;color:var(--text);letter-spacing:.12em;margin-bottom:.8rem;">召引已記錄</h2>
        <div style="width:40px;height:1px;background:linear-gradient(to right,transparent,rgba(0,0,0,.2),transparent);margin:1rem auto;"></div>
        <p style="font-size:13px;color:var(--dim);line-height:2.5;text-align:center;">
          徬徨的靈魂啊，前來尋求理解的追尋者。<br>
          毋須憂慮，你的請求已傳達至安息地。<br><br>
          請加入 Elysium 的 Discord 伺服器，<br>
          等待司祭確認本次召引結果。<br><br>
          在回應到來之前，願你得以片刻安歇。
        </p>
        <a href="https://discord.gg/PGs2Zag2aC" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;width:100%;max-width:240px;padding:.75rem;background:var(--text);color:#fff;text-decoration:none;font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:.15em;cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;font-weight:500;margin-top:1.5rem;">加入 Discord 伺服器</a><br>
        <button onclick="resetForm2()" style="display:block;max-width:240px;margin:.8rem auto 0;padding:.7rem;background:transparent;border:1px solid var(--border);color:var(--dim);font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:.1em;cursor: url('image/arr-cursors/arr-small-link.cur'), pointer;transition:all .2s;width:100%;">再次預約</button>
      </div>`;
  }

  function resetForm2() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    const formCol = document.querySelector('.bk2-form-col');
    if (formCol) formCol.style.display = '';
    const gridContent = document.querySelector('.bk2-grid-content');
    if (gridContent) {
      gridContent.style.gridColumn = '';
      gridContent.innerHTML = '<div class="bk2-grid" id="bk2-grid"></div><div id="bk2-grid-hint"></div>';
    }
    st = { agreed:false, date:'', time:'', visitType:'', services:[], photoSig:false, photoExtra:0, apostle:null, designated:false, seatType:'', seatCount:1, rp:'', rpNote:'', gameName:'', server:'', contact:'', notes:'' };
    const modal = document.getElementById('agree-modal');
    const chk   = document.getElementById('modal-agree-chk');
    const btn   = document.getElementById('modal-enter-btn');
    if (modal) modal.style.display = '';
    if (chk) { chk.className = 'bk-cchk'; chk.innerHTML = ''; }
    if (btn) { btn.disabled = true; btn.style.opacity = '.2'; }
    renderGrid();
    initForm();
  }

  // ─────────────────────────────────────────────────────────────
  //  Preview mode
  // ─────────────────────────────────────────────────────────────
  if (PREVIEW) {
    var _PD = { agreed:true, date:'2026-07-01', time:'22:00', visitType:'ritual', services:['nomen30'],
                designated:false, apostle:'none', seatCount:1, rp:'light', rpNote:'',
                gameName:'徬徨的靈魂', server:'鳳凰', contact:'preview_user', notes:'' };
    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.bk === 'jump') {
        Object.assign(st, _PD);
        renderGrid();
        initForm();
      } else if (e.data.bk === 'block') {
        previewBlock = !previewBlock;
        if (st.apostle && st.apostle !== 'none') { st.apostle = null; st.designated = false; }
        renderGrid();
        if (e.source) e.source.postMessage({ bk:'blockState', on:previewBlock }, '*');
      }
    });
  }

  // ─────────────────────────────────────────────────────────────
  //  初始化
  // ─────────────────────────────────────────────────────────────
  async function init() {
    renderGrid();
    document.getElementById('bk2-form-inner').innerHTML =
      '<div style="padding:2rem 1.3rem;text-align:center;color:var(--dim);font-size:13px;letter-spacing:.08em;">載入中…</div>';
    await loadData();
    renderGrid();
    initForm();
    updateSubmitBtn();
  }
  init();

  // Mobile bottom sheet — expand when apostle grid scrolls out of view
  (function() {
    if (window.innerWidth > 900) return;
    var formCol  = document.getElementById('bk2-form-col');
    var gridArea = document.querySelector('.bk2-grid-content');
    if (!formCol || !gridArea) return;
    var obs = new IntersectionObserver(function(entries) {
      formCol.classList.toggle('sheet-open', !entries[0].isIntersecting);
    }, { threshold: 0 });
    obs.observe(gridArea);
    var handle = formCol.querySelector('.bk2-sheet-handle');
    if (handle) {
      handle.addEventListener('click', function() {
        formCol.classList.toggle('sheet-open');
      });
    }
    var panel = formCol.querySelector('.bk2-form-panel');
    if (panel) {
      panel.addEventListener('scroll', function() {
        if (formCol.classList.contains('sheet-open') && panel.scrollTop < -80) {
          formCol.style.transition = 'height .2s cubic-bezier(.4,0,.2,1)';
          formCol.classList.remove('sheet-open');
          formCol.addEventListener('transitionend', function reset() {
            formCol.style.transition = '';
            formCol.removeEventListener('transitionend', reset);
          });
        }
      });
    }
  })();

  // Panel lag-follow animation
  (function() {
    var panel = document.querySelector('.bk2-form-panel');
    if (!panel) return;
    var BASE = 24; // 1.5rem in px
    var cur = BASE;
    var lastSY = window.scrollY;
    function tick() {
      if (window.innerWidth <= 900) { panel.style.top = ''; requestAnimationFrame(tick); return; }
      var sy = window.scrollY;
      cur += (sy - lastSY) * 0.5;  // lag: drift in scroll direction
      lastSY = sy;
      cur += (BASE - cur) * 0.1;   // spring back to base
      panel.style.top = cur.toFixed(1) + 'px';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  Object.assign(window, {
    closeLightbox, toggleModalAgree, enterFromModal,
    selectDate2, selectTime2, selectVisitType2, selectSeatType2, changeSeatCount2,
    toggleSvc2, togglePhotoSig2, changePhotoExtra2,
    selectApostle2, selectRP2, submitRes2, resetForm2,
  });
  </script>

</body>
