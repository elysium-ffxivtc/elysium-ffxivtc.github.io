<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIETERSITE · 得標名單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #3a5f8a; --gold-dim: rgba(58,95,138,.12);
      --bg: #eef1f5; --panel: #e2e8ef; --card: #fbfcfe;
      --border: rgba(58,95,138,.15); --text: #1a2230; --dim: #64707d;
      --green: #2d7a50; --green-dim: rgba(45,122,80,.1); --red: #a8433a;
      --purple: #6b4a9e; --purple-dim: rgba(107,74,158,.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; cursor: inherit; }
    * { scrollbar-width: thin; scrollbar-color: rgba(58,95,138,.3) transparent; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(58,95,138,.3); border-radius: 5px; border: 2px solid var(--bg); background-clip: padding-box; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(58,95,138,.55); background-clip: padding-box; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; cursor: default; }
    a, button, [role="button"], select, [onclick] { cursor: pointer; }

    .hdr { display: flex; align-items: center; justify-content: space-between; padding: .72rem 1.5rem; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .hdr-title { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--gold); letter-spacing: .2em; }
    .main { flex: 1; padding: 1.25rem 1.5rem; max-width: 1100px; width: 100%; margin: 0 auto; display: none; }

    .filter-row { display: flex; gap: .5rem; margin-bottom: .85rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .seg-row { display: flex; flex-wrap: wrap; }
    .seg-btn { padding: .33rem .85rem; font-size: 12px; background: none; border: 1px solid var(--border); color: var(--dim); font-family: inherit; transition: all .15s; margin-right: -1px; }
    .seg-btn.on { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); z-index: 1; position: relative; }

    .res-card { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--dim); padding: .85rem 1rem; margin-bottom: .65rem; }
    .res-card.pending { border-left-color: var(--gold); }
    .res-card.completed { border-left-color: var(--green); opacity: .8; }
    .res-card.transferred { border-left-color: var(--purple); opacity: .85; }
    .res-card.noshow { border-left-color: var(--red); opacity: .6; }
    .res-hdr { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: .4rem; margin-bottom: .5rem; }
    .res-date { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--gold); }
    .res-status { font-size: 11px; padding: .12rem .5rem; border: 1px solid var(--border); color: var(--dim); }
    .res-status.pending { color: var(--gold); border-color: var(--gold); }
    .res-status.completed { color: var(--green); border-color: var(--green); }
    .res-status.transferred { color: var(--purple); border-color: var(--purple); }
    .res-status.noshow { color: var(--red); border-color: var(--red); }
    .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .4rem .9rem; font-size: 12.5px; margin-bottom: .5rem; }
    .res-field-label { color: var(--dim); font-size: 10.5px; }
    .res-note { font-size: 12.5px; color: var(--text); background: var(--bg); padding: .4rem .55rem; margin-top: .3rem; white-space: pre-wrap; }
    .res-actions { display: flex; gap: .5rem; margin-top: .6rem; flex-wrap: wrap; }

    .form-badge { font-size: 11px; padding: .12rem .5rem; border: 1px solid var(--border); color: var(--dim); }
    .form-badge.done { color: var(--green); border-color: var(--green); }
    .sub-box { border-top: 1px dashed var(--border); margin-top: .6rem; padding-top: .55rem; }

    .btn { padding: .38rem .85rem; font-size: 12px; border: none; font-family: inherit; transition: all .15s; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-gold:hover { background: #2c4a6e; }
    .btn-green { background: none; border: 1px solid var(--green); color: var(--green); }
    .btn-green:hover { background: var(--green-dim); }
    .btn-purple { background: none; border: 1px solid var(--purple); color: var(--purple); }
    .btn-purple:hover { background: var(--purple-dim); }
    .btn-danger { background: none; border: 1px solid var(--red); color: var(--red); }
    .btn-danger:hover { background: rgba(168,67,58,.08); }
    .btn-sm { padding: .3rem .7rem; font-size: 12px; }

    .empty-hint { font-size: 13px; color: var(--dim); padding: 1.5rem 0; text-align: center; }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: .5rem 1.2rem; font-size: 13px; z-index: 9999; pointer-events: none; transition: opacity .35s; white-space: nowrap; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(6,9,15,.45); z-index: 500; align-items: center; justify-content: center; padding: 1.2rem; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--border); width: 100%; max-width: 420px; padding: 1.4rem; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-family: 'Noto Serif TC', serif; font-size: 1rem; color: var(--gold); letter-spacing: .1em; margin-bottom: 1rem; }
    .form-label { font-size: 12px; color: var(--dim); margin-bottom: .28rem; margin-top: .65rem; }
    .form-label:first-child { margin-top: 0; }
    .form-input { width: 100%; padding: .55rem .7rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: 13px; font-family: inherit; outline: none; }
    .form-input:focus { border-color: var(--gold); }
    textarea.form-input { resize: vertical; min-height: 56px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.1rem; }

    .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .auth-box { text-align: center; width: 340px; padding: 2rem; }
    .auth-logo { font-family: 'Noto Serif TC', serif; font-size: 2.2rem; color: var(--gold); letter-spacing: .25em; margin-bottom: .4rem; }
    .auth-tagline { font-size: 13px; color: var(--dim); margin-bottom: 2.5rem; letter-spacing: .08em; }
    .auth-google-btn { width: 100%; justify-content: center; display: flex; align-items: center; }
    .auth-err { color: var(--red); font-size: 13px; margin-top: .75rem; min-height: 1.2em; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-title">✦ PIETERSITE · 得標名單</div>
  <div style="display:flex;align-items:center;gap:.85rem">
    <div id="user-badge" style="display:none;align-items:center;gap:.5rem;font-size:12px"></div>
  </div>
</header>

<div class="main" id="main">
  <div class="filter-row">
    <div class="seg-row" id="status-filter">
      <button class="seg-btn on" data-v="all" onclick="setFilter('all')">全部</button>
      <button class="seg-btn" data-v="pending" onclick="setFilter('pending')">待安排</button>
      <button class="seg-btn" data-v="completed" onclick="setFilter('completed')">已完成</button>
      <button class="seg-btn" data-v="transferred" onclick="setFilter('transferred')">已轉讓</button>
      <button class="seg-btn" data-v="noshow" onclick="setFilter('noshow')">未到訪</button>
    </div>
    <button class="btn btn-gold btn-sm" onclick="openAddModal()">＋ 新增得標記錄</button>
  </div>
  <div id="res-list"></div>
</div>

<!-- 新增/編輯 modal -->
<div class="modal-overlay" id="modal-winner" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">新增得標記錄</div>
    <div class="form-label">得標者角色名 *</div>
    <input class="form-input" id="f-winner" placeholder="得標者遊戲角色名">
    <div class="form-label">轉讓對象角色名（選填，僅轉讓時填寫）</div>
    <input class="form-input" id="f-transfer" placeholder="若資格有轉讓才填">
    <div class="form-label">得標館藏</div>
    <select class="form-input" id="f-apostle">
      <option value="">選擇館藏</option>
    </select>
    <div class="form-label">成交金額 (Gil)</div>
    <input class="form-input" type="number" id="f-amount" placeholder="0" min="0" step="10000">
    <div class="form-label">競藏日期</div>
    <input class="form-input" type="date" id="f-date">
    <div class="form-label">鑑賞狀態</div>
    <select class="form-input" id="f-status">
      <option value="pending">待安排</option>
      <option value="completed">已完成</option>
      <option value="transferred">已轉讓</option>
      <option value="noshow">未到訪</option>
    </select>
    <div class="form-label">備註</div>
    <textarea class="form-input" id="f-notes" placeholder="選填"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button>
      <button class="btn btn-gold btn-sm" onclick="saveWinner()">儲存</button>
    </div>
  </div>
</div>

<div id="auth-overlay" class="auth-overlay">
  <div id="auth-loading" class="auth-box">
    <div style="color:var(--dim);font-size:15px;letter-spacing:.1em">載入中…</div>
  </div>
  <div id="auth-login" class="auth-box" style="display:none">
    <div class="auth-logo">PIETERSITE</div>
    <div class="auth-tagline">得標名單</div>
    <button class="btn btn-outline auth-google-btn" style="background:var(--gold);color:#fff;font-weight:600" onclick="signInGoogle()">Google 登入</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
  <div id="auth-denied" class="auth-box" style="display:none">
    <div class="auth-logo" style="font-size:1.5rem;margin-bottom:1rem">無權限</div>
    <div style="color:var(--dim);font-size:13px;line-height:1.8;margin-bottom:1rem">此頁面僅限管理員與館員帳號使用。</div>
    <button class="btn btn-outline" style="width:100%" onclick="doSignOut()">登出</button>
  </div>
</div>

<!-- Toast -->
<div id="toast-wrap"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getDatabase, ref as dbRef, onValue, get, set, update, push, remove } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserPopupRedirectResolver, GoogleAuthProvider, signInWithPopup, getRedirectResult, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const app = initializeApp({
  apiKey:            "AIzaSyB6tK8gl1Nu6928Ju5IFAhXbG7iuYjQoBc",
  authDomain:        "pietersitepos.firebaseapp.com",
  databaseURL:       "https://pietersitepos-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "pietersitepos",
  storageBucket:     "pietersitepos.firebasestorage.app",
  messagingSenderId: "336617870672",
  appId:             "1:336617870672:web:c1d9280e94e6f6f77bc855"
});
const db   = getDatabase(app);
const auth = initializeAuth(app, {
  persistence:           [indexedDBLocalPersistence, browserLocalPersistence],
  popupRedirectResolver: browserPopupRedirectResolver,
});
getRedirectResult(auth).catch(() => {});

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const ROLE_LABEL   = { admin: '管理員', pilgrim: '館員', staff: '館藏' };
const STATUS_LABEL = { pending: '待安排', completed: '已完成', transferred: '已轉讓', noshow: '未到訪' };
const RP_LABEL     = { heavy: '重 RP', medium: '中 RP', light: '輕 RP', none: '無 RP' };

let currentUser = null;
let winners = {};
let apostles = {};
let submissions = {};
let filter = 'all';
let editingId = null;

onAuthStateChanged(auth, async user => {
  if (!user || user.isAnonymous) { showAuth('login'); return; }
  try {
    const staffSnap = await get(dbRef(db, 'staff/' + user.uid));
    if (staffSnap.exists()) {
      const data = staffSnap.val();
      if (data.role !== 'admin' && data.role !== 'pilgrim') { window.location.replace('index.html'); return; }
      currentUser = { uid: user.uid, email: user.email, ...data };
    } else {
      const pilgrimSnap = await get(dbRef(db, 'pilgrims/' + user.uid));
      if (!pilgrimSnap.exists()) { window.location.replace('index.html'); return; }
      currentUser = { uid: user.uid, email: user.email, role: 'pilgrim', displayName: pilgrimSnap.val().name || user.displayName || '' };
    }
    hideAuth();
    startListeners();
  } catch(e) {
    document.getElementById('auth-err').textContent = '系統錯誤：' + e.message;
    showAuth('login');
  }
});

function showAuth(s) {
  document.getElementById('auth-overlay').style.display = 'flex';
  ['login','loading','denied'].forEach(id => document.getElementById('auth-' + id).style.display = id === s ? '' : 'none');
}
function hideAuth() {
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}
function signInGoogle() {
  document.getElementById('auth-err').textContent = '';
  signInWithPopup(auth, new GoogleAuthProvider())
    .catch(e => { document.getElementById('auth-err').textContent = '登入失敗：' + e.message; });
}
function doSignOut() { signOut(auth).then(() => location.reload()); }

function startListeners() {
  document.getElementById('user-badge').style.display = 'flex';
  document.getElementById('user-badge').innerHTML = `
    <span>${esc(currentUser.displayName)}</span>
    <span style="font-size:11px;color:var(--dim);padding:.1rem .4rem;border:1px solid var(--border)">${ROLE_LABEL[currentUser.role]||''}</span>
    <button class="btn btn-outline btn-sm" onclick="window.location.href='index.html'" title="返回首頁" style="font-size:11px;padding:.2rem .45rem;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5 1 5.5V11h3.5V7.5h3V11H11V5.5L6 1.5Z" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/></svg></button>
    <button class="btn btn-outline btn-sm" onclick="doSignOut()">登出</button>`;

  onValue(dbRef(db, 'winners'), snap => { winners = snap.val() || {}; render(); });
  onValue(dbRef(db, 'winnerSubmissions'), snap => { submissions = snap.val() || {}; render(); });
  onValue(dbRef(db, 'apostles'), snap => {
    apostles = snap.val() || {};
    const sel = document.getElementById('f-apostle');
    const cur = sel.value;
    sel.innerHTML = '<option value="">選擇館藏</option>' +
      Object.entries(apostles).map(([uid, a]) => `<option value="${uid}">${esc(a.name||uid)}</option>`).join('');
    sel.value = cur;
    render();
  });
}

function setFilter(v) {
  filter = v;
  document.querySelectorAll('#status-filter .seg-btn').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render();
}

function apostleName(uid) {
  if (!uid) return '——';
  return apostles[uid]?.name || uid;
}

function render() {
  const list = document.getElementById('res-list');
  const entries = Object.entries(winners)
    .filter(([id, r]) => filter === 'all' || (r.status || 'pending') === filter)
    .sort((a, b) => (b[1].auctionDate || '').localeCompare(a[1].auctionDate || ''));

  if (!entries.length) { list.innerHTML = '<div class="empty-hint">沒有符合條件的得標記錄</div>'; return; }

  list.innerHTML = entries.map(([id, r]) => {
    const status = r.status || 'pending';
    const sub = submissions[id];
    return `<div class="res-card ${status}">
      <div class="res-hdr">
        <span class="res-date">${esc(r.auctionDate || '')}</span>
        <div style="display:flex;gap:.4rem">
          <span class="form-badge ${sub ? 'done' : ''}">${sub ? '表單已填寫' : '尚未填寫表單'}</span>
          <span class="res-status ${status}">${STATUS_LABEL[status] || status}</span>
        </div>
      </div>
      <div class="res-grid">
        <div><div class="res-field-label">得標者</div>${esc(r.winnerName)}</div>
        ${r.transferredTo ? `<div><div class="res-field-label">轉讓對象</div>${esc(r.transferredTo)}</div>` : ''}
        <div><div class="res-field-label">得標館藏</div>${esc(apostleName(r.apostleUid))}</div>
        <div><div class="res-field-label">成交金額</div>${(r.amount||0).toLocaleString()} Gil</div>
      </div>
      ${r.notes ? `<div class="res-note"><span class="res-field-label">備註</span><br>${esc(r.notes)}</div>` : ''}
      ${sub ? `<div class="sub-box res-grid">
        <div><div class="res-field-label">World</div>${esc(sub.server)}</div>
        <div><div class="res-field-label">聯絡方式</div>${esc(sub.contact)}</div>
        <div><div class="res-field-label">RP 程度</div>${esc(RP_LABEL[sub.rp] || sub.rp || '')}</div>
      </div>
      ${sub.rpNote ? `<div class="res-note"><span class="res-field-label">RP 備註</span><br>${esc(sub.rpNote)}</div>` : ''}
      ${sub.notes ? `<div class="res-note"><span class="res-field-label">其他備註</span><br>${esc(sub.notes)}</div>` : ''}` : ''}
      <div class="res-actions">
        <button class="btn btn-outline btn-sm" onclick="openEditModal('${id}')">編輯</button>
        <button class="btn btn-outline btn-sm" onclick="copyFormLink('${id}')">複製表單連結</button>
        ${status === 'pending' ? `
          <button class="btn btn-green btn-sm" onclick="markStatus('${id}','completed')">標記完成</button>
          <button class="btn btn-purple btn-sm" onclick="markStatus('${id}','transferred')">標記轉讓</button>
          <button class="btn btn-danger btn-sm" onclick="markStatus('${id}','noshow')">標記未到訪</button>
        ` : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteWinner('${id}')">刪除</button>
      </div>
    </div>`;
  }).join('');
}

function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = '新增得標記錄';
  document.getElementById('f-winner').value = '';
  document.getElementById('f-transfer').value = '';
  document.getElementById('f-apostle').value = '';
  document.getElementById('f-amount').value = '';
  document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('f-status').value = 'pending';
  document.getElementById('f-notes').value = '';
  document.getElementById('modal-winner').classList.add('open');
}

function openEditModal(id) {
  const r = winners[id];
  if (!r) return;
  editingId = id;
  document.getElementById('modal-title').textContent = '編輯得標記錄';
  document.getElementById('f-winner').value = r.winnerName || '';
  document.getElementById('f-transfer').value = r.transferredTo || '';
  document.getElementById('f-apostle').value = r.apostleUid || '';
  document.getElementById('f-amount').value = r.amount || '';
  document.getElementById('f-date').value = r.auctionDate || '';
  document.getElementById('f-status').value = r.status || 'pending';
  document.getElementById('f-notes').value = r.notes || '';
  document.getElementById('modal-winner').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-winner').classList.remove('open');
}

async function saveWinner() {
  const winnerName = document.getElementById('f-winner').value.trim();
  if (!winnerName) { alert('請輸入得標者角色名'); return; }
  const data = {
    winnerName,
    transferredTo: document.getElementById('f-transfer').value.trim(),
    apostleUid: document.getElementById('f-apostle').value,
    amount: parseInt(document.getElementById('f-amount').value, 10) || 0,
    auctionDate: document.getElementById('f-date').value,
    status: document.getElementById('f-status').value,
    notes: document.getElementById('f-notes').value.trim(),
    updatedAt: new Date().toISOString(),
    updatedBy: currentUser.displayName,
  };
  try {
    let id = editingId;
    if (editingId) {
      await update(dbRef(db, 'winners/' + editingId), data);
    } else {
      data.createdAt = data.updatedAt;
      data.createdBy = currentUser.displayName;
      const newRef = push(dbRef(db, 'winners'));
      id = newRef.key;
      await set(newRef, data);
    }
    await set(dbRef(db, 'winnerPublic/' + id), {
      winnerName: data.winnerName,
      apostleName: apostleName(data.apostleUid),
      auctionDate: data.auctionDate,
    });
    closeModal();
    showToast('已儲存');
  } catch(e) {
    alert('儲存失敗：' + e.message);
  }
}

function copyFormLink(id) {
  const url = location.origin + location.pathname.replace(/staffonly\/winners\.html$/, '') + 'winner-form.html?id=' + id;
  navigator.clipboard.writeText(url).then(
    () => showToast('已複製表單連結'),
    () => prompt('複製以下連結：', url)
  );
}

async function markStatus(id, status) {
  try {
    await update(dbRef(db, 'winners/' + id), {
      status, updatedAt: new Date().toISOString(), updatedBy: currentUser.displayName,
    });
    showToast('已更新狀態');
  } catch(e) {
    alert('更新失敗：' + e.message);
  }
}

async function deleteWinner(id) {
  const r = winners[id];
  if (!r) return;
  if (!confirm(`確定刪除「${r.winnerName}」的得標記錄？`)) return;
  try {
    await remove(dbRef(db, 'winners/' + id));
    await remove(dbRef(db, 'winnerPublic/' + id));
    await remove(dbRef(db, 'winnerSubmissions/' + id));
    showToast('已刪除');
  } catch(e) {
    alert('刪除失敗：' + e.message);
  }
}

function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 350); }, 2000);
}

Object.assign(window, { signInGoogle, doSignOut, setFilter, openAddModal, openEditModal, closeModal, saveWinner, markStatus, deleteWinner, copyFormLink });
</script>
